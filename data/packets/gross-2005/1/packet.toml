title = "Gross 2005 PCP-SAFT quadrupolar parameters"
description = "Table A1 PCP-SAFT records (m, sigma, epsilon/k, quadrupole moment Q, n_Q = 1) for carbon dioxide and nitrogen (literature-Q sets) and benzene, for the optional quadrupole-quadrupole family of ADR 0014. They are valid only with that family; they are not nonpolar PC-SAFT parameters. The source finds its mixing rule unsuitable for real mixtures with more than one quadrupolar component."
license_or_use_basis = "Numerical parameter values transcribed from a published table; no publisher full text is included."
tolerance_rationale = "The source reports fitted coefficients without uncertainty and AAD-% of vapor pressure and density against IUPAC, DIPPR and VDI data that are not retained here; the packet asserts no tolerance."

