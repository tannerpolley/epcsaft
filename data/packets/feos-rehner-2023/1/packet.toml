schema_version = 2
packet_id = "feos-rehner-2023"
packet_version = "1"
title = "Rehner 2023 PCP-SAFT binary parameters with their Esper 2023 pure dependencies (FeOs distribution)"
description = "Rehner et al. 2023 binary k_ij and induced-association records (7848 FeOs rows; the article SI MOESM4 has 7861, a different distribution) with the Esper 2023 pure records they reference."
license_or_use_basis = "CC-BY-NC-4.0; https://creativecommons.org/licenses/by-nc/4.0/; non-commercial use; exclude from commercial redistribution or obtain permission"
attribution = "Esper, T.; Bauer, G.; Rehner, P.; Gross, J. (2023) PCP-SAFT Parameters of Pure Substances Using Large Experimental Databases. Ind. Eng. Chem. Res., DOI 10.1021/acs.iecr.3c02255; Supporting Information DOI 10.1021/acs.iecr.3c02255.s001. Rehner, P.; Bardow, A.; Gross, J. (2023) Modeling Mixtures with PCP-SAFT: Insights from Large-Scale Parametrization and Group-Contribution Method for Binary Interaction Parameters. Int. J. Thermophys. 44, 179, DOI 10.1007/s10765-023-03290-3. Numerical values from FeOs contributors, feos-org/feos af84e3f9da2fac2d102d449cd07cbbb48237617b, parameters/pcsaft/rehner2023_binary.json and esper2023.json (MIT notice in source feos-distribution). Changes: decimal molar mass g/mol to kg/mol before binary64 rounding, explicit site topology, per-record admission or refusal, constant-sigma association-volume basis conversion for fitted cross edges, Eqs. 17-18 rules and zero-strength declarations made explicit."
tolerance_rationale = "Copied source parameters; equality with the pinned FeOs decimals is the only check. No physical-validation tolerance or applicability range is asserted."

