normalization = "Every value was transcribed digit by digit from the printed source table (born-digital page for park1996; 300-600 dpi renders of the scanned pages for benham1957, sagara1972 and hong1981) and checked a second time against the page image. Source-unit strings were converted to SI with exact decimal arithmetic and written as the shortest round-trip float string. Rows follow printed reading order (left column top to bottom, then right column; page order for hong1981). row_id is <source_key>-T1-<NNN> in that order."
transformations = [
  "park1996: T_K as printed; P_Pa = p/MPa * 1e6; x_H2 = x1 as printed; y_H2 empty (bubble-point rows).",
  "benham1957: T_K = (T/degF - 32) * 5/9 + 273.15; P_Pa = P/psia * 6894.757293168 (table footnote: all pressures absolute); x_H2 = liquid mole % H2 / 100; y_H2 = vapor mole % H2 / 100.",
  "sagara1972: T_K = T/degC + 273.15; P_Pa = P/atm * 101325; x_H2 and y_H2 as printed. Printed x_CH4 and y_CH4 were transcribed only to check that each pair sums to 1 within print precision.",
  "hong1981: T_K as printed in K; P_Pa = P/MPa * 1e6; x_H2 = 1 - printed liquid CH4 mole fraction; y_H2 = 1 - printed vapor CH4 mole fraction (the table reports CH4 fractions). Pure-methane endpoint rows (CH4 = 1.0000, footnote a) give x_H2 = y_H2 = 0. Author-labelled critical-point rows print a single composition in the vapor column; x_H2 = y_H2 = 1 - that value by the critical-point identity.",
  "source_row_class: pure_endpoint for printed pure-methane rows (x_H2 = y_H2 = 0), critical_marker for author-labelled critical points, ordinary for every other printed two-phase row, including rows with x_H2 < 0.01. Partitions and discrepancy scales are not source data; consumers own them (hydrogen-binary-vle/1 carried the issue #73 partitions and scales).",
]

