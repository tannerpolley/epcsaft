schema_version = 2
packet_id = "nasa-glenn-2002-hda-species"
packet_version = "1"
title = "NASA Glenn NASA9 ideal-gas records for hydrogen, methane, benzene and toluene"
description = "Gas-phase nine-coefficient NASA Glenn records (every source temperature interval, a1-a7, b1, b2, formation enthalpy at 298.15 K and molar mass) for the toluene hydrodealkylation species H2, CH4, C6H6 and C7H8, with the source gas constant R = 8.314510 J/(mol K) and standard pressure 1 bar."
license_or_use_basis = "NASA/TP-2002-211556 is the separately cited technical publication. The pinned NASA CEA machine-readable distribution is Apache 2.0; its full licence and upstream NOTICE, including the NASA/database attribution for data/thermo.inp, are retained in sources/LICENSE.txt and sources/NOTICE.txt. Factual coefficient records and a verbatim four-record excerpt are retained for scientific verification; no full report is included."
tolerance_rationale = "The coefficients are source values, not fitted here. Their evaluation is qualified by analyses/2026-hda-two-flash/scripts/nasa9_reference_check.py against the issue #73 reference table (abs 1e-6 J/(mol K) for cp and s, 1e-3 J/mol for h); no physical-validation tolerance against calorimetric data is asserted."

