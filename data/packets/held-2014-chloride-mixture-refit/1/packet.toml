title = "Held 2014 strategy 2 chloride brine refit (issue #575 stage A)"
description = "Unqualified stage-A candidate: Na+, Mg2+ and Ca2+ refit jointly on Hamer-Wu NaCl, Goldberg-Nuttall MgCl2/CaCl2 (<= 3.3 mol/kg), Rard-Miller 1987 NaCl-MgCl2 and Saad-Padova-Marcus 1980 NaCl-KCl-CaCl2 mixture osmotic coefficients at 298.15 K on held-2014-strategy2/2; water, Cl-, K+, Li+ and every u_i unchanged. Held-out water properties under the frozen #556 limits, Dinane-Mounir judged by source agreement (owner amendment 2026-10-16: per realization, the larger of the frozen limit and the Rard-Miller/Dinane-Mounir disagreement) (RMS/max, robust over 1,467 realizations): robinson-bower-1966 I<=3 0.0105/0.0189 fail (0/1,467 realizations pass; failing: 1467 realizations); robinson-bower-1966 I>3 0.0097/0.0183 pass; dinane-mounir-2003 I<=3 0.0008/0.0016 fail (1,466/1,467 realizations pass; failing: r1408); dinane-mounir-2003 I>3 0.0014/0.0024 pass. 298.15 K only; no K+/Li+ mixture, temperature or physical-validation claim."
license_or_use_basis = "Project-derived parameters for private scientific verification; no full paper content."
tolerance_rationale = "Held-out errors under the frozen #556 limits, with the owner's 2026-10-16 source-agreement limit for Dinane-Mounir, are stated in the description; numerical fitting, no physical validation."

