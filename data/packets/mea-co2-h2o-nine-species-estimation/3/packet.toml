packet_version = "3"
title = "Nine-species CO2-MEA-H2O current-best parameter bundle"
description = "The living nine-species ePC-SAFT bundle: nine components, thirty-six pairs, four model families, and the R4/R5 reaction correlations. Supersedes version 1 in three values — carbon-dioxide dispersion energy 169.21 K to 173.44025 K, a carbon-dioxide-water k_ij of 0.013262879176919628 where version 1 carried none, and a solvent-only relative permittivity where version 1 suppressed per ion."
license_or_use_basis = "Project-authorized parameter document copied byte-for-byte from the pinned MEA-Thermodynamics commit; no publisher full text is included."
tolerance_rationale = "The packet asserts no fit tolerance. The bundle is the model under development, not a published model reproduced: deviations computed with it are reported, never asserted against a threshold. The consuming analysis owns diagnostic scales and scoring."

