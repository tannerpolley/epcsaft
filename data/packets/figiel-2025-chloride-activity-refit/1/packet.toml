title = "Figiel aqueous chloride stage-1 refit"
description = "Native exact-derivative stage-1 refit under issue 209 D9. Aqueous LiCl, NaCl and KCl only. Four Na/K water/chloride k_ij and their dependent Born diameters form one feasible point, not determined estimates of this minimax; no parameter confidence intervals. Alcohol rows are report-only and several worsen. No methanol-ethanol pair is adopted."
license_or_use_basis = "Source-traceable fixed inputs and project-derived refit parameters retained for scientific verification under the source-specific use bases below; no full paper content is included."
tolerance_rationale = "All 156 aqueous chloride target rows meet 0.02 decade and D6 G1/G2/G5 water guards on stored parameters at 298.15 K and 1 bar. These campaign checks are numerical fitting, not physical validation or parameter confidence intervals."

