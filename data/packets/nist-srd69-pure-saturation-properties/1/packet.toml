packet_version = "1"
title = "NIST SRD 69 pure-component saturation properties"
description = "Reusable source-backed saturation-pressure and saturated-liquid-density observations for methane, ethane, and propane, retained as property inputs for pure-component workflows. The propane rows are auxiliary NIST reference-equation values, not the direct Glos experimental target."
license_or_use_basis = "Numeric property records and project-authored provenance are retained under the NIST Standard Reference Data use and redistribution terms; the packet contains no paper, figure, generated result, or model output."
tolerance_rationale = "The NIST records do not provide uncertainty columns in the retained query tables. This packet preserves the source values without asserting a numerical acceptance tolerance; any fitting or validation tolerance belongs to the consuming Regression or Validation campaign."

