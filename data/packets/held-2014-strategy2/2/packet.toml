title = "Held 2014 strategy 2 chloride parameters at 298.15 K, Eq. (21) closest approach"
description = "Packet /1 with the Debye-Hueckel closest approach of all six ions set to the Eq. (21) diameter 0.88 sigma, the convention that reproduces the authors' Figs. 1-2 (1:1 salts; analyses/reproduction/2014-held); applying it to Mg2+ and Ca2+ is a model-level convention. Section 2.1 says sigma; /1 keeps that transcription. k_ij(Na+/water) 0.00045485 and k_ij(K+/water) 0.1997222 are the Table 2 footnote a/b laws evaluated at 298.15 K only; FeOs's constant 0.0045 is a factor-10 evaluation of footnote a. Water sigma(T) uses exp(-0.01146 T) (Held 2008 Eq. 7), correcting the printed sign. Relative permittivity 78.09 is a declared Figiel 2025 supplement."
license_or_use_basis = "Numeric source transcription and project-authored metadata for private scientific verification; no full article content."
tolerance_rationale = "Transcription with a settled convention, not a fitted or qualified set; the mixed NaCl-MgCl2/NaCl-CaCl2 water properties fail the #556 limits (analyses/2026-chloride-brine-refit). No numerical acceptance tolerance is claimed."

