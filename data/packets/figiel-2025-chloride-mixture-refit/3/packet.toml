citation = "ePC-SAFT issue 575 stage-A native joint fit, 2026-10-16"
use_basis = "Qualified by owner decision 2026-10-16 for aqueous NaCl-MgCl2-CaCl2 chloride brines at 298.15 K and 1 bar over the ionic-strength range of its training and held-out data (domain issue-575-chloride-brine-298-15-k). Qualification limit: passes every held-out bucket in 1,466 of 1,467 printed-rounding realizations under the source-agreement criterion; fails only r1408 (every Dinane-Mounir value lowered by half a printed unit), where dinane-mounir-2003 I<=3 RMS 0.001376 exceeds its limit 0.001352 by 1.7 % and the maximum 0.0026 is within 0.0040. Held-out evidence covers only the two-salt NaCl-CaCl2 (Robinson-Bower) and NaCl-MgCl2 (Dinane-Mounir) mixtures at I = 0.45-8.03 mol/kg, against training at I = 0.001-9.87 mol/kg, so ternary Na-Mg-Ca brines are a composition extrapolation; above 8.03 mol/kg only training residuals and the Rard-Miller Table III MgCl2 reference check exist, and for MgCl2-rich brines they exceed the frozen Phi limits (Rard-Miller |dPhi| up to 0.039 against the 0.03 maximum; pure-MgCl2 Phi RMS 0.029 against the 0.01 RMS limit). Refit: Na+, Mg2+ and Ca2+ refit jointly on Hamer-Wu NaCl, Goldberg-Nuttall MgCl2/CaCl2 (<= 3.3 mol/kg), Rard-Miller 1987 NaCl-MgCl2 and Saad-Padova-Marcus 1980 NaCl-KCl-CaCl2 mixture osmotic coefficients at 298.15 K on figiel-2025-chloride-activity-refit/2; water, Cl-, K+, Li+ and every u_i unchanged. Held-out water properties under the frozen #556 limits, Dinane-Mounir judged by source agreement (owner amendment 2026-10-16: per realization, the larger of the frozen limit and the Rard-Miller/Dinane-Mounir disagreement) (RMS/max, robust over 1,467 realizations): robinson-bower-1966 I<=3 0.0072/0.0146 pass; robinson-bower-1966 I>3 0.0094/0.0157 pass; dinane-mounir-2003 I<=3 0.0007/0.0015 fail (1,466/1,467 realizations pass; failing: r1408); dinane-mounir-2003 I>3 0.0016/0.0028 pass. 298.15 K only; no K+/Li+ mixture, temperature or physical-validation claim."

