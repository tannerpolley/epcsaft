use_basis = "Aqueous liquid at 298.15 K and 100000 Pa. Yao is calibration, scored I <= 8.3 mol/kg; 455 printed-rounding realizations are sensitivity checks. Owner-amended Yao Phi RMS 0.0105 and upper-I El Guendouzi water-activity RMS 0.0032; the sampled 289-point tradeoff justified these amendments, with all other limits unchanged. Five Li coordinates refitted natively, theta=-0.2205 kg/mol and psi=0.024 kg^2/mol^2 fixed by discrete grid selection. Born diameter is at its 1.38 angstrom lower bound, so covariance is withheld. Song theta=0.010196 kg/mol and psi=-0.0005947 kg^2/mol^2 are report-only Pitzer comparators, not fitted EOS inputs or independent validation. Frozen /1 non-Li basis and its r1408 exception are retained. No independent Li-Mg validation, Li-Ca, K-Ca, ternary, vapor, mixed-solvent, nonaqueous, temperature, caloric or stability qualification. Lead delivered review and application adoption remain separate."

