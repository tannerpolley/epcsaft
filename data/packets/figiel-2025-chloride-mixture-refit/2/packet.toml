use_basis = "provisional: relaxed target. MgCl2: gamma max/mean 0.06407599491/0.02947203674, Phi max/mean 0.03957717574/0.01578270588 decade; CaCl2: gamma max/mean 0.04834780429/0.02311442551, Phi max/mean 0.0334417264/0.01328778411 decade. Binary aqueous MgCl2/CaCl2 at 298.15 K, 1 bar, 0.001-4.5 mol/kg on unchanged /1 aqueous LiCl/NaCl/KCl basis. Original 0.02-decade target not met; relaxed by owner 2026-10-06. Boundary optimum, k_ij not identified. No mixed-salt, ternary, temperature, density, caloric or alcohol qualification. No global-optimum, covariance or physical-validation claim. Inherits /1 Na/K feasible-point and identification limits. Delivered review and owner acceptance pending."

