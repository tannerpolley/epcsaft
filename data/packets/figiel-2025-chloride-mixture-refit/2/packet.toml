schema_version = 2
packet_id = "figiel-2025-chloride-mixture-refit"
packet_version = "2"
title = "Figiel chloride basis with native Li and cation mixing calibration (issue 658)"
description = "Aqueous liquid at 298.15 K and 100000 Pa. Yao is calibration, scored I <= 8.3 mol/kg; 455 printed-rounding realizations are sensitivity checks. Owner-amended Yao Phi RMS 0.0105 and upper-I El Guendouzi water-activity RMS 0.0032; the sampled 289-point tradeoff justified these amendments, with all other limits unchanged. Five Li coordinates refitted natively, theta=-0.2205 kg/mol and psi=0.024 kg^2/mol^2 fixed by discrete grid selection. Born diameter is at its 1.38 angstrom lower bound, so covariance is withheld. Song theta=0.010196 kg/mol and psi=-0.0005947 kg^2/mol^2 are report-only Pitzer comparators, not fitted EOS inputs or independent validation. Frozen /1 non-Li basis and its r1408 exception are retained. No independent Li-Mg validation, Li-Ca, K-Ca, ternary, vapor, mixed-solvent, nonaqueous, temperature, caloric or stability qualification. Lead delivered review and application adoption remain separate."
license_or_use_basis = "Project-derived parameters for private scientific verification; no full paper content."
tolerance_rationale = "Owner-amended design section 10: Yao Phi RMS/max 0.0105/0.027 in both buckets and all 455 realizations; Hamer-Wu 0.01/0.03; El Guendouzi low-I water activity 0.00144/0.00413, upper-I 0.0032/0.00758. These are calibration and model-comparison limits, not measurement uncertainty or physical validation."

