title = "Gross-Sadowski 2002 PC-SAFT associating pure parameters (FeOs distribution)"
description = "18 associating pure components of Gross and Sadowski 2002 Table 1 (2B) with explicit Wolbach-Sandler cross rules between every associating pair; no k_ij, so a binary selection refuses until its k_ij is supplied."
license_or_use_basis = "FeOs MIT distribution (notice in source feos-distribution); publication values cited, no article content copied."
attribution = "Gross, J.; Sadowski, G. (2002) Application of the Perturbed-Chain SAFT Equation of State to Associating Systems. Ind. Eng. Chem. Res. 41, 5510-5515, DOI 10.1021/ie010954d. Numerical values from FeOs contributors, feos-org/feos af84e3f9da2fac2d102d449cd07cbbb48237617b, parameters/pcsaft/gross2002.json. Changes: decimal molar mass g/mol to kg/mol before binary64 rounding, explicit site topology, per-record admission or refusal, Eqs. 2-3 cross rules declared."
tolerance_rationale = "Copied source parameters; equality with the pinned FeOs decimals is the only check. No physical-validation tolerance or applicability range is asserted."

