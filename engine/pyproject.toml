[build-system]
requires = ["meson-python>=0.18", "nanobind"]
build-backend = "mesonpy"

[project]
name = "epcsaft"
dynamic = ["version"]
description = "Unified ePC-SAFT engine for EOS, equilibrium, and regression"
# No readme: engine/README.md stays out of METADATA so a docs edit keeps the wheel SHA-256 (#355).
requires-python = ">=3.12"
license = { file = "LICENSE" } # GPLv3 with the Ipopt section 7 permission
dependencies = []

[project.optional-dependencies]
idaes = ["idaes-pse==2.12.0", "pyomo==6.10.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_logging = "system-out"
junit_log_passing_tests = true

[tool.ruff]
target-version = "py313"
# Relocated qualification drivers retain their source formatting and imports.
extend-exclude = ["tests/cases"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/epcsaft", "tests"]
mypy_path = "src"
python_version = "3.13"
strict = true
exclude = ["tests/cases/"]
