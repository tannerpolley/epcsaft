[build-system]
requires = ["meson-python>=0.18", "pybind11>=3.0"]
build-backend = "mesonpy"

[project]
name = "epcsaft"
dynamic = ["version"]
description = "Unified ePC-SAFT engine for EOS, equilibrium, and regression"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not expensive and not slow'"
markers = [
  "expensive: slow white-box numerical sentinel run explicitly",
  "slow: compact numerical evidence retained for full verification",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
packages = ["epcsaft"]
mypy_path = "src"
python_version = "3.13"
strict = true
