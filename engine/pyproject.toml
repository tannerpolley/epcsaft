[build-system]
requires = ["scikit-build-core>=0.12", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "epcsaft"
version = "0.1.0.dev0"
description = "Source-traceable ePC-SAFT thermodynamic provider"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["Pint>=0.25.3"]

[tool.scikit-build]
minimum-version = "0.12"
wheel.packages = ["src/epcsaft"]
wheel.exclude = ["epcsaft/_native/**"]
cmake.source-dir = "."
cmake.version = ">=3.20"
ninja.version = ">=1.11"

[tool.ruff]
line-length = 100
