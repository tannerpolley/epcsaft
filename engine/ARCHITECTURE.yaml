  - alternate derivative backends
  - compatibility interfaces
  - release and workflow machinery

ratchet:
  rule: Every increase must serve one named admitted capability and remove any displaced owner in the same checkpoint.
  reject:
    - parallel input or result representations
    - duplicate equation or derivative owners
    - sibling-source, lab, or migration runtime dependencies
    - hidden physical defaults or backend selectors
    - source files, tests, or dependencies unreachable from an admitted capability or its proof
  note: Line count is a cost ledger, not a code-golf target; moving semantics into opaque configuration does not reduce cost.
