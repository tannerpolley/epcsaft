      coordinate_order: [amount_mol, volume_m3]
      derivative_order: 3
      status: authority-determined-by-promotion-receipt
    - capsule: epcsaft.native_sdk.v1
      entry: evaluate_pure_phase_parameters
      coordinate_order: [amount_mol, volume_m3, segment_count, segment_diameter_angstrom, dispersion_energy_over_k]
