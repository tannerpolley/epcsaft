version: 4
status: unified-monorepo-active
governance_doctrine_revision: 14

artifact:
  repository: tannerpolley/ePC-SAFT
  source_directory: engine
  distribution: epcsaft
  python: ">=3.13"
  build_owner: pyproject.toml
  native_build_owner: CMakeLists.txt
  runtime_dependencies: [Pint]
  public_modules: [epcsaft, epcsaft.equilibrium, epcsaft.regression]

owners:
  parameters:
    input: epcsaft.Parameters
    persistence: src/epcsaft/_document_io.py
    resolution: src/epcsaft/_resolve.py
    active_set: epcsaft.ActiveParameterSet
  eos:
    models: [epcsaft.Pure, epcsaft.Mixture]
    state: epcsaft.State
    active_parameters: epcsaft.ActiveParameterSet
    observable_descriptor: epcsaft.ObservableDescriptor
    observable_block: epcsaft.ObservableBlock
    equation_kernel: src/epcsaft/_native/helmholtz.hpp
    selected_parameter_derivatives: src/epcsaft/_native/phase_block.hpp
    density_closure: src/epcsaft/_native/density.hpp
    pure_saturation: src/epcsaft/_native/pure_saturation.cpp
    reference_states: src/epcsaft/reference.py
  equilibrium:
    public_module: epcsaft.equilibrium
    python_api: src/epcsaft/equilibrium/_api.py
    native_sources: cpp/equilibrium
    nonreactive_numerical_core: held_held2
    incumbent_public_route: tp_flash
    candidate_public_route: phase_equilibrium
    candidate_status: transition_not_promoted
    transition_decision: docs/equilibrium/adr/0002-protect-held-until-phase-equilibrium-promotion.md
    phase_modes: [discovery, declared_role_constraint_over_retained_result]
    phase_kinds: [liquid, vapor]
    phase_order: incumbent_native_order
    role_classification: provisional_compressibility_bounds_fail_closed
    maximum_certified_phase_count: 2
    target_maximum_phase_count: 3
    rejected_phase_counts: [3]
    hints: validated_not_applied
    automatic_fallback: forbidden
    active_parameters: epcsaft.ActiveParameterSet
    solved_state_sensitivity: exact_implicit_from_eos_partials
  regression:
    public_module: epcsaft.regression
    parameter_fit: epcsaft.regression.ParameterFit
    schema_owner: src/epcsaft/regression/_model.py
    resolution: src/epcsaft/regression/_resolve.py
    fit: epcsaft.regression.fit
    result: epcsaft.regression.FitResult
    native_fit: src/epcsaft/regression/native/fit.cpp
    native_sources: src/epcsaft/regression/native
    scientific_values: owner_provided_only
    current_observation_boundary: [eos_fixed_state, eos_pure_saturation]
  native_transport:
    implementation: src/epcsaft/_native
    public_cpp_abi: forbidden
    installed_headers: forbidden

canonical_plans:
  capability_cutover: docs/plans/2026-08-07-general-scientific-capability-hard-cutover.md
  eos: docs/eos/plans/2026-08-07-general-eos-parameter-derivatives.md
  regression: docs/regression/plans/2026-08-07-owner-driven-parameter-fit.md
  equilibrium: docs/equilibrium/plans/2026-08-07-general-phase-equilibrium.md

scientific_boundaries:
  reusable_packets: data
  installed_artifact_evidence: validation
  exploratory_workflows: lab
  packet_access: explicit_materialization_only
  sibling_discovery: forbidden
  regression_transfer: typed_immutable_parameters

build_invariants:
  distributions: 1
  versions: 1
  wheels: 1
  cmake_roots: 1
  editable_downstream_dependencies: forbidden
  compatibility_aliases: forbidden
  installed_provider_discovery: forbidden
  mutable_wheel_inputs: forbidden
  development_wheel_cache: content_addressed_and_verified
  source_specific_runtime_routes: forbidden
  inferred_parameter_defaults: forbidden

validation:
  retained_tests: numerical_algorithm_and_scientific_workflow_only
  normal_test_routing: affected_scientific_domain
  full_test_routing: default_plus_slow_numerical_evidence
  package_test_mode: installed_wheel
  required_module_origins: [epcsaft, epcsaft.equilibrium, epcsaft.regression]
  installed_wheel_readiness: ../tools/verify-installed-wheel.py
  phase_equilibrium_campaign: ../validation/campaigns/2026-khudaida/tests/test_khudaida_phase_equilibrium.py
  phase_equilibrium_promotion: blocked_until_adr_0002_gate
  materialized_packet_receipts: tests/fixtures/data/*/materialization-v2.json
  external_authority_gate: governance_g7
