  normal_test_routing: affected_scientific_domain
  full_test_routing: default_plus_slow_numerical_evidence
  package_test_mode: installed_wheel
  required_module_origins: [epcsaft, epcsaft.equilibrium, epcsaft.regression]
  installed_wheel_readiness: ../tools/verify-installed-wheel.py
  phase_equilibrium_campaign: ../validation/campaigns/2026-khudaida/tests/test_khudaida_phase_equilibrium.py
