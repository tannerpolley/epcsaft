      status: authority-determined-by-promotion-receipt
    - capsule: epcsaft.native_sdk.v1
      entry: evaluate_mixture_phase
      coordinate_order: [component_amounts_mol_in_parameter_order, volume_m3]
      derivative_order: 2
      status: local-candidate-pending-independent-review-and-promotion-receipt
    - capsule: epcsaft.native_sdk.v1
      entry: evaluate_mixture_phase_kij
      coordinate_order: [methane_amount_mol, ethane_amount_mol, volume_m3, k_ij]
      derivative_order: 2
