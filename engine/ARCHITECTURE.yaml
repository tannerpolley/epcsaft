version: 11
status: unified-monorepo-active
governance_doctrine_revision: 24

artifact:
  repository: tannerpolley/ePC-SAFT
  source_directory: engine
  distribution: epcsaft
  python: ">=3.13"
  build_owner: pyproject.toml
  native_build_owner: meson.build
  runtime_dependencies: [Pint]
  public_modules: [epcsaft, epcsaft.equilibrium, epcsaft.regression]

owners:
  scientific_records:
    map: docs/scientific
    decisions: docs/scientific/adr
    formulation: docs/science/full-provider-eos.md
    equation_registry: docs/equations_registry.yaml
    generated_equation_views: docs/latex
    public_api_guide: docs/python-api.md
  parameters:
    input: epcsaft.Parameters
    persistence: src/epcsaft/_document_io.py
    resolution: src/epcsaft/_resolve.py
    active_set: epcsaft.ActiveParameterSet
  eos:
    models: [epcsaft.Pure, epcsaft.Mixture]
    state: epcsaft.State
    active_parameters: epcsaft.ActiveParameterSet
    observable_descriptor: epcsaft.ObservableDescriptor
    observable_block: epcsaft.ObservableBlock
    equation_kernel: src/epcsaft/_native/helmholtz.hpp
    selected_parameter_derivatives: src/epcsaft/_native/phase_block.hpp
    density_closure: src/epcsaft/_native/density.hpp
    pure_saturation: src/epcsaft/_native/pure_saturation.cpp
    reference_states: src/epcsaft/reference.py
  equilibrium:
    public_module: epcsaft.equilibrium
    python_api: src/epcsaft/equilibrium/_api.py
    native_sources: cpp/equilibrium
    nonreactive_numerical_core: held_held2
    public_route: solve
    promotion_status: accepted
    promotion_receipt: ../validation/campaigns/2026-khudaida/results/receipts/cap-09-phase-equilibrium-promotion.json
    transition_decision: docs/scientific/adr/0002-protect-held-until-phase-equilibrium-promotion.md
    promotion_decision: governance_D-030
    phase_specifications: [fixed_tp_feed, fixed_t_coexistence]
    phase_modes: [omitted_topology_discovery, declared_topology_solve]
    phase_kinds: [liquid, vapor]
    component_support: [all_components, neutral_components, declared_neutral_components]
    fixed_tp_component_support: all_components
    fixed_tp_maximum_vapor_count: 1
    coexistence_partner_support: [all_components, neutral_components]
    phase_order: declared_topology_order
    role_classification: native_mechanical_stability_and_volume_branch_order
    discovery_maximum_phase_count: 2
    maximum_certified_phase_count: 3
    target_maximum_phase_count: 3
    hints: non_authoritative_order_over_fixed_candidate_set
    discovery_hints: forbidden_without_declared_topology
    declared_topology_fallback: forbidden
    active_parameters: epcsaft.ActiveParameterSet
    solved_state_sensitivity: exact_implicit_from_eos_partials
    general_reactive_equilibrium:
      request: epcsaft.equilibrium.GeneralReactiveEquilibriumProblem
      result: epcsaft.equilibrium.GeneralReactiveEquilibriumResult
      public_route: epcsaft.equilibrium.solve
      native_solve: cpp/equilibrium/grepe.cpp
      reaction_compiler: cpp/equilibrium/chemical_equilibrium_compiler.cpp
      phase_direction_compiler: cpp/equilibrium/phase_direction_compiler.cpp
      finite_reactive_owner: cpp/equilibrium/reactive_finite_phase.cpp
      admitted_formulations: [finite, finite_incipient, intensive_boundary, temperature_boundary]
      topology: request_declared
      component_support: request_declared
      formulation: total_gibbs_with_global_conservation
      globality_claim: configured_local_minimum_only
      admission: governance_D-037_proven_core
  regression:
    public_module: epcsaft.regression
    parameter_fit: epcsaft.regression.ParameterFit
    schema_owner: src/epcsaft/regression/_model.py
    resolution: src/epcsaft/regression/_resolve.py
    fit: epcsaft.regression.fit
    result: epcsaft.regression.FitResult
    native_fit: src/epcsaft/regression/native/fit_core.cpp
    native_binding: src/epcsaft/regression/native/fit_pybind.cpp
    native_sources: src/epcsaft/regression/native
    optimizer: ipopt
    scientific_values: owner_provided_only
    current_observation_boundary: [eos_fixed_state, eos_pure_saturation, equilibrium_general_reactive]
    generic_equilibrium_evaluator: epcsaft.equilibrium.solve
    generic_equilibrium_observation: epcsaft.equilibrium.GeneralEquilibriumOwnerObservation
    equilibrium_observation_admission: general_reactive_equilibrium
    equilibrium_observation_families: [general_reactive]
  native_core:
    extension: epcsaft._core
    static_libraries: [eos_core, equilibrium_core, regression_core]
    meson_targets:
      eos_core: epcsaft_engine_eos_core
      equilibrium_core: epcsaft_engine_equilibrium_core
      regression_core: epcsaft_engine_regression_core
      extension: _core
    permitted_internal_links:
      equilibrium_core: [eos_core]
      regression_core: [eos_core, equilibrium_core]
      extension: [eos_core, equilibrium_core, regression_core]
    binding_sources: [src/epcsaft/_native, cpp/equilibrium, src/epcsaft/regression/native/fit_pybind.cpp]
    internal_types: direct_cpp
    python_inside_static_libraries: forbidden
    private_transport_abi: forbidden
    iterative_python_callbacks: forbidden
    public_cpp_abi: forbidden
    installed_headers: forbidden
    state_lifetimes:
      public_grepe_compilation: once_per_request
      regression_grepe_structure: once_per_distinct_concrete_experiment_structure
      regression_source_values: once_per_exact_optimizer_coordinate
      full_space_accepted_state: finalized_once_after_convergence
      thread_and_tape_policy: measured_no_change_issue_86_comment_5442040189

canonical_plans:
  capability_cutover: docs/plans/2026-08-07-general-scientific-capability-hard-cutover.md
  eos: docs/eos/plans/2026-08-07-general-eos-parameter-derivatives.md
  regression: docs/regression/plans/2026-08-07-owner-driven-parameter-fit.md
  equilibrium: docs/equilibrium/plans/2026-08-07-general-phase-equilibrium.md
  grepe_target: docs/equilibrium/plans/2026-08-14-general-reactive-equilibrium-phase-equilibrium.md

final_cutover:
  status: accepted
  decision: governance_D-032
  subject_commit: a8efa571d52c32f5a697f15dd7f4623b7e3613fd
  subject_tree: c710bec469f7442952979e096a260cccb5a84246
  receipt: ../governance/receipts/cap-11-hard-cutover-retirement.json

