version: 13
status: greenfield-stage-0

# The rule this file exists to state: C++ is organised by dependency layer,
# because include direction is the only structural fact a checker can enforce.
# Python is organised by capability, because that is what a caller imports.
# The two do not mirror each other on purpose.

artifact:
  repository: tannerpolley/ePC-SAFT
  source_directory: engine
  distribution: epcsaft
  python: ">=3.13"
  build_owner: pyproject.toml
  native_build_owner: meson.build
  runtime_dependencies: [Pint]
  public_modules: [epcsaft, epcsaft.equilibrium]

plan:
  transfer: ../docs/greenfield/TRANSFER.md
  carry_over: ../docs/greenfield/CARRY-OVER.md
  acceptance: tests/oracle
  performance_floor: ../docs/greenfield/EOS.md
  stability_findings: ../docs/greenfield/PHASE-STABILITY.md

native:
  root: native
  archive: epcsaft_native
  extension: epcsaft._core
  checker: ../tools/check-engine-architecture.py
  # Downward only. bindings may include anything; nothing includes bindings.
  layers: [physics, model, equilibrium, regression, bindings]
  layer_content:
    physics: no CppAD types, no solver
    model: EOS state and exact derivatives, no phase concept
    equilibrium: one minimization, its rows, its stability
    regression: parameter fitting against declared problems
    bindings: the only pybind11 includes
  # regression/ may call solve_equilibrium and solve_phase_boundary on a problem
  # with declared phases; it may not reach phase stability, because a fit needs
  # differentiable residuals and a discovered phase count is not one.
  regression_boundary:
    permitted: [equilibrium/problem.hpp, solve_equilibrium, solve_phase_boundary]
    forbidden: [phase_stability.hpp, find_phases, problems with omitted topology]
  invariants:
    static_libraries: 1
    native_extensions: 1
    python_inside_static_library: forbidden
    installed_headers: forbidden
    public_cpp_abi: forbidden
    iterative_python_callbacks: forbidden
    constant_defined_twice: forbidden
    category_one_constants_home: physics/physical_constants.hpp

python:
  root: src/epcsaft
  # Python maps inputs to _core and _core results to types. It performs no
  # arithmetic: a frontend call is agnostic to what it is solving.
  numerics: forbidden
  capabilities: [eos, equilibrium, regression]
  exports:
    epcsaft: 11
    epcsaft.equilibrium: 9

formulation:
  # Phase equilibrium, chemical equilibrium, and the coupled problem are one KKT
  # system: B = I, one phase, or both. The affinity vanishes because B*nu = 0.
  objective: sum_p [A_p(T, V_p, n_p) + P V_p] + sum g0 n
  coordinates: [log n_p, log eta_p]
  pressure_equality: stationarity row
  specification: degrees_of_freedom
  well_posedness: unknowns versus independent equations, failing by name
  document: docs/equilibrium/formulation.md
  stability_source: Pereira et al. 2012, Comput. Chem. Eng. 36, 99-118
  not_expressible: [solids, critical points, kinetics]

naming:
  # No proper nouns in identifiers. Source names are citations, not symbols.
  # HELD in particular read as the wrong author here: Christoph Held is a
  # parameter source in this repository's bibliography, and the algorithm is not
  # his.
  proper_nouns_in_identifiers: forbidden
  retired: [HELD, Held2, GREPE, Provider, step numbering]

evidence:
  # Tests follow the Python side, because a test is written against a
  # user-facing claim, not a compilation unit. No numerical/behavior split.
  organisation: by_capability
  basis: real mixtures and measured data
  route_specific_gates: forbidden
  downstream_specific_flags: forbidden
  oracle: tests/oracle/oracle.json
  reactive_baseline: tests/oracle/reactive_vle_baseline.json
  floor: tests/oracle/floor-measurements.json
  entry_point_profile: tests/oracle/entry-point-profile.json

scientific_boundaries:
  reusable_packets: data
  installed_artifact_evidence: analyses
  packet_access: explicit_materialization_only
  sibling_discovery: forbidden

build_invariants:
  distributions: 1
  versions: 1
  wheels: 1
  meson_roots: 1
  editable_downstream_dependencies: forbidden
  compatibility_aliases: forbidden
  mutable_wheel_inputs: forbidden
  third_party_cmake_use: nlopt_subproject_only
  inferred_parameter_defaults: forbidden
