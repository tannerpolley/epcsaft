  status: authority-determined-by-promotion-receipt
  scope: >-
    Model-bound fixed-temperature pure nonassociating phase Helmholtz value,
    state gradient/Hessian/third tensor, active pure-parameter gradient/Hessian,
    pressure, and chemical-potential diagnostic.
  exclusions: mixture, association, electrolyte, binary fitted parameters, density solve, phase identity, Ipopt, Ceres, equilibrium, and regression targets

native_sdk_candidates:
  held_water_self_ionization_reference_v1:
    status: private-local-candidate-no-authority-effect
    scope: >-
      Exact ordered water, hydronium-cation, and hydroxide-anion Held 2008
      mechanical phase model at 298.15 K and 1 bar, plus one neutral 1:1
      formula-unit infinite-dilution log-fugacity sum and direct pure-water
      reference from the sole native reference-sequence owner.
    ordered_components: [water, hydronium-cation, hydroxide-anion]
    ordered_charges: [0, 1, -1]
    parameter_bundle: held-2008-water-self-ionization@1
    parameter_fingerprint: sha256:cc40aeb2902bfc9a7be46ceb066cfdb41c5cd5d1024fe119be3d559b75f8a256
    helmholtz_basis_id: A_over_RT_reference_amount:n_ref=1mol:rho_ref=1mol_per_m3
    source_state: {temperature_k: 298.15, pressure_pa: 100000.0}
    formulation: held-2008-debye-huckel
    contributions: [ideal, hard_chain, dispersion, association, debye_huckel]
    absent_contributions: [born]
    sdk_table_size_bytes_64_bit: 224
    standard_reference_result_size_bytes_64_bit: 368
    reference_sequence_owner: epcsaft::detail::electrolyte_reference_sequence in src/epcsaft/_native/electrolyte_reference.hpp
    authority_effect: none
    exclusions: reaction equilibrium, equilibrium constants, reactive standard-state transformation, individual-ion predictive standard chemical potentials, density-root ownership, phase identity, Ipopt, Ceres, regression, compatibility routes, promotion, receipt, and release
  packing_fraction_hessian_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      Exact model fingerprint, temperature, positive ordered component amounts,
      and extensive volume mapped to packing fraction and exact first and second
      derivatives through the Provider CppAD and packing owners.
    coordinate_order: [component_amounts_mol_in_parameter_order, volume_m3]
    derivative_order: 2
    result_owner: size-gated caller scalar, gradient, and Hessian buffers with return-code status
    exclusions: packing limits, fixed volumes, equilibrium constraints, initialization, search policy, phase identity, density subsystem, compatibility shim, and authority
  molar_volume_bounds_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      Exact model fingerprint, temperature, and ordered normalized composition
      mapped from caller-owned packing-fraction limits to lower and upper molar
      volumes through the Provider packing owner.
    inputs: [parameter_fingerprint, temperature_k, mole_fractions_in_parameter_order, packing_fraction_min, packing_fraction_max]
    output: [molar_volume_lower_m3_per_mol, molar_volume_upper_m3_per_mol]
    result_owner: size-gated caller double buffer with return-code status
    exclusions: fixed volumes, equilibrium, initialization, search policy, phase identity, fitting, domain registry, compatibility shim, and authority
  full_electrolyte_phase_hessian_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      Exact immutable Figiel, Khudaida, and Ascani electrolyte selections evaluated as
      complete ideal-plus-residual phase Helmholtz blocks with pressure in
      ordered positive component amounts and extensive volume.
    coordinate_order: [component_amounts_mol_in_parameter_order, volume_m3]
    derivative_order: 2
    contributions: [ideal, hard_chain, dispersion, association, debye_huckel, model_bound_born]
    exclusions: density solve, phase identity, complementarity, trace-species policy, third derivatives, Ipopt, equilibrium, regression, fitting, and authority
  neutral_mixture_phase_hessian_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      Source-backed Gross--Sadowski methane/ethane extensive phase value,
      gradient, Hessian, and pressure diagnostic in ordered component amounts
      and volume.
    coordinate_order: [component_amounts_mol_in_parameter_order, volume_m3]
    derivative_order: 2
    exclusions: association, electrolyte, density solve, phase identity, parameter derivatives, third derivatives, Ipopt, Ceres, equilibrium, and regression targets
  neutral_mixture_active_kij_hessian_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      Model-bound Gross--Sadowski methane/ethane extensive phase value,
      gradient, Hessian, and pressure with one finite active unlike-pair k_ij.
    coordinate_order: [methane_amount_mol, ethane_amount_mol, volume_m3, k_ij]
    derivative_order: 2
    exclusions: association, electrolyte, density solve, phase identity, third derivatives, Ipopt, Ceres, equilibrium, regression targets, fit bounds, scaling, and fit acceptance
  figiel_water_active_born_solvation_v1:
    status: local-candidate-pending-independent-review-and-promotion-receipt
    scope: >-
      One model-bound 298.15 K, 1 bar water x-process single-ion solvation
      Gibbs energy and its first total fixed-pressure derivative with respect
      to the selected current-catalog ion Born diameter.
    active_coordinate: born_diameter_angstrom
    derivative_order: 1
    required_prefix_size_bytes_64_bit: 168
    current_table_size_bytes_64_bit: 224
    result_size_bytes_64_bit: 272
    admitted_active_components: [lithium-cation, sodium-cation, potassium-cation, chloride-anion, bromide-anion]
    reference_sequence_owner: epcsaft::detail::electrolyte_reference_sequence in src/epcsaft/_native/electrolyte_reference.hpp
    public_delegation: EPCSAFT.reference_state -> private epcsaft._core binding -> reference_sequence_owner
    native_delegation: evaluate_ion_solvation_born -> reference_sequence_owner
    public_behavior_change: none
    ownership_check: schedule, composition, convergence, and terminal selection exist only in reference_sequence_owner
    exclusions: targets, residuals, scaling, bounds, Ceres, fit results, catalog persistence, other solvents or states, other ions, solvation-factor or dielectric parameters, generic parameter overlays, second derivatives, and authority

