    Neutral, associating, and bounded Figiel electrolyte EOS at explicit molar
    density or specified pressure, plus bounded electrolyte reference states.
  candidate_promotion_status: promoted

local_candidate:
  name: native-sdk-v1-pure-phase-block
  status: provider-evidence-passed-consumer-gate-pending
  scope: >-
    Model-bound fixed-temperature pure nonassociating phase Helmholtz value,
    state gradient/Hessian/third tensor, active pure-parameter gradient/Hessian,
    pressure, and chemical-potential diagnostic.
  exclusions: mixture, association, electrolyte, binary fitted parameters, density solve, phase identity, Ipopt, Ceres, equilibrium, and regression targets

accepted_scope: >-
  Source-backed neutral, associating, and bounded ionic SSM+DS residual EOS at
  explicit molar density or specified pressure, with residual chemical,
  fugacity, caloric, density-root, and bounded electrolyte reference results.

