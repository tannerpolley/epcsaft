    math: "\\epsilon_{r,\\mathrm{sf}}=\n\\frac{\\sum_{s\\in\\mathcal{S}}x_sM_s\\epsilon_{r,s}}\n{\\sum_{s\\in\\mathcal{S}}x_sM_s}."
  - eqid: "same_sign_ionic_dispersion"
    section: "Parameter setup"
    subsection: ""
    source: "[Figiel2025], same-sign ion exclusion; [Ji2012] §2.1 and Eq.~(4), all-ion-pair dispersion and ion-based species with dispersion among all ion pairs; [Held2014] text after Eqs.~(21)--(22)"
    status: "Implementation convention"
    description: "Select the source-declared dispersion rule for equally charged ions."
    change_note: "The caller selects all ion pairs or same-sign exclusion as part of the electrolyte model family. #641: C is the opt-in set of charged molecules (`fixed.charged_molecule_ion`, no default). The pair i, j in C includes i = j, so a declared ion keeps its self pair with k_ii = 0; two different declared molecules of the same sign keep their pair under the combining rule and need a declared k_ij like any applicable pair."
    math: "\\epsilon_{ij}=\\begin{cases}\\sqrt{\\epsilon_i\\epsilon_j}(1-k_{ij}),&z_iz_j\\leq 0,\\ \\text{all-ion-pair dispersion, or } i,j\\in C,\\\\0,&z_iz_j>0,\\ \\text{same-sign exclusion, and not } i,j\\in C.\\end{cases}"
  - eqid: "segment_sigma_correlation"
    section: "Parameter setup"
    subsection: ""
    source: "Source-resulted component correlation represented by the EOS parameter fields"
    status: "Bounded empirical relation"
    description: "Evaluate a component segment-size correlation from its constant and exponential terms."
    change_note: "Mirrors the general sparse correlation implemented by segment_sigma."
    math: "\\sigma_i(T)=\\sigma_{i,0}+\\sum_{q\\in\\mathcal{Q}_i} A_q\\exp(b_qT)."
  - eqid: "single_ion_activity_coefficient"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], electrolyte reference-state fugacity relation"
    status: "Source equation"
    description: "Single-ion mole-fraction activity coefficient relative to the infinite-dilution fugacity reference."
    change_note: "Exposes the exponential of the finite-minus-reference log fugacity."
    math: "\\gamma_i^{(x)}=\n\\exp\\left(\\ln\\phi_i-\\ln\\phi_i^\\infty\\right)."
  - eqid: "solid_amount_complementarity"
    section: "Equilibrium pure stoichiometric solids"
    subsection: ""
    source: "KKT conditions of the Gibbs minimum with the bound n_s ≥ 0 and no stationarity row for n_s; issue #573"
    status: "Exact derivation"
    description: "Complementarity between the solid amount n_s (mol) and its saturation index; Ipopt's returned bound multiplier of n_s on the extensive objective G/RT is z_s = −A_s/RT, so (n_s/N_feed) z_s is the barrier parameter at an interior-point endpoint."
    change_note: "One endpoint classification makes the declaration square: present (n_s/N_feed > z_s, saturation row) or absent (n_s = 0). The rule replaced A_s/RT ≥ −ε after the barrier left a stable solid at −A_s/RT above ε for small excess feeds."
    math: "n_s\\ge 0,\\qquad \\mathrm{SI}_s\\le 0,\\qquad n_s\\,\\mathrm{SI}_s=0."
  - eqid: "solid_material_balance"
    section: "Equilibrium pure stoichiometric solids"
    subsection: ""
    source: "`material_balance` with the solids' moiety columns; issue #573"
    status: "Exact derivation"
    description: "Conserved-moiety balance over the fluid phases and the free solid amounts; the solid term adds n_s g_s/RT to the objective and is linear in n_s, so it adds no curvature."
    change_note: "No upper bound on n_s: the balance bounds it."
    math: "\\sum_p N_p\\,\\mathbf{B}\\,\\mathbf{x}_p+\\sum_s n_s\\,\\mathbf{B}\\boldsymbol\\nu_s=\\mathbf{B}\\,\\mathbf{n}_{\\mathrm{feed}}."
  - eqid: "solid_saturation_index"
    section: "Equilibrium pure stoichiometric solids"
    subsection: ""
    source: "affinity of dissolution at the solved fluid state; with `chemical_potential_stationarity`, Σ_i ν_{s,i} μ_i = RT λ·(Bν_s) because Σ_i ν_{s,i} z_i = 0; issue #573"
    status: "Exact derivation"
    description: "Saturation index of solid s in decades; at the optimizer endpoint its scaled affinity is the bound multiplier, z_s = −A_s/RT, and the row g_s/RT − λ·Bν_s = 0 holds for a present solid."
    change_note: "A Pinned(0) solid reports SI_s at the solved fluid state without a coordinate or row."
    math: "\\mathrm{SI}_s=\\frac{A_s}{RT\\ln 10},\\qquad \\frac{A_s}{RT}=\\frac{\\sum_i\\nu_{s,i}\\mu_i-g_s}{RT}=\\boldsymbol\\lambda\\cdot(\\mathbf B\\boldsymbol\\nu_s)-\\frac{g_s}{RT}."
  - eqid: "solid_standard_gibbs"
    section: "Equilibrium pure stoichiometric solids"
    subsection: ""
    source: "dissolution S(s) = Σ_i ν_{s,i} A_i with Σ_i ν_{s,i} μ_i° − μ_s° = −RT ln K_s; the density-basis constant from `neutral_reaction_reference_transfer` at the source standard pressure P°; issue #573, ADR 0013"
    status: "Exact derivation"
    description: "Standard Gibbs energy of a pure stoichiometric solid at unit activity on its pure-solid standard state, with g_i the compiled fluid standard vector, ln K_s^ρ the sourced dissolution constant converted on the charge-neutral fluid-side stoichiometry at the declared reference pressure P°, and V_s the declared solid molar volume."
    change_note: "P° is required, so ∂g_s/∂P = V_s exactly at fixed T; a transfer at system pressure would add the dissolved ions' infinite-dilution partial molar volume. Only ln K_s is physical: a shift of g_i along the balance row space moves the objective by a constant. ln K_s^ρ is linear in T about the solved temperature (first-order T actions)."
    math: "g_s(T,P)=\\sum_i\\nu_{s,i}\\,g_i(T)+RT\\ln K_s^{\\rho}(T,P^\\circ)+V_s\\,(P-P^\\circ)."
  - eqid: "solvent_mole_weighted_bulk_permittivity"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[Bulow2021a], Theory, Eq. (19); solvent normalization requested in #896"
    status: "Implementation convention"
    description: "Sum over an explicitly declared nonempty set $S$ of neutral solvents, using total-mixture mole fractions. Normalization is an explicit fixed declaration."
    change_note: "Component laws use component_permittivity_temperature_polynomial; the same expression supplies temperature/composition derivatives to DH and Born. No density or explicit ion term. The normalized form requires a positive solvent total at every evaluated point; no value is assigned at zero solvent total."
    math: "N=\\sum_{s\\in S}x_s\\epsilon_{r,s}(T),\\qquad D=\\sum_{s\\in S}x_s,\n\\qquad \\epsilon_{r,\\mathrm{bulk}}=\n\\begin{cases}N&\\text{unnormalized (Bülow Eq. 19)},\\\\\nN/D&\\text{solvent-normalized},\\ D>0.\\end{cases}"
  - eqid: "source_log_equilibrium_constant_observation"
    section: "Parameter regression"
    subsection: "Reaction observations"
    source: "`reaction_constant_ln_polynomial` (Austgen et al. 1989, ln K(T) correlation); coefficient differentiation and existing Difference residual, issue #211"
    status: "Exact derivation"
    description: "A direct observation is the named reaction's declared source-basis natural-log equilibrium constant at fixed positive temperature. It does not contain the EOS reference contraction or an equilibrium-state derivative."
    change_note: "Fixed source declarations and Tref; a/b/c/d units are 1, K, 1, K⁻¹. Scalar K admits ln K with the a basis only. Reuse named-coordinate tying and rejection of fixed thermochemistry, affinity targets and dependent sets. Only Difference residuals are admitted. An absolute ln K uncertainty σ uses scale=1 and weight=σ⁻²; a chosen nondimensionalization scale requires the corresponding weight transformation. Covariance retains ALG-FIT's local rank/bound/error assumptions."
    math: "y_r(T)=\\ln K_{src,r}(T)=a_r+\\frac{b_r}{T}+c_r\\ln\\frac{T}{T_{ref,r}}+d_rT,\n\\qquad\n\\frac{\\partial y_r}{\\partial\\theta_{s,k}}=\\delta_{rs}\\left(1,\\frac1T,\\ln\\frac{T}{T_{ref,r}},T\\right)_k,\n\\qquad\n\\frac{\\partial y_r}{\\partial\\theta_{EOS}}=0,\n\\qquad r_i=\\frac{y_i-y_{obs,i}}{scale_i}."
  - eqid: "speed_of_sound"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Thermodynamic speed of sound in m/s: the composition-frozen acoustic limit without transport, chemical relaxation or phase redistribution."
    change_note: "Computed only on request; availability of `isentropic_compressibility`, plus a positive molar mass for every occupied species. M is in kg/mol; zero-fraction species do not contribute."
    math: "w=\\frac{1}{\\sqrt{\\rho_m M\\kappa_S}}=\\sqrt{\\frac{c_p}{c_v}\\frac{P_\\rho}{M}},\\qquad M=\\sum_i x_iM_i."
  - eqid: "standard_pressure_density_conversion"
    section: "Reference thermochemistry"
    subsection: ""
    source: "Exact derivation from the ideal chemical potential and h = -T squared times the temperature derivative of g/T at fixed standard basis"
    status: "Exact derivation"
    description: "Fixed P0 and rho0; Delta nu is the sum of reaction stoichiometric coefficients, products positive. The density-basis enthalpy coefficient is an offset; total physical calorics remain basis invariant."
    change_note: "Reconciled against transfer audit 2026-09-06; required mathematics, not an availability claim."
    math: "g^{\\circ}_{i,\\rho}=g^{\\circ}_{i,P}+RT\\ln\\frac{RT\\rho_0}{P_0},\\qquad h^{\\circ}_{i,\\rho}=h^{\\circ}_{i,P}-RT,\\qquad s^{\\circ}_{i,\\rho}=s^{\\circ}_{i,P}-R\\left(1+\\ln\\frac{RT\\rho_0}{P_0}\\right),\\\\\n\\ln K_\\rho=\\ln K_P-\\Delta\\nu\\ln\\frac{RT\\rho_0}{P_0},\\qquad \\frac{d\\ln K_\\rho}{dT}=\\frac{d\\ln K_P}{dT}-\\frac{\\Delta\\nu}{T}."
  - eqid: "standard_state_transfer_parameter_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Implicit differentiation of the pressure closure in an active EOS coordinate at fixed temperature, reference pressure and ion-free solvent composition of the neutral reaction reference"
    status: "Exact derivation"
    description: "First derivative in an active EOS parameter theta, at fixed temperature and reference pressure, of the returned reference limit. psi=Ares/(RT) is evaluated at N=1 mol and V=1/rho. ln K_src and the molality scale A are parameter independent, so the target slope is -dC/dtheta. It maps to species through the same minimum-norm owner as the value and enters each chemical row linearly in theta at the solved state."
    change_note: "One active coordinate at fixed T/P and ion-free solvent fractions. The parameter scale used in polarization is max(abs(theta),1) in native units, with max(abs(d_V),1e-3 m3/mol) for dielectric volume. Scaling is restored after extraction; it introduces no approximation or column admission tolerance. Referenced enthalpy additionally consumes `standard_state_transfer_temperature_parameter_derivative`; heat capacity consumes `reference_mixed_temperature_pressure_derivatives`."
    math: "p_\\theta=-RT\\psi_{V\\theta},\\quad V_\\theta=-p_\\theta/p_V,\\qquad\n\\left.\\frac{dC}{d\\theta}\\right|_{T,P}=\\sum_i\\nu_i\\psi_{n_i\\theta}+C_VV_\\theta,\\\\\n\\frac{\\partial\\ln K_\\rho}{\\partial\\theta}=\\left.\\frac{dC}{d\\theta}\\right|_{T,P},\\qquad\n\\frac{\\partial s_r}{\\partial\\theta}=-\\left.\\frac{dC_r}{d\\theta}\\right|_{T,P}."
  - eqid: "standard_state_transfer_temperature_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Implicit differentiation of the pressure closure at the fixed ion-free solvent composition of the neutral reaction reference; Lambda = ln phi + ln(P/(RT rho0)) and RT^2 d ln phi_i/dT|_P = -hbar_i^res"
    status: "Exact derivation"
    description: "First temperature derivative at fixed reference pressure of the returned reference limit and of the density-basis equilibrium constant. psi=Ares/(RT) is evaluated at N=1 mol and V=1/rho, and the source basis term A is temperature independent. The target is transported as s=-ln K_rho, whose slope maps to species through the same minimum-norm owner as its value."
    change_note: "Differentiate the returned solvent insertion with `reference_single_insertion_taylor`, retaining the implicit density and site chains. No finite dilution or terminal-change criterion is evaluated. A system-pressure row combines this slope with the pressure jet. The second T derivative and active-parameter derivatives have their own requested columns."
    math: "p_T=R(V^{-1}-\\psi_V)-RT\\psi_{VT},\\quad V_T=-p_T/p_V,\\\\\n\\left.\\frac{dC}{dT}\\right|_P=\\sum_i\\nu_i\\psi_{n_iT}+C_VV_T,\\qquad\nRT^2\\left.\\frac{dC}{dT}\\right|_P=-\\sum_i\\nu_i\\left(\\bar h_i^{res}+RT\\right),\\\\\n\\frac{d\\ln K_\\rho}{dT}=\\frac{d\\ln K_{src}}{dT}+\\left.\\frac{dC}{dT}\\right|_P,\\qquad\n\\Delta h_\\rho=\\Delta h_{src}+RT^2\\left.\\frac{dC}{dT}\\right|_P,\\qquad\ns_r'=-\\frac{d\\ln K_{\\rho,r}}{dT}."
  - eqid: "standard_state_transfer_temperature_parameter_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Mixed implicit differentiation of the isobaric reference contraction and pressure closure along one active EOS coordinate, at fixed temperature, reference pressure and ion-free solvent composition"
    status: "Exact derivation"
    description: "Mixed derivative $\\partial^2C/\\partial T\\partial\\theta$ of the returned reference limit, with $\\psi=A^{res}/(RT)$ at $N=1$ mol. It supplies the EOS-coordinate derivative of referenced reaction enthalpy; $C$ is independent of the solved equilibrium state."
    change_note: "Evaluate only for a consumed referenced-enthalpy parameter column. The shared single-insertion Taylor calculation supplies the mixed partial at the ion-free solvent root, with exact Born, association and density chains. A failed column retains its action cause and does not erase values or sibling directions. Higher consumed derivatives follow `reference_mixed_temperature_pressure_derivatives` and `reference_species_calorics`."
    math: "\\mathbf w=\\mathbf e_T+V_T\\mathbf e_V,\\quad\n\\mathbf u=\\mathbf e_\\theta+V_\\theta\\mathbf e_V,\\quad\nV_\\theta=-\\frac{p_\\theta}{p_V},\\\\\nD^2C[\\mathbf w,\\mathbf u]=\\sum_i\\nu_iD^3\\psi[\\mathbf e_{n_i},\\mathbf w,\\mathbf u]\n+\\Delta\\nu\\frac{V_TV_\\theta}{V^2},\\\\\nD^2p[\\mathbf w,\\mathbf u]=-R\\left(\\psi_{V\\theta}+V_\\theta\\psi_{VV}+\\frac{V_\\theta}{V^2}\\right)\n+\\frac{2RTV_TV_\\theta}{V^3}-RTD^3\\psi[\\mathbf e_V,\\mathbf w,\\mathbf u],\\\\\nV_{T\\theta}=-\\frac{D^2p[\\mathbf w,\\mathbf u]}{p_V},\\quad\n\\frac{\\partial^2C}{\\partial T\\,\\partial\\theta}=D^2C[\\mathbf w,\\mathbf u]+C_VV_{T\\theta},\\quad\n\\frac{\\partial\\Delta_rh_\\rho}{\\partial\\theta}=RT^2\\frac{\\partial^2C}{\\partial T\\,\\partial\\theta},\\\\\nD^3\\psi[\\mathbf q,\\alpha\\mathbf w+\\mathbf u,\\alpha\\mathbf w+\\mathbf u]\n-D^3\\psi[\\mathbf q,\\alpha\\mathbf w-\\mathbf u,\\alpha\\mathbf w-\\mathbf u]\n=4\\alpha D^3\\psi[\\mathbf q,\\mathbf w,\\mathbf u],\\quad\n\\mathbf q\\in\\{\\boldsymbol\\nu,\\mathbf e_V\\},\\quad\n\\alpha=\\frac{\\|\\mathbf u\\|_s}{\\|\\mathbf w\\|_s}."
  - eqid: "standard_state_transfer_temperature_pressure_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Implicit differentiation of C_P = C_V/p_V (`neutral_reaction_reference_pressure_jet`) along the isobaric temperature direction w of `standard_state_transfer_temperature_second_derivative`, at the fixed ion-free solvent composition"
    status: "Exact derivation"
    description: "Mixed temperature-pressure derivative of the returned reference limit of a system-pressure reference, with psi = Ares/(RT) at N = 1 mol. The shared single-insertion Taylor owner evaluates the raw source-pressure partial at the resolved terminal state. It supplies s_TP = -d2C/dTdP to the chemical rows of second-order actions that move temperature and pressure, and the pressure slope of the EOS-basis reaction enthalpy, d(Delta_r h_rho)/dP = RT^2 d2C/dTdP, to reference species calorics."
    change_note: "Evaluate when pressure and temperature columns are both requested. A fixed source pressure gives exact zero system-pressure derivatives. Differentiate the same returned solvent insertion; a failed mixed column leaves values and sibling columns available. Higher orders are supplied only by `reference_mixed_temperature_pressure_derivatives`."
    math: "\\mathbf{w}=\\mathbf{e}_T+V_T\\mathbf{e}_V,\\qquad\nDC_V[\\mathbf{w}]=\\sum_i\\nu_iD^3\\psi[\\mathbf{e}_{n_i},\\mathbf{e}_V,\\mathbf{w}]+\\Delta\\nu\\,V_T/V^2,\\\\\nDp_V[\\mathbf{w}]=R\\left(-V^{-2}-\\psi_{VV}\\right)+\\frac{2RTV_T}{V^3}-RT\\,D^3\\psi[\\mathbf{e}_V,\\mathbf{e}_V,\\mathbf{w}],\\\\\n\\frac{\\partial^2C}{\\partial T\\,\\partial P}=\\frac{1}{p_V}\\left(DC_V[\\mathbf{w}]-\\frac{C_V\\,Dp_V[\\mathbf{w}]}{p_V}\\right),\\qquad\n\\frac{\\partial^2s_r}{\\partial T\\,\\partial P}=-\\frac{\\partial^2C_r}{\\partial T\\,\\partial P},\\qquad\n\\frac{\\partial\\Delta_rh_\\rho}{\\partial P}=RT^2\\frac{\\partial^2C}{\\partial T\\,\\partial P}."
  - eqid: "standard_state_transfer_temperature_second_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Second implicit differentiation of the pressure closure at the fixed ion-free solvent composition; for identical species RT^2 dLambda/dT = -(h^res + RT) gives d2Lambda/dT2 = -(c_p^res + R)/(RT^2) + 2(h^res + RT)/(RT^3)"
    status: "Exact derivation"
    description: "Second temperature derivative at fixed reference pressure of the returned reference limit along w = e_T + V_T e_V, with psi = Ares/(RT) at N = 1 mol. The shared single-insertion Taylor owner evaluates this lower partial, including implicit association and pressure closure. It supplies the EOS-basis reaction heat capacity consumed by reference species calorics."
    change_note: "Evaluate only for a consumed heat-capacity value, enthalpy temperature action or second temperature action. The analytic solvent-limit column supplies s_TT=-(d2 ln K_src/dT2 + C_TT). Numerical failures retain their causes independently. Qualification retains the existing 0.01 J/(mol K) scaled comparison with the pinned finite calculation; this comparison is outside runtime."
    math: "\\mathbf{w}=\\mathbf{e}_T+V_T\\mathbf{e}_V,\\qquad\nD^2C[\\mathbf{w},\\mathbf{w}]=\\sum_i\\nu_iD^3\\psi[\\mathbf{e}_{n_i},\\mathbf{w},\\mathbf{w}]+\\Delta\\nu\\,V_T^2/V^2,\\\\\nD^2p[\\mathbf{w},\\mathbf{w}]=-\\frac{2RV_T}{V^2}+\\frac{2RTV_T^2}{V^3}\n-R\\left(2(\\psi_{VT}+V_T\\psi_{VV})+T\\,D^3\\psi[\\mathbf{e}_V,\\mathbf{w},\\mathbf{w}]\\right),\\\\\nV_{TT}=-\\frac{D^2p[\\mathbf{w},\\mathbf{w}]}{p_V},\\qquad\n\\left.\\frac{d^2C}{dT^2}\\right|_P=D^2C[\\mathbf{w},\\mathbf{w}]+C_VV_{TT},\\qquad\n\\Delta c_{p,\\rho}=2RT\\frac{d\\ln K_\\rho}{dT}+RT^2\\frac{d^2\\ln K_\\rho}{dT^2}."
  - eqid: "system_gibbs_helmholtz_coordinates"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eqs. 2--4; exact derivation from $G=\\min_V[A+PV]$"
    status: "Exact derivation"
    description: "System Gibbs objective in Helmholtz coordinates; density-standard offsets appear exactly once and are consistent with ideal_gas_helmholtz. The ideal-gas base uses q = ln[(1/v)/rho0], v = exp(-q)/rho0 for unit-amount volume v; at an unnormalized trial S = sum_i x_i, physical density is S/v."
    change_note: "Use either mechanical energy plus offsets or total energy, never both reference terms. At fixed q, v_q = -v, v_qq = v and composition/temperature partials vanish. Do not normalize trial compositions."
    math: "\\frac{G}{RT}=\\sum_p\\left[\\frac{A_{p,\\mathrm{mech}}}{RT}+\\frac{PV_p}{RT}+\\sum_i n_{p,i}\\frac{g^{\\circ}_{i,\\rho}}{RT}\\right]."
  - eqid: "tangent_plane_descent_uncertainty"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "First-order propagation, Euler homogeneity and final-summation rounding; #223 adopted estimated-uncertainty criterion"
    status: "Implementation convention"
    description: "ε_tg estimates trial reduced molar energy error; ε_pμi donor reduced chemical error; ε_pP pressure-row error; ε_f feasibility/representation correction; ε_fp arithmetic. Include supplied standard-term uncertainty separately in the applicable energy/chemical terms. F_n and F_V denote native association derivative-floor estimates in unit-mol amount and SI volume columns. For the single full candidate amount correction, freeze ν_j^0=μ_j^0/(RT) at the parent; d=m¹−m⁰ is the stored update, u=δ−d its update-rounding discrepancy, m²=N′x′ the physical representation and m³=N′exp(ℓ′) its reported log representation. C_n is the applied and representation displacement in mol; ε_f is extensive G/(RT) on the request amount basis. Update rounding contributes only to ε_f, retaining nonzero uncertainty when a stored update rounds away. Candidate and donor consumers share the final totals."
    change_note: "Report association residual/conditioning and Euler defect at reevaluated points. A maximum floor may replace each column floor with its scale retained. γ_m bounds final summation rounding only, not the EOS evaluator. Local first-order estimates are not certified enclosures."
    math: "\\begin{aligned}\nq_j&=|m_j^2-m_j^1|+|m_j^3-m_j^2|,\\qquad\nC_n=\\sum_j(|d_j|+q_j),\\qquad\n\\epsilon_f=\\sum_j(|d_j|+|u_j|+q_j)|\\nu_j^0|,\\\\\nE_d&=\\epsilon_{tg}+\\sum_i|w_i|\\epsilon_{p\\mu i}\n+\\epsilon_{pP}+\\epsilon_f+\\epsilon_{fp},\\\\\n\\epsilon_{tg,\\mathrm{assoc}}&\\approx\\sum_i|w_i|F_{t,n_i}+|v_t|F_{t,V},\\qquad\n\\epsilon_{pP,\\mathrm{assoc}}\\approx|v_p|F_{p,V},\\\\\n\\epsilon_{\\mathrm{Euler}}&=\\left|a^{\\mathrm{res}}-\\sum_i w_i a^{\\mathrm{res}}_{n_i}-v a^{\\mathrm{res}}_V\\right|,\\qquad\n\\epsilon_{\\mathrm{sum}}\\le\\gamma_m\\sum_j|\\mathrm{term}_j|,\\quad\n\\gamma_m=\\frac{m\\varepsilon_{\\mathrm{mach}}}{1-m\\varepsilon_{\\mathrm{mach}}},\\\\\nt&<0,\\quad d_p<-E_d\\quad\\text{admit numerical slope descent only with all terms available;}\n\\quad d_p+E_{\\mathrm{bound}}<0\\quad\\text{requires justified total bounds for proof}.\n\\end{aligned}"
  - eqid: "tangent_plane_distance"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "[Michelsen1982] Part I; [Pereira2012] Eq. 12; [Perdomo2025] §3.3 Eqs. 37–40; [Ascani2022] §3.3 Eqs. 33–35; conserved-plane extension adopted in #223"
    status: "Exact derivation"
    description: "Reduced molar tangent-plane distance at fixed positive T/P, normalized charge-neutral composition w on support S and molar volume v in m³/mol; e is the all-ones vector and z contains charge numbers. The mechanical reduced energy includes residual and ideal-density Helmholtz energy plus Pv/RT; s is the dimensionless density-standard offset and π the chemical balance plane."
    change_note: "Freeze standards including reference transfer and gauge at the solved snapshot. Chemical λ is dimensionless here, unlike dimensional chemical_potential_stationarity. A negative plane value needs feasible donor withdrawal and error qualification; finite search supplies no global certificate."
    math: "\\begin{aligned}\n\\widetilde g(\\mathbf w,v)&=\\frac{a_{\\mathrm{mech}}(\\mathbf w,v)}{RT}+\\frac{Pv}{RT},\\qquad\ns_i=\\frac{g^\\circ_{i,\\rho}(T,P)}{RT},\\qquad \\boldsymbol\\pi=\\mathbf B^{\\mathsf T}\\boldsymbol\\lambda,\\\\\nt(\\mathbf w,v)&=\\widetilde g(\\mathbf w,v)+\\mathbf w^{\\mathsf T}(\\mathbf s-\\boldsymbol\\pi),\\qquad\n\\mathbf e^{\\mathsf T}\\mathbf w=1,\\quad \\mathbf z^{\\mathsf T}\\mathbf w=0,\\quad\nw_i>0\\ (i\\in S),\\ w_i=0\\ (i\\notin S).\n\\end{aligned}"
  - eqid: "tangent_plane_donor_descent"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "First variation of system_gibbs_helmholtz_coordinates along conserved donor withdrawal; #223 adopted derivation"
    status: "Exact derivation"
    description: "Withdraw βw from strictly positive donor p containing S and create βw in the trial, holding donor and trial molar volumes fixed. β and its capacity are mol; d_p is the per-mole slope of extensive G/RT."
    change_note: "Compute the donor slope directly from physical gradients; chemical plane uncertainty cancels. A negative TPD without finite positive donor capacity is an unresolved plane trial."
    math: "\\begin{aligned}\n\\beta_{\\max,p}&=\\min_{i\\in S}\\frac{n_{p,i}}{w_i}>0,\\\\\nd_p=\\left.\\frac{d(G_{\\mathrm{split}}/RT)}{d\\beta}\\right|_{0}\n&=\\widetilde g(\\mathbf w,v_t)+\\mathbf s^{\\mathsf T}\\mathbf w\n-\\mathbf w^{\\mathsf T}\\left(\\frac{\\boldsymbol\\mu_{\\mathrm{mech},p}}{RT}+\\mathbf s\\right)+r_{Pp}\\\\\n&=t(\\mathbf w,v_t)-\\mathbf w^{\\mathsf T}\\mathbf r_p\n-\\varphi_p\\mathbf z^{\\mathsf T}\\mathbf w+r_{Pp}.\n\\end{aligned}"
  - eqid: "tangent_plane_gibbs_dual_identity"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Homogeneity of system_gibbs_helmholtz_coordinates and chemical_potential_stationarity; #223 adopted derivation"
    status: "Exact derivation"
    description: "Gibbs-dual identity for an exact feasible all-free fixed-T/P stationary candidate and any charge-neutral split with the same conserved totals b. N_q is mol; extensive reduced energies are on the request feed basis."
    change_note: "Pinned feasibility cells and approximate numerical states do not inherit exact stationary equality. The split identity alone does not construct a feasible withdrawal."
    math: "\\frac{G_0}{RT}=\\boldsymbol\\lambda^{\\mathsf T}\\mathbf b,\\qquad\n\\frac{G_{\\mathrm{split}}}{RT}-\\boldsymbol\\lambda^{\\mathsf T}\\mathbf b\n=\\sum_q N_q\\,t(\\mathbf x_q,v_q),\\qquad\n\\sum_q N_q\\mathbf B\\mathbf x_q=\\mathbf b."
  - eqid: "tangent_plane_shift_log_curvature"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Exact log-composition chain rule for the frozen standard shift in system_gibbs_helmholtz_coordinates; #223"
    status: "Exact derivation"
    description: "Shift coefficients c=s−π are fixed, but supported fractions w_i=exp(y_i) and free amount N are coordinates. Curvature of the extensive reduced shift must remain in shared exact callbacks at arbitrary points."
    change_note: "Linear amount-space energy does not imply zero log-chart curvature; direct amount curvature is zero."
    math: "L_c=N\\sum_{i\\in S}c_i e^{y_i},\\qquad\n\\partial_{y_i}L_c=N c_iw_i,\\quad\n\\partial_{y_i y_j}L_c=\\delta_{ij}N c_iw_i,\\quad\n\\partial_{N y_i}L_c=c_iw_i,\\quad \\partial_{NN}L_c=0."
  - eqid: "tangent_plane_trial_balance"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Basis transformation of normalization/electroneutrality and Euler stationarity; #223 adopted derivation"
    status: "Exact derivation"
    description: "Internal unit-amount trial balance basis on S; R contains total-amount and charge rows, omitting charge for neutral support. H is the retained full-rank row transformation; λ_t is conjugate to B_t, not an optimizer multiplier."
    change_note: "No feed-moiety-proportion constraint or reaction is imposed. Charged density-temperature Vapor trials use H=I and the numerical log-charge row h below, evaluated by maximum-shifted log sums. Only that trial charge balance or a declared Vapor Electro row is replaced in Newton correction and classification. Original physical criteria, Ipopt callbacks and solved-state derivatives remain unchanged; full transformed rank does not establish branch or recovery accuracy. Qualification remains incomplete for #771. Other trials retain their existing basis; use λ_t dot b_t in every basis."
    math: "\\begin{aligned}\n\\mathbf R_S&=\\begin{pmatrix}\\mathbf e_S^{\\mathsf T}\\\\\\mathbf z_S^{\\mathsf T}\\end{pmatrix},\\quad\n\\mathbf B_t=\\mathbf H\\mathbf R_S,\\quad\n\\mathbf b_t=\\mathbf B_t\\mathbf w^0=\\mathbf H\\mathbf R_S\\mathbf w^0,\\qquad\n\\mathbf R_S\\mathbf w^0=\\begin{pmatrix}1\\\\0\\end{pmatrix}\n\\quad\\text{(omit charge row and second entry for neutral support)},\\\\\nN\\mathbf B_t\\mathbf w&=\\mathbf b_t,\\quad \\mathbf e_S^{\\mathsf T}\\mathbf w=1\n\\ \\Longrightarrow\\ N=1,\\ \\mathbf z_S^{\\mathsf T}\\mathbf w=0,\\\\\n\\frac{\\boldsymbol\\mu_{\\mathrm{mech}}}{RT}+\\mathbf s-\\boldsymbol\\pi\n&=\\mathbf B_t^{\\mathsf T}\\boldsymbol\\lambda_t\n=k\\mathbf e_S+\\varphi_t\\mathbf z_S,\\qquad\n t=\\boldsymbol\\lambda_t^{\\mathsf T}\\mathbf b_t=k\n\\quad\\text{at exact feasible stationary density and composition}.\n\\end{aligned}\n\\qquad\n\\begin{aligned}\nQ_+&=\\sum_{z_i>0}z_i e^{y_i},\\quad Q_-=\\sum_{z_i<0}|z_i|e^{y_i},\\\\\nh&=\\ln Q_+-\\ln Q_-,\\quad R=|\\tanh(h/2)|,\\\\\n\\frac{\\partial h}{\\partial y_i}&=\n\\begin{cases}z_i e^{y_i}/Q_+,&z_i>0,\\\\\nz_i e^{y_i}/Q_-,&z_i<0,\\\\0,&z_i=0.\\end{cases}\n\\end{aligned}\n"
  - eqid: "thermochemistry_from_reactions"
    section: "Reference thermochemistry"
    subsection: "Declared derivations"
    source: "Minimum-norm conserved gauge as practised in MEA-Thermodynamics (evaluate_direct_absorption_heat.py, build_thermochemistry), made a declared native derivation"
    status: "Implementation convention"
    description: "For an independent reaction-row matrix nu, the minimum-norm solution defines one declared gauge of reaction enthalpies. Adding a conserved-moiety vector preserves reaction enthalpies but does not determine absolute calorics."
    change_note: "Gauge is a convention, not replacement evidence for missing enthalpies, entropies or heat capacities. Equilibrium invariance additionally requires consistent Gibbs reference functions. Native calorics on referenced reactions use `reference_species_calorics`, which anchors this gauge on supplied records and leaves only the ionic charge gauge."
    math: "\\boldsymbol{\\nu}\\,\\mathbf{h}^{\\circ}=\\Delta_r\\mathbf{h}^{\\circ},\\qquad \\mathbf{h}^{\\circ}=\\boldsymbol{\\nu}^{\\mathsf T}\\left(\\boldsymbol{\\nu}\\boldsymbol{\\nu}^{\\mathsf T}\\right)^{-1}\\Delta_r\\mathbf{h}^{\\circ},\\qquad \\boldsymbol{\\nu}\\left(\\mathbf{h}^{\\circ}+\\mathbf{B}^{\\mathsf T}\\mathbf{c}\\right)=\\Delta_r\\mathbf{h}^{\\circ}\\ \\text{for every }\\mathbf{c}"
  - eqid: "total_enthalpy"
    section: "Reference thermochemistry"
    subsection: "Totals"
    source: "Michelsen and Mollerup 2007, ch. 2, residual-plus-ideal decomposition at fixed (T, V, n)"
    status: "Exact derivation"
    description: "Enthalpy of a phase as the declared ideal reference part plus the residual part the residual EOS definition; reported on the P° basis of the declared thermochemistry. Unavailable without declared reference thermochemistry."
    change_note: "Required total-property definition; registration does not establish implementation."
    math: "H=\\sum_i n_i\\,h^{\\circ}_i(T)+H^{\\mathrm{res}}(T,V,\\mathbf{n}),\\qquad H^{\\mathrm{res}}=A^{\\mathrm{res}}-T\\left(\\frac{\\partial A^{\\mathrm{res}}}{\\partial T}\\right)_{V,\\mathbf{n}}+PV-nRT"
  - eqid: "total_entropy"
    section: "Reference thermochemistry"
    subsection: "Totals"
    source: "Michelsen and Mollerup 2007, ch. 2, ideal-gas mixture entropy at the phase volume plus the residual at fixed (T, V, n)"
    status: "Exact derivation"
    description: "Entropy of a phase as the ideal-gas mixture entropy at the phase's own (T, V, n) plus the residual EOS entropy; reported on the P° basis of the declared thermochemistry, which enters only through the per-species s°. Unavailable without declared reference thermochemistry."
    change_note: "Required total-property definition; registration does not establish implementation."
    math: "S=\\sum_i n_i\\left[s^{\\circ}_i(T,P^{\\circ})-R\\ln\\frac{n_iRT}{VP^{\\circ}}\\right]+S^{\\mathrm{res}}(T,V,\\mathbf{n}),\\qquad S^{\\mathrm{res}}=-\\left(\\frac{\\partial A^{\\mathrm{res}}}{\\partial T}\\right)_{V,\\mathbf{n}}"
  - eqid: "total_heat_capacity_cp"
    section: "Reference thermochemistry"
    subsection: "Totals"
    source: "Residual-plus-ideal decomposition on a regular fixed-pressure branch"
    status: "Exact derivation"
    description: "Molar total isobaric heat capacity combines ideal and residual values at the same state."
    change_note: "It is unavailable when either input is unavailable, including a nonpositive mechanical denominator for the residual term."
    math: "c_p=c_p^{id}+c_p^{res}."
  - eqid: "total_heat_capacity_cv"
    section: "Reference thermochemistry"
    subsection: "Totals"
    source: "Residual-plus-ideal decomposition at fixed density"
    status: "Exact derivation"
    description: "Molar total isochoric heat capacity combines ideal and residual values at the same state."
    change_note: "For fixed-source-pressure standards this mechanical quantity does not inherit the fixed-pressure mechanical-stability condition. System-pressure references use frozen c_v,G on the regular local Gibbs-volume chart in `gibbs_conjugate_molar_volume`; it is not a reacting heat capacity at fixed total volume."
    math: "c_v=c_v^{id}+c_v^{res}."
  - eqid: "total_internal_energy"
    section: "Reference thermochemistry"
    subsection: "Totals"
    source: "Residual-plus-ideal decomposition at fixed $(T,V,\\mathbf n)$"
    status: "Exact derivation"
    description: "Molar total internal energy is the ideal value plus the residual EOS value and obeys the full pressure-volume identity."
    change_note: "Unavailable without declared reference thermochemistry. These mechanical definitions apply to fixed-source-pressure standards. System-pressure references use the same record-anchored Gibbs volume in `gibbs_conjugate_molar_volume`."
    math: "u=u^{id}+u^{res}=h-\\frac{P}{\\rho}."
  - eqid: "transfer_free_energy"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], transfer Gibbs-energy relation"
    status: "Source equation"
    description: "Ion transfer free energy between compatible solvent reference states."
    change_note: "Source and target must share temperature, pressure, phase, ions, and stoichiometry."
    math: "\\Delta G_{i,\\mathrm{tr}}^{A\\rightarrow B}\n=RT\\left(\\ln\\phi_{i,B}^{\\infty}-\\ln\\phi_{i,A}^{\\infty}\\right)."
  - eqid: "tunneling_transform"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eq. 10 and 11"
    status: "Documentation-only"
    description: "Exponential tunneling transform of the tangent-plane distance used by the source for the stage-I search from 10 nc random starts. Source search candidate; not an adopted discovery algorithm."
    change_note: "Evaluate only within a separately reviewed search design using the shared thermodynamic owner."
    math: "f_T(\\tilde{\\boldsymbol x}, v) = \\big(\\mathrm{TPD}(\\tilde{\\boldsymbol x}, v) - d^{*}\\big)\\exp\\!\\Big(\\frac{p^{*}}{\\|\\tilde{\\boldsymbol x} - \\tilde{\\boldsymbol x}^{*}\\|}\\Big),\\qquad p^{*} = 10^{-3}."
  - eqid: "weighted_lagrangian_hessian"
    section: "Numerical methods"
    subsection: ""
    source: "Exact differentiation of the constrained objective used by the Ipopt eval_h callback"
    status: "Exact derivation"
    description: "All primal coordinates and arbitrary callback multipliers are included. Lambda_opt denotes optimizer constraint multipliers, separate from embedded chemical balance/charge coordinates. Objective scaling never scales constraint curvature."
    change_note: "Reconciled against transfer audit 2026-09-06; required mathematics, not an availability claim."
    math: "\\nabla_y^2\\mathcal L_{\\mathrm{opt}}=\\mathrm{obj\\_factor}\\,\\nabla_y^2 f(y)+\\sum_j\\Lambda_j^{\\mathrm{opt}}\\nabla_y^2 g_j(y)."
