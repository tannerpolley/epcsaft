schema_version: 3
equations:
  - eqid: "active_binary_interaction_mapping"
    section: "Native phase coordinates"
    subsection: ""
    source: "EOS active-coordinate convention for the symmetric binary pair"
    status: "Implementation convention"
    description: "Map one active unlike-pair k_ij coordinate into the symmetric binary matrix."
    change_note: "Resolved diagonal values remain fixed."
    math: "\\boldsymbol{k}(\\theta)=\n\\begin{bmatrix}\nk_{11}&\\theta\\\\\n\\theta&k_{22}\n\\end{bmatrix}."
  - eqid: "active_binary_size_interaction_mapping"
    section: "Native phase coordinates"
    subsection: ""
    source: "EOS active-coordinate convention for the symmetric binary pair"
    status: "Implementation convention"
    description: "Map one active unlike-pair l_ij coordinate into the symmetric binary matrix."
    change_note: "Resolved diagonal values remain fixed and k_ij remains unchanged."
    math: "\\boldsymbol{l}(\\theta)=\n\\begin{bmatrix}\nl_{11}&\\theta\\\\\n\\theta&l_{22}\n\\end{bmatrix}."
  - eqid: "active_parameter_coordinate_identity"
    section: "Native phase coordinates"
    subsection: ""
    source: "Native active-coordinate convention for explicit storage slots"
    status: "Implementation convention"
    description: "Define one linear active coordinate and its derivative identity over the slots it owns."
    change_note: "A symmetric unlike pair owns both reciprocal off-diagonal slots; fixed slots have zero coordinate derivative."
    math: "p_s(\\theta_a)=\\theta_a\\;(s\\in S_a),\\qquad\n\\frac{\\partial p_s}{\\partial\\theta_a}=1\\;(s\\in S_a),\\qquad\n\\frac{\\partial F}{\\partial\\theta_a}=\\sum_{s\\in S_a}\\frac{\\partial F}{\\partial p_s}."
  - eqid: "active_parameter_unit_transformation"
    section: "Native phase coordinates"
    subsection: ""
    source: "Multivariate chain rule for linear unit conversion"
    status: "Exact derivation"
    description: "Transform active-coordinate gradients and mixed Hessians between source and native units."
    change_note: "Supported parameter conversions have a multiplicative scale and no additive offset."
    math: "p^{\\mathrm{native}}=s_p p^{\\mathrm{source}},\\qquad\n\\frac{\\partial F}{\\partial p^{\\mathrm{source}}}=s_p\\frac{\\partial F}{\\partial p^{\\mathrm{native}}},\\qquad\n\\frac{\\partial^2F}{\\partial p^{\\mathrm{source}}\\partial q^{\\mathrm{source}}}\n=s_p s_q\\frac{\\partial^2F}{\\partial p^{\\mathrm{native}}\\partial q^{\\mathrm{native}}}."
  - eqid: "affine_parameter_coordinate_map"
    section: "Parameter regression"
    subsection: "Affine coordinates"
    source: "Multivariate chain rule applied to `active_parameter_coordinate_identity`; issue #209 revision 1."
    status: "Exact derivation"
    description: "A normalized optimizer value v maps to a base value q and proportional physical targets across parameter families. Bounds apply to q. Coefficients carry target-unit/base-unit; reciprocal pairs count once."
    change_note: "Nonzero signed coefficients and positive numerical scales are explicit inputs. Row order is independent EOS targets, dependent Born diameters, then reaction coefficients. Reaction coordinates have no EOS targets. Fixed slots remain outside the target list."
    math: "q_j=o_j+s_jv_j,\\qquad \\theta_k=c_kq_j,\\qquad\nD_{kj}=\\frac{\\partial\\theta_k}{\\partial v_j}=c_ks_j,\n\\qquad s_j>0,\\quad c_k\\ne0,\n$$\n$$\nJ_{\\mathrm{opt}}=\\operatorname{diag}\\!\\left(\\sqrt{w}\\,\\frac{dr}{dy}\\right)J_{\\mathrm{physical}}D,\n\\qquad C_{\\mathrm{physical}}=D C_{\\mathrm{optimizer}}D^T."
  - eqid: "angstrom_number_density"
    section: "Symbols, bases, and units"
    subsection: ""
    source: "[Gross2001], unit conversion used by Appendix A"
    status: "Exact derivation"
    description: "Convert molar density to molecular number density on the angstrom basis."
    change_note: "Uses the current EOS Avogadro constant and angstrom conversion."
    math: "\\widehat{\\rho}=\\rho_m\\,N_A\\,10^{-30}."
  - eqid: "association_contact"
    section: "Contribution intermediates"
    subsection: "Association"
    source: "[Gross2001], hard-sphere contact rule used by association"
    status: "Source equation"
    description: "Unlike-site hard-sphere contact function."
    change_note: "Mirrors the reduced-diameter association contact expression."
    math: "g_{ij}^{hs}=\n\\frac{1}{1-\\eta}\n+\\frac{3d_id_j}{d_i+d_j}\\frac{\\zeta_2}{(1-\\eta)^2}\n+2\\left(\\frac{d_id_j}{d_i+d_j}\\right)^2\n\\frac{\\zeta_2^2}{(1-\\eta)^3}."
  - eqid: "association_helmholtz"
    section: "Contribution intermediates"
    subsection: "Association"
    source: "[Chapman1990], Eq.~(21)"
    status: "Source equation"
    description: "Association residual Helmholtz contribution."
    change_note: "Uses explicit site multiplicity from the resolved model."
    math: "a^{assoc}=\\sum_A x_{i(A)}\\nu_A\n\\left(\\ln X_A-\\frac{X_A}{2}+\\frac{1}{2}\\right)."
  - eqid: "association_mass_action"
    section: "Contribution intermediates"
    subsection: "Association"
    source: "[Chapman1990], Eq.~(15)"
    status: "Source equation"
    description: "Association site-fraction mass-action equation with explicit multiplicity."
    change_note: "Written in the zero-residual form used by the EOS."
    math: "F_A=X_A\\left[\n1+\\widehat{\\rho}\\sum_B x_{i(B)}\\,\\nu_B\\,X_B\\Delta_{AB}\n\\right]-1=0."
  - eqid: "association_strength"
    section: "Contribution intermediates"
    subsection: "Association"
    source: "[Gross2002], cross-association rule; [Chapman1990], association strength"
    status: "Source equation"
    description: "Site-pair association strength using explicit source-resolved cross records. It carries `sigma_ij^3` where Chapman1990 Eq. 18 carries `d^3` (the PC-SAFT parameter convention); volumes fitted using `d^3` are converted in their packets. For a `wolbach-sandler` rule edge, the Gross2002 Eq. 3 size factor makes `sigma_ij` the geometric mean `sqrt(sigma_i sigma_j)(1-l_ij)`."
    change_note: "Keeps association energy and volume distinct from k_ij and l_ij."
    math: "\\Delta_{AB}^{ij}=g_{ij}^{hs}\n\\left[\\exp\\left(\\frac{\\epsilon_{AB}^{ij}/k_B}{T}\\right)-1\\right]\n\\sigma_{ij}^3\\kappa_{AB}^{ij}."
  - eqid: "association_volume_correction"
    section: "Contribution intermediates"
    subsection: "Association"
    source: "[Uyan2015], Eqs.~(8)--(9) and Table 5"
    status: "Source equation"
    description: "Volume of a combining-rule edge evaluated at the state temperature from its explicit self edges and a declared volume correction c; the Wolbach--Sandler size factor stays in `association_strength`."
    change_note: "(1 - c) multiplies the volume once, outside the square root (#567); c = 0 recovers the existing rule."
    math: "\\frac{\\epsilon_{AB}^{ij}}{k_B}=\\frac12\\left[\\frac{\\epsilon_{AB}^{ii}(T)}{k_B}+\\frac{\\epsilon_{AB}^{jj}(T)}{k_B}\\right],\n\\qquad\n\\kappa_{AB}^{ij}=\\sqrt{\\kappa_{AB}^{ii}(T)\\,\\kappa_{AB}^{jj}(T)}\\,\\bigl[1-c_{ij}(T)\\bigr]."
  - eqid: "azeotrope_condition"
    section: "Equilibrium critical and envelope conditions"
    subsection: ""
    source: "equal phase compositions at a homogeneous azeotrope (Gibbs–Konovalov); FeOs `PhaseEquilibrium.binary_azeotrope` as the independent implementation; issue #571"
    status: "Source equation"
    description: "The C − 1 rows of a binary azeotrope cell (a free feed phase and an incipient phase pinned at zero amount, exactly one of T and P free) that replace the first C − 1 species balances; the remaining balance is the total amount, and the declared feed composition is only the seed."
    change_note: "The rows are affine in the log-composition chart and add no Hessian. The C-th equality follows from the two normalization rows."
    math: "\\ln x_k^{inc}-\\ln x_k^{feed}=0,\\quad k=\\text{support}[0..C-2],\\qquad \\sum_p N_p\\sum_i x_{p,i}-N_{feed}=0."
  - eqid: "born_outer_shell_diameter"
    section: "Born solvation relations"
    subsection: ""
    source: "[Figiel2025], Eqs.~(8)--(10), parameterized to include its uncorrected limit"
    status: "Source equation"
    description: "Ion-specific outer Born shell diameter with one explicit fixed correction coefficient."
    change_note: "The fitted Born diameter, solvation factor, and model-definition coefficient remain distinct inputs."
    math: "f_{\\mathrm{mix}}=\\frac{\\sum_kx_kf_k}{\\sum_kx_k},\\qquad\nD_i=d_i^{Born}\\left(1+c_{\\mathrm{shell}}\\frac{f_{\\mathrm{mix}}-1}{|z_i|}\\right)."
  - eqid: "born_radial_charging_work"
    section: "Born solvation relations"
    subsection: ""
    source: "Born charging work; [Figiel2026Correction], corrected Eq.~(7)"
    status: "Source equation"
    description: "Canonical radial charging sum with an explicit dielectric-saturation coefficient."
    change_note: "The admitted fixed coefficients express the uncorrected, shell-only, and shell-plus-dielectric limits through one equation."
    math: "W_{Born}=\n\\sum_{i\\in\\mathcal{I}}x_i z_i^2\n\\left[\n\\frac{1-\\epsilon_{r,\\mathrm{bulk}}^{-1}}{D_i}\n+c_{\\mathrm{dielectric}}\\left(1-\\epsilon_{r,\\mathrm{ion}}^{-1}\\right)\n\\left(\\frac{1}{d_i^{Born}}-\\frac{1}{D_i}\\right)\n\\right]."
  - eqid: "born_residual_helmholtz"
    section: "Born solvation relations"
    subsection: ""
    source: "Born charging work; [Figiel2026Correction], corrected Eq.~(7)"
    status: "Source equation"
    description: "Dimensionless residual Helmholtz contribution from the sole Born charging equation."
    change_note: "Shared by fixed and active-coordinate evaluation paths. On an ion-free support the empty sum is identically zero before permittivity or solvation operations; this restriction does not supply ionic insertion derivatives."
    math: "a^{Born}=-\\frac{e^2}{4\\pi\\epsilon_0k_BT}\\,W_{Born}."
  - eqid: "candidate_phase_criteria"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] system PP with tolerances of Section 4"
    status: "Source equation"
    description: "A retained point is a candidate stable phase when its lower value is within the gap tolerance of the upper bound, its reduced gradient agrees with the multipliers on every coordinate away from the lower bound, and it is separated from every other candidate in packing fraction or in composition."
    change_note: "Gap 5e-2, relative derivative 0.5, packing and composition distinctness 1e-3, as in the source."
    math: "\\mathrm{UBD} - L^{m} \\le \\varepsilon_b,\\qquad \\frac{|\\partial g/\\partial \\tilde{x}_i^{m} - \\alpha_i|}{|\\alpha_i|} \\le \\varepsilon_\\alpha\\ (\\tilde{x}_i^{m} > \\tilde{x}^{l}),\\qquad |\\eta^{m} - \\eta^{n}| \\ge \\varepsilon_\\eta\\ \\text{or}\\ \\max_i |\\tilde{x}_i^{m} - \\tilde{x}_i^{n}| \\ge \\varepsilon_x."
  - eqid: "cation_pair_triple_mixing_helmholtz"
    section: "Residual Helmholtz energy"
    subsection: ""
    source: "Solvent-mass integration of the constant short-range terms in Song et al. (2010), §2, p. 1287, Eqs. (1), (2), (10-1), (10-2), Zotero W3AX2GHK; #658 design D1–D7. Multi-anion indexing: Pitzer and Kim (1974), Eqs. (8), (9), (11), [doi:10.1021/ja00825a004](https://doi.org/10.1021/ja00825a004); like-sign θ independent of the counter-ion and ψ per ion triple as written in Peiper and Pitzer (1982), J. Chem. Thermodyn. 14, 613–638, Eqs. (7)–(8), Zotero X8GEDSJ2."
    status: "Exact derivation"
    description: "One declared neutral solvent s, distinct cations i and j and declared anion k; M_s is kg/mol, W is kg solvent, theta is kg/mol and psi is kg²/mol². The reduced molar contribution is Delta a^r = F/N, with N = sum n."
    change_note: "Evaluated in every phase on the declared solvent's molality basis, with positive solvent mass and the declared anion retained. Additional anions are admitted: theta_ij is independent of the anion; only the declared psi_ijk is nonzero, with psi_ija = 0 for every other anion as a model assumption. The unequal-charge electrostatic Etheta terms are excluded. Transfer of chloride-fitted coefficients to sulfate is unvalidated. Other neutral components enter this contribution only through mole fractions and total-mole normalization; their masses are not added to W. The constant coefficients are qualified only for retained aqueous water/chloride-salt cases at 298.15 K and 1 bar. Occupied additional neutrals and organic-phase effects are unqualified extrapolation, with no phase selector or automatic deactivation; at exact zero declared solvent with either participating cation exactly absent, the contribution is defined as zero on that fixed support. All derivatives within that support are zero; transverse entries in dense arrays have defined zero storage and claim no physical insertion derivative. Dry states containing both cations remain refused, including zero coefficients. Existing absent-ion action refusals remain; in a dry phase containing one participating cation, the absent partner’s scalar chemical potential and fugacity are also unavailable with IonicInsertion. This is not a continuous full-composition extension or organic-ion qualification. No density dependence, pressure correction, unequal-charge electrostatic mixing, vapor, dry-salt, mixed-solvent or caloric qualification. For W > 0, faces retain nonzero absent-ion insertion derivatives. Coefficients correct this EOS and are not imported Pitzer coefficients. Full EOS §12 gives an illustrative organic-phase substitution and its limits."
    math: "F=\\frac{\\Delta A^r}{RT}\n=Wm_im_j\\left(2\\theta_{ij}+\\sum_{a\\in\\mathcal A}\\psi_{ija}m_a\\right)\n=\\frac{2\\theta_{ij}n_i n_j}{W}+\\frac{\\psi_{ijk}n_i n_j n_k}{W^2},\\quad\n\\psi_{ija}=0\\ (a\\ne k),\\quad\nW=M_s n_s>0,\\quad m_l=\\frac{n_l}{W},\\qquad\n\\Delta a^r=\\frac{2\\theta x_i x_j}{M_s x_s}\n+\\frac{\\psi x_i x_j x_k}{(M_s x_s)^2},\\quad\n\\Delta P=0,\\qquad\n\\Delta\\Phi=\\frac{2m_im_j}{\\sum_{l\\ne s}m_l}(\\theta+\\psi m_k)."
  - eqid: "chemical_potential_stationarity"
    section: "Equilibrium"
    subsection: ""
    source: "[Ascani2022] Eqs. 9--10; [Pereira2012] Eqs. 5--7; [Gross2001] Eq. (A.33)"
    status: "Source equation"
    description: "Intensive stationarity in phase composition with balance multipliers λ and per-phase charge multipliers φ_p; the same row for a free and a pinned phase."
    change_note: "Written intensively (divided by N_p) so a pinned phase carries the same row; phase equilibrium and reaction affinity follow from it."
    math: "\\mu_{p,i}-\\boldsymbol{\\lambda}\\cdot\\mathbf{B}_i-z_i\\varphi_p=0,\\quad i\\in S_p."
  - eqid: "close_packing_fraction"
    section: "Density and packing"
    subsection: ""
    source: "Geometric close packing of equal spheres"
    status: "Exact derivation"
    description: "EOS hard upper packing-domain boundary."
    change_note: "Mirrors close_packing_fraction without introducing solver policy."
    math: "\\eta_{\\mathrm{cp}}=\\frac{\\pi}{3\\sqrt{2}}."
  - eqid: "component_mixed_bulk_permittivity"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[AscaniHeld2021], Eq.~(13); all-ion limit [Bulow2019], Eq.~(7), and [Bulow2021], §2.3 and Table 5"
    status: "Source equation"
    description: "Ascani combined solvent-mass and ion-mole bulk relative permittivity; with no neutral solvent, the solvent sum is empty and the rule is linear in ion mole fractions."
    change_note: "Ion mixture permittivities remain distinct from Figiel radial-region permittivity."
    math: "\\epsilon_{r,\\mathrm{bulk}}=\n\\epsilon_{r,\\mathrm{sf}}\\sum_{s\\in\\mathcal{S}}x_s\n+\\sum_{i\\in\\mathcal{I}}x_i\\epsilon_{r,i}."
  - eqid: "component_permittivity_temperature_polynomial"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Typed constitutive correlation"
    status: "Implementation convention"
    description: "Reference-temperature polynomial for one dielectric solvent's relative static permittivity."
    change_note: "Each continuous coefficient is independently selectable while the polynomial powers and reference temperature remain fixed."
    math: "\\epsilon_{r,s}(T)=c_{0,s}+\\sum_{n=1}^{N_s}c_{n,s}\n(T-T_{\\mathrm{ref},s})^n."
  - eqid: "compressibility_factor"
    section: "Thermodynamic properties"
    subsection: ""
    source: "[Gross2001], Eq.~(A.22)"
    status: "Source equation"
    description: "Compressibility factor from the residual Helmholtz density derivative."
    change_note: "Uses molar density as the independent density coordinate."
    math: "Z=1+\\rho_m a_\\rho,\n\\qquad\na_\\rho=\\left(\\frac{\\partial a^r}{\\partial\\rho_m}\\right)_{T,\\boldsymbol{x}}."
  - eqid: "conserved_finite_phase_split"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Component-conserving donor split of system_gibbs_helmholtz_coordinates; #223 adopted finite-descent check"
    status: "Exact derivation"
    description: "Finite split preserving every component and thus moieties and charge. The withdrawn donor is reclosed at the request pressure on its declared density branch; the trial keeps its own molar volume. Other phases are unchanged. ΔG/RT and E_Δ are extensive on the request's mol feed basis."
    change_note: "Try β_max/2 and at most eight halvings, reevaluating physical points. Numerical descent requires actual conservation and a Gibbs decrease exceeding its propagated estimate; proof additionally requires justified feasibility and error bounds. Issue #390: a fixed donor volume is admissible for the minimized A+PV, but its mechanical penalty (g_vv>0 on a stable root) blocked useful finite descent within the bounded search; the reclosed donor volume also seeds the added declaration. With exact pressure closure and a smoothly continuing root, g_v=0 makes N_p g_v dv_p/dβ vanish, so the first-order donor slope is unchanged; no smooth path is claimed across a root-selection change."
    math: "\\begin{aligned}\n\\mathbf n'_p&=\\mathbf n_p-\\beta\\mathbf w,\\quad\n\\mathbf n_t=\\beta\\mathbf w,\\quad N'_p=N_p-\\beta,\\quad\n\\mathbf x'_p=\\frac{\\mathbf n'_p}{N_p-\\beta},\\quad 0<\\beta<\\beta_{\\max,p},\\\\\nP_{\\mathrm{EOS}}(T,\\mathbf x'_p,v'_p)&=P,\\quad V'_p=(N_p-\\beta)v'_p,\\quad V_t=\\beta v_t,\\quad\n\\mathbf n'_p+\\mathbf n_t=\\mathbf n_p,\\\\\n\\frac{\\Delta G}{RT}&=(N_p-\\beta)g(\\mathbf x'_p,v'_p)+\\beta g(\\mathbf w,v_t)-N_p g(\\mathbf x_p,v_p),\n\\quad g=\\widetilde g+\\mathbf s^{\\mathsf T}\\mathbf x,\\\\\n\\frac{\\Delta G}{RT}&<-E_\\Delta\\quad\\text{for numerically resolved finite descent with estimated uncertainty}.\n\\end{aligned}"
  - eqid: "cp_ideal_constant"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "Declared simplification; no literature form"
    status: "Implementation convention"
    description: "A constant ideal-gas heat capacity for a species with no better data, declared as such; its integrals are linear and logarithmic."
    change_note: "New declared kind; the only kind without a literature source, and the packet must say so."
    math: "C^{\\circ}_p=c,\\qquad h^{\\circ}(T)=h^{\\circ}_{\\mathrm{ref}}+c\\,(T-T_{\\mathrm{ref}}),\\qquad s^{\\circ}(T,P^{\\circ})=s^{\\circ}_{\\mathrm{ref}}+c\\ln\\frac{T}{T_{\\mathrm{ref}}}"
  - eqid: "cp_ideal_dippr_107"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "Aly and Lee 1981, Fluid Phase Equilibria 6, 169 (DIPPR equation 107)"
    status: "Bounded empirical relation"
    description: "Ideal-gas heat capacity of one species, hyperbolic form, with its closed-form enthalpy and entropy integral differences; valid on the declared temperature domain only."
    change_note: "The admitted real extension uses $c=|C|/T$ and $e=|E|/T$ in the even terms. Anchored differences use stable equivalents; $C=0$ gives $B\\Delta T$ and $B\\ln(T/T_{\\mathrm{ref}})$, while $E=0$ gives no $D$ contribution."
    math: "\\begin{aligned} c&=|C|/T,\\qquad e=|E|/T,\\\\ C^{\\circ}_p&=A+B\\left[\\frac{c}{\\sinh c}\\right]^2+D\\left[\\frac{e}{\\cosh e}\\right]^2,\\\\ \\Delta h&=A\\Delta T+B|C|\\left[\\coth c\\right]_{T_{\\mathrm{ref}}}^{T}-D|E|\\left[\\tanh e\\right]_{T_{\\mathrm{ref}}}^{T},\\\\ \\Delta s&=A\\ln\\frac{T}{T_{\\mathrm{ref}}}+B\\left[c\\coth c-\\ln\\sinh c\\right]_{T_{\\mathrm{ref}}}^{T}-D\\left[e\\tanh e-\\ln\\cosh e\\right]_{T_{\\mathrm{ref}}}^{T},\\end{aligned}\\qquad \\Delta T=T-T_{\\mathrm{ref}},"
  - eqid: "cp_ideal_nasa7"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "NASA RP-1311 Part I (1994), section 4.2, Eqs. (4.6)-(4.8), https://ntrs.nasa.gov/citations/19950013764"
    status: "Bounded empirical relation"
    description: "Ideal-gas seven-coefficient NASA7 (original NASA/Chemkin) standard-state thermochemistry on each source-declared temperature interval; coefficients a0-a4 give heat capacity and a5-a6 are enthalpy and entropy integration constants."
    change_note: "Uses dimensionless tau=T/(1 K) while preserving the source coefficients' Kelvin convention; P_src is an explicit source standard pressure and P is the caller-declared standard pressure. Do not infer 298.15 K, 1 atm or interval continuity."
    math: "\\begin{aligned}\n\\tau&=T/T_{\\mathrm u},\\qquad T_{\\mathrm u}=1\\,\\mathrm K,\\qquad T>0,\\qquad T\\in I_r,\\qquad P^{\\circ}>0,\\qquad P^{\\circ}_{\\mathrm{src},r}>0,\\\\\n\\frac{C^{\\circ}_{p,r}(T)}{R}&=a_{0r}+a_{1r}\\tau+a_{2r}\\tau^2+a_{3r}\\tau^3+a_{4r}\\tau^4,\\\\\n\\frac{h^{\\circ}_r(T)}{RT}&=a_{0r}+\\frac{a_{1r}}{2}\\tau+\\frac{a_{2r}}{3}\\tau^2+\\frac{a_{3r}}{4}\\tau^3+\\frac{a_{4r}}{5}\\tau^4+\\frac{a_{5r}}{\\tau},\\\\\n\\frac{s^{\\circ}_r(T,P^{\\circ})}{R}&=a_{0r}\\ln\\tau+a_{1r}\\tau+\\frac{a_{2r}}{2}\\tau^2+\\frac{a_{3r}}{3}\\tau^3+\\frac{a_{4r}}{4}\\tau^4+a_{6r}-\\ln\\frac{P^{\\circ}}{P^{\\circ}_{\\mathrm{src},r}},\\\\\n\\frac{\\mathrm d h^{\\circ}_r}{\\mathrm dT}&=C^{\\circ}_{p,r},\\qquad T\\left(\\frac{\\partial s^{\\circ}_r}{\\partial T}\\right)_{P^{\\circ},P^{\\circ}_{\\mathrm{src},r}}=C^{\\circ}_{p,r}.\n\\end{aligned}"
  - eqid: "cp_ideal_nasa9"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "NASA RP-1311 Part I (1994), section 4.2, Eqs. (4.9)-(4.11); McBride, Zehe and Gordon, NASA/TP-2002-211556 (2002), Empirical Equations for Fitting Thermodynamic Functions, Eqs. (1)-(3), https://ntrs.nasa.gov/citations/19950013764 and https://ntrs.nasa.gov/citations/20020085330"
    status: "Bounded empirical relation"
    description: "Ideal-gas nine-coefficient NASA9 (new NASA/Glenn) standard-state thermochemistry on each source-declared temperature interval; coefficients a0-a6 give heat capacity and a7-a8 are enthalpy and entropy integration constants."
    change_note: "Uses dimensionless tau=T/(1 K) while preserving the source coefficients' Kelvin convention; P_src is an explicit source standard pressure and P is the caller-declared standard pressure. Evaluate only on declared intervals, preserve source boundary behavior and do not infer 298.15 K or 1 atm."
    math: "\\begin{aligned}\n\\tau&=T/T_{\\mathrm u},\\qquad T_{\\mathrm u}=1\\,\\mathrm K,\\qquad T>0,\\qquad T\\in I_r,\\qquad P^{\\circ}>0,\\qquad P^{\\circ}_{\\mathrm{src},r}>0,\\\\\n\\frac{C^{\\circ}_{p,r}(T)}{R}&=a_{0r}\\tau^{-2}+a_{1r}\\tau^{-1}+a_{2r}+a_{3r}\\tau+a_{4r}\\tau^2+a_{5r}\\tau^3+a_{6r}\\tau^4,\\\\\n\\frac{h^{\\circ}_r(T)}{RT}&=-a_{0r}\\tau^{-2}+a_{1r}\\frac{\\ln\\tau}{\\tau}+a_{2r}+\\frac{a_{3r}}{2}\\tau+\\frac{a_{4r}}{3}\\tau^2+\\frac{a_{5r}}{4}\\tau^3+\\frac{a_{6r}}{5}\\tau^4+\\frac{a_{7r}}{\\tau},\\\\\n\\frac{s^{\\circ}_r(T,P^{\\circ})}{R}&=-\\frac{a_{0r}}{2}\\tau^{-2}-a_{1r}\\tau^{-1}+a_{2r}\\ln\\tau+a_{3r}\\tau+\\frac{a_{4r}}{2}\\tau^2+\\frac{a_{5r}}{3}\\tau^3+\\frac{a_{6r}}{4}\\tau^4+a_{8r}-\\ln\\frac{P^{\\circ}}{P^{\\circ}_{\\mathrm{src},r}},\\\\\n\\frac{\\mathrm d h^{\\circ}_r}{\\mathrm dT}&=C^{\\circ}_{p,r},\\qquad T\\left(\\frac{\\partial s^{\\circ}_r}{\\partial T}\\right)_{P^{\\circ},P^{\\circ}_{\\mathrm{src},r}}=C^{\\circ}_{p,r}.\n\\end{aligned}"
  - eqid: "cp_ideal_polynomial"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "Poling, Prausnitz and O'Connell 2001, The Properties of Gases and Liquids, 5th ed., Appendix A polynomial form"
    status: "Bounded empirical relation"
    description: "Ideal-gas heat capacity as a power series in centered temperature about an explicit reference temperature, with closed-form integrals; valid on the declared temperature domain only."
    change_note: "The accepted basis is $(T-T_{\\mathrm{ref}})^k$, including the constant form; $T_{\\mathrm{ref}}$ anchors both integrals."
    math: "C^{\\circ}_p=\\sum_{k=0}^{n}a_k(T-T_{\\mathrm{ref}})^{k},\\qquad h^{\\circ}(T)=h^{\\circ}_{\\mathrm{ref}}+\\sum_{k=0}^{n}\\frac{a_k}{k+1}(T-T_{\\mathrm{ref}})^{k+1},\\qquad s^{\\circ}(T)=s^{\\circ}_{\\mathrm{ref}}+\\sum_{k=0}^{n}a_kT_{\\mathrm{ref}}^{k}\\int_{0}^{(T-T_{\\mathrm{ref}})/T_{\\mathrm{ref}}}\\frac{z^k}{1+z}\\,\\mathrm dz"
  - eqid: "cp_ideal_shomate"
    section: "Reference thermochemistry"
    subsection: "Ideal-gas heat-capacity kinds"
    source: "NIST Chemistry WebBook SRD 69, Gas Phase Heat Capacity (Shomate Equation), https://webbook.nist.gov/cgi/cbook.cgi?ID=C7732185&Mask=203, equations and unit definitions"
    status: "Bounded empirical relation"
    description: "Use NIST tabulated numerical coefficients and their prescribed units: A-E and G in the heat-capacity/entropy convention, F and H_coef in the kJ/mol enthalpy convention. The enthalpy polynomial returns an increment; formation enthalpy/reference must be supplied separately. Valid only on each declared temperature interval."
    change_note: "The explicit 1000 factor converts the NIST kJ/mol enthalpy expression to Engine J/mol. H_coef names the NIST coefficient, not the observable; each source interval retains its fitted increment and supplied formation enthalpy."
    math: "\\begin{aligned}t&=T/(1000\\,\\mathrm K),\\\\ C_p^\\circ/[\\mathrm{J\\,mol^{-1}K^{-1}}]&=A+Bt+Ct^2+Dt^3+E/t^2,\\\\ [h^\\circ(T)-h^\\circ(298.15\\,\\mathrm K)]/[\\mathrm{J\\,mol^{-1}}]&=10^3[At+Bt^2/2+Ct^3/3+Dt^4/4-E/t+F-H_{\\mathrm{coef}}],\\\\ s^\\circ/[\\mathrm{J\\,mol^{-1}K^{-1}}]&=A\\ln t+Bt+Ct^2/2+Dt^3/3-E/(2t^2)+G.\\end{aligned}"
  - eqid: "critical_equations"
    section: "Equilibrium critical and envelope conditions"
    subsection: ""
    source: "Heidemann and Khalil 1980, AIChE J. 26, 769–779 (doi:10.1002/aic.690260510); Michelsen 1980, Fluid Phase Equilib. 4, 1–10, pp. 7–8, Eqs. 24–26; normalized amount perturbation as in the FeOs \"Stability and critical points\" documentation; issue #224 slice B"
    status: "Source equation"
    description: "Necessary critical conditions of one neutral nonreactive phase on a positive feed z at fixed (T, V), with F = A/(RT), n the phase amounts, unknown mode u, D = diag(sqrt z) and w = D u; T and P are free and the pressure row closes P."
    change_note: "Ideal parts Q_ij = δ_ij/n_i and F_ijk = −δ_ijk/n_i²; residual parts are the extensive residual contractions E2–E5. ∂c/∂u_j = 3 sqrt(z_j) F_nnn[w,w,e_j] and ∂²c/∂u_i∂u_j = 6 sqrt(z_i z_j) F_nnn[w,e_i,e_j]. A solution is a critical-equation candidate: the conditions certify no stability."
    math: "M=DQD,\\quad Q=F_{nn},\\quad Mu=0,\\quad u^{T}u-1=0,\\quad c=F_{nnn}[w,w,w]=0."
  - eqid: "cross_association_energy_correction"
    section: "Native phase coordinates"
    subsection: ""
    source: "EOS typed cross-association correction applied to the declared arithmetic energy combining rule"
    status: "Implementation convention"
    description: "Correct every matching role-aware cross-association energy while preserving association volume."
    change_note: "One unordered component-and-role coordinate owns every multiplicity-equivalent matching edge."
    math: "\\frac{\\epsilon_{AB,r}^{ij}}{k_B}\n=\\left(1-k_{\\mathrm{HB},ij,r}\\right)\n\\frac{\\epsilon_{AB,r,0}^{ij}}{k_B},\n\\qquad\n\\frac{\\partial\\left(\\epsilon_{AB,r}^{ij}/k_B\\right)}\n{\\partial k_{\\mathrm{HB},ij,r}}\n=-\\frac{\\epsilon_{AB,r,0}^{ij}}{k_B}."
  - eqid: "cross_dispersion_energy"
    section: "Parameter setup"
    subsection: ""
    source: "[Gross2001], Eq.~(A.15)"
    status: "Source equation"
    description: "Unlike-pair dispersion energy for an applicable pair."
    change_note: "Keeps k_ij semantically distinct from l_ij and association data. A pair with a declared reference temperature $T_{\\mathrm{ref},ij}>0$ takes the record's linear-in-$1/T$ law; its slope $b_{ij}$ (K) is an active-parameter family like $k_{ij}$ (#152). The applicable pairs are the first case of `same_sign_ionic_dispersion`, with C the declared charged molecules (#641)."
    math: "\\frac{\\epsilon_{ij}}{k_B}\n=\\sqrt{\\frac{\\epsilon_i}{k_B}\\frac{\\epsilon_j}{k_B}}\\,\\bigl(1-k_{ij}(T)\\bigr),\n\\qquad k_{ij}(T)=k_{ij}+b_{ij}\\Bigl(\\frac{1}{T}-\\frac{1}{T_{\\mathrm{ref},ij}}\\Bigr),\n\\qquad z_iz_j\\le0,\\ \\text{all-ion-pair dispersion, or } i,j\\in C."
  - eqid: "cross_segment_diameter"
    section: "Parameter setup"
    subsection: ""
    source: "[Gross2001], Eq.~(A.14), with source-resulted l_ij extension"
    status: "Source equation"
    description: "Unlike-pair segment diameter including the distinct l_ij family."
    change_note: "Makes the current l_ij semantics explicit."
    math: "\\sigma_{ij}=\\frac{\\sigma_i+\\sigma_j}{2}(1-l_{ij})."
  - eqid: "debye_finite_size_chi"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[Bulow2019], finite-size function in Eq.~(2)"
    status: "Source equation"
    description: "Exact finite-size DH function and its Taylor series at zero, truncated at degree 24 in the implementation. The polynomial is not the exact function away from the limit."
    change_note: "The current reduced diameter y may select a cancellation-safe implementation, but is an algorithm choice, not a thermodynamic variable. With the switch at y = 0.2, chi and its first and second Taylor derivatives match 50-digit references to 3e-14, 7e-13 and 1.1e-11 relative on both branches (2026-09-23)."
    math: "\\chi(y)=\\frac{3[\\ln(1+y)-y+y^2/2]}{y^3}\\quad(y>0),\\qquad \\chi(0)=1,\\qquad y=\\kappa d_i^{DH},\\qquad \\chi(y)=\\sum_{k=0}^{24}\\frac{3(-y)^k}{k+3}+O(y^{25})\\quad(y\\to0)."
  - eqid: "debye_huckel_helmholtz"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[Bulow2019], Eq.~(2)"
    status: "Source equation"
    description: "Finite-size Debye--Huckel residual Helmholtz contribution."
    change_note: "d_i^DH is the separately declared finite-size diameter in metres; equality to packing or Born diameters requires source justification. The ion-free support restriction is identically zero before screening operations; the dilute three-halves power does not admit a finite ionic insertion Hessian."
    math: "a^{DH}=-\\frac{\\kappa e^2}{12\\pi\\epsilon_0\\epsilon_{r,\\mathrm{bulk}}k_BT}\\sum_{i\\in\\mathcal I}x_i z_i^2\\chi(\\kappa d_i^{DH})."
  - eqid: "debye_screening_parameter"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[Bulow2019], Debye screening definition associated with Eq.~(2)"
    status: "Source equation"
    description: "SI Debye screening parameter for the resolved bulk dielectric."
    change_note: "Uses molar density and the current EOS physical constants."
    math: "\\kappa=\n\\sqrt{\\frac{\\rho_mN_Ae^2S_z}\n{\\epsilon_0\\epsilon_{r,\\mathrm{bulk}}k_BT}}."
  - eqid: "declared_solvent_source_reference_transfer"
    section: "Native phase coordinates"
    subsection: ""
    source: "Unqualified source-activity conversion; reference-pressure consistency must be established in Properties reference thermochemistry (M3)"
    status: "Documentation-only"
    description: "Trial-pressure fugacity/activity contraction; this expression is not an accepted conversion of a fixed source standard state. P in the displayed formula means P_trial, not P0."
    change_note: "Candidate for checking the reference-state discrepancy; not an adopted conversion. Do not infer that a source reference pressure is only provenance, or substitute trial pressure for fixed P0. The accepted pressure-density conversion has a separate ID."
    math: "\\begin{aligned}\n\\Delta_r^{\\mathrm{src}\\rightarrow\\mathrm{EOS}}\n&=c_r+s_r+\\Delta\\nu_r\\ln\\!\\left(\\frac{P}{\\rho^\\circ RT}\\right),\\\\\ns_r&=\\sum_i b_i^{(r)}\\ell_i^{\\mathrm{src}},\\\\\n\\ell_i^{\\mathrm{src}}&=\n\\begin{cases}\n\\ln x_i^S, & z_i=0,\\ x_i^S>0,\\\\\n\\ln(\\overline M_S m^\\circ), & z_i=0,\\ x_i^S=0,\\\\\n\\ln(\\overline M_S m^\\circ), & z_i\\ne0.\n\\end{cases}\n\\end{aligned}"
  - eqid: "density_correlated_bulk_permittivity"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Yang, Kontogeorgis, and de Hemptinne (2024), DOI 10.1016/j.fluid.2024.114103, Eqs. (1a), (2a), and (2b)"
    status: "Bounded empirical relation"
    description: "Schreckenberg density-and-temperature bulk relative permittivity."
    change_note: "The solvent partial density makes the dilute-density limit explicit."
    math: "\\epsilon_{r,\\mathrm{bulk}}=\n1+\\rho_m x_{\\mathrm{solv}}d_{V,\\mathrm{mix}}\n\\left(\\frac{d_{T,\\mathrm{mix}}}{T}-1\\right)."
  - eqid: "density_correlation_mixed_parameters"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Yang, Kontogeorgis, and de Hemptinne (2024), DOI 10.1016/j.fluid.2024.114103, Eqs. (2a)--(2b)"
    status: "Bounded empirical relation"
    description: "Solvent-fraction-normalized Schreckenberg mixture parameters."
    change_note: "Only neutral-solvent components enter these mixtures."
    math: "x_{\\mathrm{solv}}=\\sum_{s\\in\\mathcal{S}}x_s,\\qquad\nd_{V,\\mathrm{mix}}=\\frac{\\sum_{s\\in\\mathcal{S}}x_sd_{V,s}}{x_{\\mathrm{solv}}},\n\\qquad\nd_{T,\\mathrm{mix}}=\\frac{\\sum_{s\\in\\mathcal{S}}x_sd_{T,s}}{x_{\\mathrm{solv}}}."
  - eqid: "density_residual"
    section: "Density closure and mechanical domain"
    subsection: ""
    source: "Exact pressure-closure equation using Eq.~`pressure`"
    status: "Exact derivation"
    description: "Scalar residual whose roots are specified-pressure EOS states."
    change_note: "Root-search mechanics are not thermodynamic equations."
    math: "F(\\rho_m;T,\\boldsymbol{x},P^\\star)\n=P_{\\mathrm{EOS}}(T,\\rho_m,\\boldsymbol{x})-P^\\star=0."
  - eqid: "density_upper_bound"
    section: "Density closure and mechanical domain"
    subsection: ""
    source: "Exact inversion of Eqs.~`packing_fraction_coefficient` and `close_packing_fraction`"
    status: "Exact derivation"
    description: "Model-specific density boundary implied by close packing."
    change_note: "Reuses the sole EOS packing geometry owner."
    math: "\\rho_{\\max}=\\frac{\\eta_{\\mathrm{cp}}}{c_\\eta(T,\\boldsymbol{x})}."
  - eqid: "dependent_born_diameter_derivative"
    section: "Parameter regression"
    subsection: "Dependent hydration coordinate"
    source: "Implicit-function theorem applied to `infinite_dilution_solvation_energy` and `log_fugacity_coefficient_parameter_derivative`."
    status: "Exact derivation"
    description: "A Born diameter holds a declared single-ion solvation energy, with exact first columns contracted through the independent cross-family affine chart."
    change_note: "Independent scalar holds only; nonzero scaled H_d, a declared bracket and both energy and diameter-correction criteria are required. Final acceptance uses the stored diameter without solving the equality again. Target uncertainty is fixed, not estimated."
    math: "H=RT\\ln\\varphi_i^\\infty-\\Delta G_{i,\\mathrm{target}}^\\infty=0,\n\\qquad\\frac{d d_i}{d\\theta_a}=-\\frac{H_a}{H_d},\n\\qquad J^\\mathrm{opt}_{jc}=\\sqrt{w_j}\\,\\frac{dr_j}{dy_j}\\sum_r\\frac{\\partial y_j}{\\partial\\theta_r}D_{rc},\n\\quad D_{rc}=\\frac{d\\theta_r}{dv_c}.\n$$\n\nFor the explicit targets $(\\sigma_i,d_{\\mathrm{packing},i},d_{\\mathrm{DH},i})=(q,0.88q,0.88q)$,\nthe implicit-function contraction includes every independent raw column:\n\n$$\n\\frac{d d_{\\mathrm{Born},i}}{d v_j}\n=-\\frac{s_j\\left(H_{\\sigma_i}+0.88H_{d_{\\mathrm{packing},i}}+0.88H_{d_{\\mathrm{DH},i}}\\right)}{H_{d_{\\mathrm{Born},i}}}."
  - eqid: "dipolar_correlation_integral"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Rueben et al. (2024), DOI 10.1021/acs.jced.4c00347, Eq. (5)"
    status: "Source equation"
    description: "Rueben correlation integral from component correlation parameters."
    change_note: "The correlation parameter is an explicit record for every component."
    math: "I=1+\\left(\\sum_i a_{2,i}x_i\\right)\\left[\\exp(-y)-1\\right]."
  - eqid: "dipolar_helmholtz"
    section: "Contribution intermediates"
    subsection: "Dipole-dipole"
    source: "[Gross2006], Eq.~(7)"
    status: "Source equation"
    description: "Optional third-order Padé dipole-dipole Helmholtz contribution; zero when every dipolar species is absent."
    change_note: "Admitted as an opt-in family by ADR 0011."
    math: "a^{dd}=\\frac{A_2}{1-A_3/A_2},\\qquad a^{dd}=0\\ \\text{if}\\ A_2=0."
  - eqid: "dipolar_integrals"
    section: "Contribution intermediates"
    subsection: "Dipole-dipole"
    source: "[Gross2006], Eqs.~(10)--(16) and Table 1"
    status: "Source equation"
    description: "Pair and triplet correlation integrals with chain-length-interpolated coefficients, shared by the dipole (Table 1) and the quadrupole ([Gross2005], Eqs.~(12)--(19) and Table 2)."
    change_note: "The unlike energy in J2 is the geometric mean without k_ij. Only the dipole caps its chain lengths at 2 (ADR 0011); the quadrupole uses the uncapped $m_{ij}$, $m_{ijk}$ (ADR 0014)."
    math: "J_{2,ij}=\\sum_{n=0}^{4}\\left(a_{n,ij}+b_{n,ij}\\frac{\\epsilon_{ij}}{kT}\\right)\\eta^n,\\quad\nJ_{3,ijk}=\\sum_{n=0}^{4}c_{n,ijk}\\eta^n,\\quad\na_{n}=a_{0n}+\\frac{m-1}{m}a_{1n}+\\frac{m-1}{m}\\frac{m-2}{m}a_{2n},\\quad\n\\epsilon_{ij}=\\sqrt{\\epsilon_i\\epsilon_j},\\\\\n\\text{dipole: } m_{ij}=\\min\\!\\left(\\sqrt{m_im_j},2\\right),\\ m_{ijk}=\\min\\!\\left((m_im_jm_k)^{1/3},2\\right);\\qquad\n\\text{quadrupole: } m_{ij}=\\sqrt{m_im_j},\\ m_{ijk}=(m_im_jm_k)^{1/3}."
  - eqid: "dipolar_perturbation_bulk_permittivity"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Rueben et al. (2024), DOI 10.1021/acs.jced.4c00347, Eq. (6)"
    status: "Source equation"
    description: "Rueben perturbation-theory bulk relative permittivity."
    change_note: "The relation tends to one as all component partial densities vanish."
    math: "\\epsilon_{r,\\mathrm{bulk}}=\n1+3y\\left\\{1+y+\\left[\\frac{17}{16}I-1\\right]y^2\\right\\}."
  - eqid: "dipolar_second_order"
    section: "Contribution intermediates"
    subsection: "Dipole-dipole"
    source: "[Gross2006], Eq.~(8) with $q_i=(\\epsilon_i/kT)n_{\\mu,i}\\mu_i^{*2}$"
    status: "Exact derivation"
    description: "Second-order dipole-dipole perturbation term."
    change_note: "The reduced moment $q_i=n_{\\mu,i}\\mu_i^2/(4\\pi\\varepsilon_0kTm_i\\sigma_i^3)$ absorbs $\\epsilon_i$."
    math: "A_2=-\\pi\\widehat{\\rho}\\sum_i\\sum_j x_ix_j\\frac{\\sigma_i^3\\sigma_j^3}{\\sigma_{ij}^3}q_iq_jJ_{2,ij}."
  - eqid: "dipolar_third_order"
    section: "Contribution intermediates"
    subsection: "Dipole-dipole"
    source: "[Gross2006], Eq.~(9) with the same $q_i$"
    status: "Exact derivation"
    description: "Third-order dipole-dipole perturbation term."
    change_note: "Uses $\\sigma_{ij}=(\\sigma_i+\\sigma_j)/2$ for every pair."
    math: "A_3=-\\frac{4\\pi^2}{3}\\widehat{\\rho}^{\\,2}\\sum_i\\sum_j\\sum_k x_ix_jx_k\n\\frac{\\sigma_i^3\\sigma_j^3\\sigma_k^3}{\\sigma_{ij}\\sigma_{ik}\\sigma_{jk}}q_iq_jq_kJ_{3,ijk}."
  - eqid: "dispersion_chain_coefficients"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eqs.~(A.18)--(A.19)"
    status: "Source equation"
    description: "Chain-length interpolation of universal dispersion coefficients."
    change_note: "Mirrors the current A0/A1/A2 and B0/B1/B2 arrays."
    math: "\\begin{aligned}\na_k(\\overline m)&=a_{0k}\n+\\frac{\\overline m-1}{\\overline m}a_{1k}\n+\\frac{(\\overline m-1)(\\overline m-2)}{\\overline m^2}a_{2k},\\\\\nb_k(\\overline m)&=b_{0k}\n+\\frac{\\overline m-1}{\\overline m}b_{1k}\n+\\frac{(\\overline m-1)(\\overline m-2)}{\\overline m^2}b_{2k}.\n\\end{aligned}"
  - eqid: "dispersion_compressibility_factor"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.11)"
    status: "Source equation"
    description: "Chain compressibility correction multiplying the second-order term."
    change_note: "Mirrors the current rational expression."
    math: "C_1=\\left[\n1+\\overline m\\frac{8\\eta-2\\eta^2}{(1-\\eta)^4}\n+(1-\\overline m)\n\\frac{20\\eta-27\\eta^2+12\\eta^3-2\\eta^4}\n{[(1-\\eta)(2-\\eta)]^2}\n\\right]^{-1}."
  - eqid: "dispersion_first_moment"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.12)"
    status: "Source equation"
    description: "First unlike-pair dispersion mixture moment."
    change_note: "Includes current segment counts and cross diameter."
    math: "M_1=\\sum_i\\sum_j x_ix_jm_im_j\\sigma_{ij}^3\n\\frac{\\epsilon_{ij}/k_B}{T}."
  - eqid: "dispersion_helmholtz"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.10)"
    status: "Source equation"
    description: "PC-SAFT first- and second-order dispersion Helmholtz contribution."
    change_note: "Reconciled to the current angstrom number-density basis."
    math: "a^{disp}=-2\\pi\\widehat{\\rho}I_1M_1\n-\\pi\\widehat{\\rho}\\,\\overline m\\,C_1I_2M_2."
  - eqid: "dispersion_integral_one"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.16)"
    status: "Source equation"
    description: "First PC-SAFT dispersion integral correlation."
    change_note: "Evaluated through the shared polynomial owner."
    math: "I_1(\\eta,\\overline m)=\\sum_{k=0}^{6}a_k(\\overline m)\\eta^k."
  - eqid: "dispersion_integral_two"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.17)"
    status: "Source equation"
    description: "Second PC-SAFT dispersion integral correlation."
    change_note: "Evaluated through the shared polynomial owner."
    math: "I_2(\\eta,\\overline m)=\\sum_{k=0}^{6}b_k(\\overline m)\\eta^k."
  - eqid: "dispersion_polynomial"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], polynomial form in Eqs.~(A.16)--(A.17)"
    status: "Exact derivation"
    description: "Horner-evaluated sixth-order dispersion polynomial."
    change_note: "Documents the real arithmetic performed by polynomial."
    math: "\\mathcal{P}(\\boldsymbol{c},\\eta)=\\sum_{k=0}^{6}c_k\\eta^k."
  - eqid: "dispersion_second_moment"
    section: "Contribution intermediates"
    subsection: "Dispersion"
    source: "[Gross2001], Eq.~(A.13)"
    status: "Source equation"
    description: "Second unlike-pair dispersion mixture moment."
    change_note: "Includes the squared reduced pair energy."
    math: "M_2=\\sum_i\\sum_j x_ix_jm_im_j\\sigma_{ij}^3\n\\left(\\frac{\\epsilon_{ij}/k_B}{T}\\right)^2."
  - eqid: "dual_inner_problem"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eqs. 9--11"
    status: "Source equation"
    description: "Global inner infimum on the admitted phase domain; g is reduced molar Gibbs energy, x0 is feed composition. Reactive systems replace composition by conserved-moiety coordinates."
    change_note: "The feed multiplier term is required in the lower bound. A local inner minimum supplies no certified global lower bound."
    math: "q(\\boldsymbol\\alpha)=\\inf_{\\boldsymbol x,v}\\left[g(\\boldsymbol x,v)-\\boldsymbol\\alpha\\cdot\\boldsymbol x\\right],\\qquad q(\\boldsymbol\\alpha)+\\boldsymbol\\alpha\\cdot\\boldsymbol x^{0}\\le g^{*}(\\boldsymbol x^{0})."
  - eqid: "effective_dipolar_density"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Rueben et al. (2024), DOI 10.1021/acs.jced.4c00347, Eq. (4)"
    status: "Source equation"
    description: "Rueben effective dipolar-density variable in the Angstrom number-density basis."
    change_note: "Dipole-squared and polarizability records are explicit for every component."
    math: "y=\\frac{4\\pi}{9}\\sum_i \\widehat{\\rho}_i\n\\left(\\frac{\\mu_i^2\\,10^{-19}}{k_BT}+3\\alpha_i\\right),\n\\qquad\n\\widehat{\\rho}_i=\\rho_mN_Ax_i10^{-30}."
  - eqid: "effective_water_amounts"
    section: "Equilibrium"
    subsection: "Amount conversion"
    source: "Nasrifar and Tafazzol (2010), section 6, p.7627, effective-water passage"
    status: "Source equation"
    description: "Lump every charged species amount into declared neutral water, preserving every remaining free molecular species and the current true-species mole total. This molecular representation does not preserve every elemental inventory."
    change_note: "Native conversion requires this ideal model's criterion-meeting liquid result and a complete disjoint water/ion/molecular partition. It does not calculate molecular phase equilibrium or reproduce Figure 15."
    math: "\\widetilde n_w=n_w+\\sum_{i\\in I}n_i,\\qquad\n\\widetilde n_j=n_j\\ (j\\in J),\\qquad\n\\widetilde N=\\widetilde n_w+\\sum_{j\\in J}\\widetilde n_j=N."
  - eqid: "electrolyte_activity_parameter_derivative"
    section: "Properties"
    subsection: "Electrolyte reference actions"
    source: "`mean_ionic_activity_coefficient`, `molality_activity_conversion`, `practical_osmotic_coefficient` and `log_fugacity_coefficient_parameter_derivative`."
    status: "Exact derivation"
    description: "Molality-scale mean ionic activity, solvent activity and practical osmotic first parameter columns."
    change_note: "Ionic reference columns are the terminal-pair limit of `reference_molality_sequence`, the exact derivative of the returned reference. Solvent columns subtract the same-T/P pure-solvent column, including the implicit density, association and dielectric/Born derivatives. Physical coordinates, composition, T/P and molar masses are held fixed. At pure solvent activity columns are zero; unavailable Phi has unavailable columns. Energies multiply ionic reference columns by RT in J/mol."
    math: "\\frac{\\partial\\gamma_\\pm^{(m)}}{\\partial\\theta_a}\n=\\gamma_\\pm^{(m)}\\frac{\\sum_k\\nu_k(g_{k,a}-g^\\infty_{k,a})}{\\sum_k\\nu_k},\n\\qquad \\frac{\\partial\\Phi}{\\partial\\theta_a}\n=-\\frac{g_{s,a}-g^\\mathrm{pure}_{s,a}}{M_s q},\\qquad\n\\frac{\\partial a_s}{\\partial\\theta_a}=a_s(g_{s,a}-g^\\mathrm{pure}_{s,a})."
  - eqid: "electrolyte_phase_coordinate_jacobian"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact Jacobian of Eqs.~`phase_mole_fraction`--`phase_molar_density`"
    status: "Exact derivation"
    description: "State-coordinate Jacobian used to transform electrolyte Helmholtz gradients."
    change_note: "Retained by the Equilibrium EOS workflow historical CAP-07 proposal; current qualification is linked from its GitHub issue; the generic EOS tape differentiates amount-volume coordinates directly."
    math: "\\frac{\\partial\\rho_m}{\\partial n_j}=\\frac{1}{V},\n\\quad\n\\frac{\\partial\\rho_m}{\\partial V}=-\\frac{n}{V^2},\n\\quad\n\\frac{\\partial x_i}{\\partial n_j}=\\frac{\\delta_{ij}-x_i}{n},\n\\quad\n\\frac{\\partial x_i}{\\partial V}=0."
  - eqid: "electrolyte_phase_hessian_chain_rule"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact second-order multivariable chain rule"
    status: "Exact derivation"
    description: "Transform state Helmholtz Hessians into explicit amount-volume coordinates."
    change_note: "Retained by the Equilibrium EOS workflow historical CAP-07 proposal; current qualification is linked from its GitHub issue; the generic EOS tape differentiates amount-volume coordinates directly."
    math: "\\frac{\\partial^2(na^r)}{\\partial q_\\alpha\\partial q_\\beta}\n=n_\\alpha a^r_{y_p}y_{p,\\beta}\n+n_\\beta a^r_{y_p}y_{p,\\alpha}\n+n\\left(\na^r_{y_py_q}y_{p,\\alpha}y_{q,\\beta}\n+a^r_{y_p}y_{p,\\alpha\\beta}\n\\right),\n\\quad\n\\boldsymbol{y}=(\\rho_m,\\boldsymbol{x})."
  - eqid: "electroneutral_amount_chart"
    section: "Equilibrium"
    subsection: ""
    source: "[Perdomo2025] Section 3.1 (elimination of one charged species before Eq. 18; reduced gradient Eq. 22)"
    status: "Implementation convention"
    description: "Electroneutral reduced coordinates for the tangent-plane search: one ion eliminated per charged trial phase."
    change_note: "Candidate reduced chart for charged search; not a current solver-availability claim. Eliminated ion has nonzero charge and reconstructed amounts must be nonnegative."
    math: "n_{p,e}=-\\frac{1}{z_e}\\sum_{i\\neq e} z_i\\,n_{p,i}."
  - eqid: "electroneutral_trial_reconstruction"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Charge equality and common normalization; #223 adopted numerical admission, #904 positive charge repair"
    status: "Implementation convention"
    description: "Reconstruct finite positive supported u=exp(y). Ionic supports require both charge signs. Rescale charge groups and normalize; unsupported entries retain their input values. Liquid trials increase the largest opposite-sign entry to correct charge roundoff (ties by index), then normalize by common division. Charged Vapor trials use multiplicative log rescaling and omit the additive ionic correction to preserve trace coordinates."
    change_note: "Reject loss of positivity/support or domain. Neutral supports normalize directly; a singleton is exactly one. Reevaluate energy at v=c(T,w)/η. This is numerical admission, not exact-real feasibility. For $q=0$, use $v=w$ and the same common normalization. Stored fractions must remain finite and strictly positive; both absolute sum and charge defects must be at most $10^{-12}$. Overflow or underflow is not repaired."
    math: "\\begin{aligned}\nQ_+&=\\sum_{z_i>0}z_i u_i,\\quad Q_-=\\sum_{z_i<0}|z_i|u_i,\\\\\n\\widehat u_i&=\\begin{cases}u_i\\sqrt{Q_-/Q_+},&z_i>0,\\\\u_i\\sqrt{Q_+/Q_-},&z_i<0,\\\\u_i,&z_i=0,\\end{cases}\n\\qquad w_i=\\frac{\\widehat u_i}{\\sum_{j\\in S}\\widehat u_j},\\\\\nq&=\\sum_{i\\in S}z_iw_i,\\qquad\nk=\\begin{cases}-,&q>0,\\\\+,&q<0,\\end{cases}\\\\\nv_i&=w_i+\\mathbf1_{i=k}\\frac{|q|}{|z_k|},\\qquad\nw_i^{\\mathrm{new}}=\\frac{v_i}{\\sum_{j\\in S}v_j}\\quad(q\\ne0).\n\\end{aligned}"
  - eqid: "envelope_local_condition"
    section: "Equilibrium critical and envelope conditions"
    subsection: ""
    source: "Michelsen 1980, Fluid Phase Equilib. 4, 1–10, pp. 2–4, Eqs. 9 and 14–18 (selectable specification and local parametrization), adapted to the raw T/P chart; issue #224 slice B"
    status: "Source equation"
    description: "One scalar row of an envelope cell (a finite feed phase and an incipient phase pinned at zero amount, T and P free): the selected comparison coordinate minus its target s, with T_unit = 1 K, P_unit = 1 Pa and K_k = x_k^inc/x_k^feed."
    change_note: "∂row/∂s = −1. The ln T and ln P rows have second derivatives −1/T² and −1/P²; the ln K row is a difference of log-composition coordinates and is affine."
    math: "\\ln(T/T_{unit})-s=0,\\quad \\ln(P/P_{unit})-s=0,\\quad \\ln x_k^{inc}-\\ln x_k^{feed}-s=0."
  - eqid: "equilibrium_isobaric_heat_capacity"
    section: "Equilibrium"
    subsection: "Caloric observables"
    source: "Total extensive enthalpy differentiated along the fixed-pressure equilibrium branch; [issue #225](https://github.com/tannerpolley/ePC-SAFT/issues/225), sections 1 and 5, owner-selected D3"
    status: "Exact derivation"
    description: "Apparent isobaric heat capacity includes phase and reaction relaxation, normalized by the declared positive feed sum. Native actions use physical increments on a dimensionless path parameter; the auxiliary thermal increment is 1 K."
    change_note: "Equilibrium owns the phase-amount/enthalpy Taylor products. Parameter fitting consumes the value and first mixed thermal actions, dividing out physical increments before the affine optimizer map. Driven T/P and a smooth regular branch are required. No second apparent heat-capacity action or physical calorimetry is established."
    math: "H=\\sum_p n_p h_p,\\qquad N_f=\\sum_i n_{f,i},\\qquad\nc_{P,eq}=\\frac{DH[w_T]}{N_f\\delta_T},\\qquad \\delta_T=1\\ \\mathrm{K},\n$$\n$$\nDc_{P,eq}[w]=\\frac{D^2H[w_T,w]}{N_f\\delta_T}\n-\\frac{DH[w_T]DN_f[w]}{N_f^2\\delta_T},\\qquad\n\\partial_k c_{P,eq}=\\frac{D^2H[w_T,w_k]}{N_f\\delta_T\\delta_k}\\quad(DN_f[w_k]=0)."
  - eqid: "errors_in_variables_objective"
    section: "Parameter estimation"
    subsection: ""
    source: "Zavala (2008), thesis chapter 4, §4.2, Eq. (4.2), printed p. 53 (PDF p. 65); independent physical-unit Gaussian errors selected in #510; the known joint Gaussian covariance (generalized least-squares negative log-likelihood) selected in #572."
    status: "Exact derivation"
    description: "Joint least squares for model parameters v and one standardized correction u per measured input shared by outputs of experiment k, with an optional known correlation R over the positive-weight output errors followed by the active input corrections."
    change_note: "sigma_q is finite and nonnegative; zero eliminates its coordinate. Objective sigma_y is finite and positive. Difference residuals use sqrt(w)=a/sigma_y exactly once. Report-only outputs and zero-sigma inputs occupy no row of e or R. A declared covariance C converts through the sigmas; R is fixed, symmetric positive definite with unit diagonal within 64 m epsilon, and never repaired. R = I recovers the independent sum."
    math: "q_{kj}=q^M_{kj}+\\sigma_{q,kj}u_{kj},\\quad\nr^x_{kj}=u_{kj},\\quad r^y_{ki}=\\frac{f_{ki}(\\theta(v),X_k(q_k))-y^M_{ki}}{\\sigma_{y,ki}},\\qquad\n\\mathbf e=\\begin{bmatrix}\\mathbf r^y\\\\\\mathbf r^x\\end{bmatrix},\\quad\nR=\\Sigma^{-1}C\\,\\Sigma^{-1}=LL^T,\\quad\n\\min_{v,u}\\frac12\\lVert L^{-1}\\mathbf e\\rVert^2\n\\;\\overset{R=I}{=}\\;\\frac12\\sum_{k,i}(r^y_{ki})^2+\\frac12\\sum_{k,j}(r^x_{kj})^2."
  - eqid: "errors_in_variables_residual_derivative"
    section: "Parameter estimation"
    subsection: ""
    source: "Differentiation of errors_in_variables_objective and independent_feed_measurement_coordinates; existing exact pressure-closed and solved-equilibrium actions."
    status: "Exact derivation"
    description: "Native first derivatives of standardized measurement residuals; D maps optimizer model parameters to physical parameters; a declared correlation applies the same triangular solve to every complete column."
    change_note: "Input-prior rows are exact identities before whitening. T/P actions include finite and reference states; molality actions hold the reference ladder fixed. Ionic T/P reference columns are the terminal-pair limit of `reference_limit_terminal_pair`. Raw prediction columns dy/dv and sigma_q dy/dq come from the physical actions, never from whitened rows."
    math: "\\frac{\\partial r^y_{ki}}{\\partial v_a}=\\frac1{\\sigma_{y,ki}}\\sum_b\\frac{\\partial f_{ki}}{\\partial\\theta_b}D_{ba},\\quad\n\\frac{\\partial r^y_{ki}}{\\partial u_{kj}}=\\frac{\\sigma_{q,kj}}{\\sigma_{y,ki}}\\frac{\\partial f_{ki}}{\\partial X_k}\\frac{\\partial X_k}{\\partial q_{kj}},\\qquad\n\\frac{\\partial r^x_{kj}}{\\partial v_a}=0,\\quad\\frac{\\partial r^x_{kj}}{\\partial u_{lh}}=\\delta_{kl}\\delta_{jh},\\qquad\n\\frac{\\partial(L^{-1}\\mathbf e)}{\\partial(v,u)}=L^{-1}\\frac{\\partial\\mathbf e}{\\partial(v,u)}."
  - eqid: "extensive_enthalpy_specification"
    section: "Equilibrium caloric specifications"
    subsection: ""
    source: "`total_enthalpy`, extensive phase summation and resolved-feed normalization; issue #224 slice A"
    status: "Exact derivation"
    description: "Fixed pressure and one extensive enthalpy target H_spec [J] determine free temperature and phase amounts on declared neutral supports."
    change_note: "Same-density total calorics use the supplied component anchors and standard pressure; the denominator uses the current feed and temperature."
    math: "r_H=\\frac{\\sum_p N_p h_p^{tot}-H_{spec}}{N_{feed}RT}."
  - eqid: "extensive_entropy_specification"
    section: "Equilibrium caloric specifications"
    subsection: ""
    source: "`total_entropy`, extensive phase summation and resolved-feed normalization; issue #224 slice A"
    status: "Exact derivation"
    description: "Fixed pressure and one extensive entropy target S_spec [J/K] determine free temperature and phase amounts on declared neutral supports."
    change_note: "Same-density ideal and residual entropy share the supplied component anchors and standard pressure; zero pinned amounts contribute zero."
    math: "r_S=\\frac{\\sum_p N_p s_p^{tot}-S_{spec}}{N_{feed}R}."
  - eqid: "finite_addition_enthalpy"
    section: "Parameter regression"
    subsection: "Enthalpy observations"
    source: "Closed-system enthalpy balance for a declared finite feed addition, using EqIDs `total_enthalpy`, `ideal_enthalpy` and `residual_enthalpy`; accepted observation definition in issue #210"
    status: "Exact derivation"
    description: "Signed total-system enthalpy increment per mole of total feed added between two declared equilibrium states, less the ideal-plus-residual feed enthalpy at its declared temperature, pressure, composition and branch. Each phase enthalpy uses EqID `total_enthalpy` on the declared thermochemistry's $P^{\\circ}$ basis. Exothermic absorption is negative. A zero-pinned phase contributes zero and is not evaluated."
    change_note: "Both endpoint problems share parameters, thermochemistry, ordered reactions and source reference. Their feed amounts differ by $n_{add}\\mathbf y$ within the admission tolerance. Each endpoint may have its own specification and temperature, with referenced free-temperature endpoints consuming the shared native first caloric actions at their solved temperatures. Every feed species needs an ideal-gas record. The exact first action holds feed state and amount fixed, differentiates both endpoint phase amounts and enthalpies, and subtracts the feed residual action; ideal feed enthalpy is independent of fitted parameters. The observation is an enthalpy increment for free-pressure endpoints; interpreting it as measured heat is an energy-balance choice unless endpoints and feed are isobaric at one pressure. For the fixed-T/P saturation-capped declaration in #906, the fixed analytical basis is N_b mol and source loading cap is alpha_LP mol/mol. The existing bubble rows compose n(alpha)=n0+N_b alpha y with (p_b-P)/P=0 through the same driver; ALG-EQUILIBRIUM owns the search and its limits. The endpoint enthalpy action includes movement of its feed. The source branch has zero endpoint-loading action; the saturation branch uses the loading coordinate action from EqID `implicit_sensitivity`. The eliminated ordinary-bubble check is alpha_s,v=-p_b,v/p_b,alpha at fixed physical P. Exact equality preserves heat but refuses its classical gradient, with one-sided loading action min(0,D alpha_s); unresolved nearby branches also refuse the gradient without changing the exact minimum. EqID `affine_parameter_coordinate_map` applies the coordinate map once."
    math: "\\Delta h_{add}=\\frac{H^{(2)}-H^{(1)}}{n_{add}}-h_{feed},\\qquad\nH^{(k)}=\\sum_{p\\notin Z_k}n_p^{(k)}h_p^{(k)},\\\\\nh_{feed}=h^{id}(T_f,\\mathbf y)+h^{res}(T_f,P_f,\\mathbf y;\\theta),\\\\\n\\frac{d\\Delta h_{add}}{d\\theta}=\\frac{1}{n_{add}}\\sum_{k=1}^{2}\\sigma_k\\sum_{p\\notin Z_k}\n\\left(\\dot n_p^{(k)}h_p^{(k)}+n_p^{(k)}\\dot h_p^{(k)}\\right)\n-\\left.\\frac{\\partial h^{res}}{\\partial\\theta}\\right|_{T_f,P_f,\\mathbf y},\\qquad\n\\sigma_1=-1,\\quad\\sigma_2=1.\n\\\\\n\\alpha_e=\\min(\\alpha_{LP},\\alpha_s),\\quad n_{add}=N_b\\alpha_e,\\quad\nQ=\\frac{H_e-H_0}{N_b\\alpha_e}-h_{feed},\\\\\nQ_{v_j}=\\frac{H_{e,v_j}-H_{0,v_j}}{N_b\\alpha_e}-h_{feed,v_j}\n-\\frac{H_e-H_0}{N_b\\alpha_e^2}\\alpha_{e,v_j}."
  - eqid: "fixed_pressure_fugacity_correction"
    section: "Thermodynamic properties"
    subsection: ""
    source: "EOS Newton correction using Eq.~`pressure_density_derivative`"
    status: "Documentation-only"
    description: "Correct a converged-state log fugacity for its bounded pressure residual."
    change_note: "First-order residual-error estimate for comparison with the exact extensive-coordinate pressure constraint; not a replacement for solving that constraint."
    math: "\\begin{aligned}\n\\Delta\\rho_m&=-\\frac{P-P^\\star}{P_\\rho},\\\\\n\\ln\\phi_i(P^\\star)&\\approx\n\\ln\\phi_i(P)+(\\ln\\phi_i)_\\rho\\,\\Delta\\rho_m.\n\\end{aligned}"
  - eqid: "fixed_pressure_heat_capacity_parameter_derivative"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Composition of `fixed_pressure_total_derivative`, `total_heat_capacity_cp` and `residual_heat_capacity_cp`"
    status: "Exact derivation"
    description: "First parameter derivative of total molar isobaric heat capacity at fixed T, P and normalized composition on a regular declared density branch. The ideal-gas thermochemistry coefficients are fixed inputs independent of the residual-EOS parameters. Parameter regression calls the Properties pressure-chart action once per parameter direction; the common energy order is three, including the implicit association-site chain (ALG-ACTIONS)."
    change_note: "Qualified by the total-value, derivative-ladder and density-lift checks in `engine/tests/native/regression_j2_inventory_checks.cpp` and the retained `analyses/2026-heat-capacity-fitting/` evidence. No parameter Hessian or reacting-equilibrium heat-capacity derivative is claimed."
    math: "\\left.\\frac{dc_p}{d\\theta}\\right|_{T,P,\\mathbf{x}}\n=\\left.\\frac{\\partial c_p^{res}}{\\partial\\theta}\\right|_{T,\\rho,\\mathbf{x}}\n-\\left.\\frac{\\partial c_p^{res}}{\\partial\\rho}\\right|_{T,\\theta,\\mathbf{x}}\n \\frac{P_\\theta}{P_\\rho},\n\\qquad \\frac{dc_p^{id}}{d\\theta}=0,\\qquad P_\\rho>0."
  - eqid: "fixed_pressure_total_derivative"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact implicit derivative of the pressure constraint"
    status: "Exact derivation"
    description: "Total derivative of a property with respect to an active coordinate at fixed pressure."
    change_note: "Applied by the generic EOS active-coordinate block, including canonical Born, solvation, and permittivity coordinates."
    math: "\\left.\\frac{dQ}{d\\theta}\\right|_{P}\n=Q_\\theta+Q_\\rho\\left.\\frac{d\\rho_m}{d\\theta}\\right|_P,\n\\qquad\n\\left.\\frac{d\\rho_m}{d\\theta}\\right|_P=-\\frac{P_\\theta}{P_\\rho}."
  - eqid: "formula_unit_composition"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], formula-unit molality reference-state basis"
    status: "Exact derivation"
    description: "Convert salt formula-unit molality per kilogram of salt-free solvent to mole fractions."
    change_note: "Uses one kilogram of salt-free solvent as the construction basis."
    math: "\\begin{aligned}\n\\overline M_s&=\\sum_{s\\in\\mathcal{S}}y_sM_s,\n&n_s^{(0)}&=\\frac{1}{\\overline M_s},\\\\\nn_{\\mathrm{tot}}&=n_s^{(0)}+m(\\nu_++\\nu_-),\n&x_s&=\\frac{y_sn_s^{(0)}}{n_{\\mathrm{tot}}},\n&x_\\pm&=\\frac{\\nu_\\pm m}{n_{\\mathrm{tot}}}.\n\\end{aligned}"
  - eqid: "gibbs_conjugate_molar_volume"
    section: "Reference thermochemistry"
    subsection: "Declared derivations"
    source: "Frozen-composition Gibbs derivatives and the anchored completion in [issue #225](https://github.com/tannerpolley/ePC-SAFT/issues/225), section 1, D1(a)"
    status: "Exact derivation"
    description: "The volume conjugate to system pressure includes the record-anchored standard pressure derivative. It is distinct from the EOS mechanical volume. Internal energy and frozen heat capacity use that same Gibbs volume."
    change_note: "Frozen raw T/P partials eliminate density and association at fixed composition before following the solved composition path. The local volume chart requires finite v_G and finite nonzero v_G,P, with a regular EOS root and site Jacobian. Record v_G>0 and v_G,P<0 as stable-chart diagnostics alongside quotient conditioning; these signs do not restrict mathematical admission or establish global reacting stability. Fixed-source-pressure standards have zero system-pressure derivatives and reduce to the mechanical definitions. A zero or unresolved denominator is diagnosed before a negative disposition; it is never replaced by the mechanical volume."
    math: "v_G=g_P=\\rho^{-1}+\\sum_i x_i g_{\\rho,i,P}^{\\circ},\\qquad\nV_G=\\sum_p n_p v_{G,p},\\qquad u_G=h-Pv_G,\\\\\nc_{v,G}=\\left(\\frac{\\partial u_G}{\\partial T}\\right)_{v_G,\\mathbf x}\n=c_p+T\\frac{v_{G,T}^2}{v_{G,P}},\\qquad\nv_{G,T}=\\left(\\partial_Tv_G\\right)_{P,\\mathbf x},\\quad\nv_{G,P}=\\left(\\partial_Pv_G\\right)_{T,\\mathbf x}."
  - eqid: "hard_chain_helmholtz"
    section: "Contribution intermediates"
    subsection: "Hard chain"
    source: "[Gross2001], Eq.~(A.4)"
    status: "Source equation"
    description: "PC-SAFT hard-chain residual Helmholtz contribution."
    change_note: "Mirrors the site-independent chain term."
    math: "a^{hc}=\\overline{m}\\,a^{hs}\n-\\sum_i x_i(m_i-1)\\ln g_{ii}^{hs}."
  - eqid: "hard_sphere_contact"
    section: "Contribution intermediates"
    subsection: "Hard chain"
    source: "[Gross2001], Eq.~(A.7) at i=j"
    status: "Source equation"
    description: "Hard-sphere radial distribution function at segment contact."
    change_note: "Uses the current pure-component contact diameter d_i/2."
    math: "g_{ii}^{hs}=\n\\frac{1}{1-\\eta}\n+\\frac{3(d_i/2)\\zeta_2}{(1-\\eta)^2}\n+\\frac{2(d_i/2)^2\\zeta_2^2}{(1-\\eta)^3}."
  - eqid: "hard_sphere_helmholtz"
    section: "Contribution intermediates"
    subsection: "Hard chain"
    source: "[Gross2001], Eq.~(A.6)"
    status: "Source equation"
    description: "Boublik-Mansoori-Carnahan-Starling-Leland hard-sphere Helmholtz term."
    change_note: "Mirrors the current zeta-based expression."
    math: "a^{hs}=\\frac{1}{\\zeta_0}\\left[\n\\frac{3\\zeta_1\\zeta_2}{1-\\zeta_3}\n+\\frac{\\zeta_2^3}{\\zeta_3(1-\\zeta_3)^2}\n+\\left(\\frac{\\zeta_2^3}{\\zeta_3^2}-\\zeta_0\\right)\n\\ln(1-\\zeta_3)\\right]."
  - eqid: "heat_capacity_ratio"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Ratio of the total isobaric and isochoric molar heat capacities."
    change_note: "Computed only on request; unavailable unless the total c_p (`total_heat_capacity_cp`) and c_v (`total_heat_capacity_cv`) are available, finite and positive, so it needs ideal thermochemistry."
    math: "\\gamma=\\frac{c_p}{c_v}."
  - eqid: "helmholtz_lagrangian_dual"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] problem D and Eq. 6"
    status: "Documentation-only"
    description: "Lagrangian dual in independent admissible composition-volume coordinates; a and v are molar Helmholtz energy and volume. Equality to the equilibrium convex envelope requires the source assumptions and an exact global inner infimum."
    change_note: "A source method, not an installed discovery claim; local search and finite outer cuts cannot certify a closed global gap."
    math: "g^D(\\tilde{\\boldsymbol x}^{0})=\\sup_{\\boldsymbol\\alpha}\\inf_{\\tilde{\\boldsymbol x},v}\\left[g(\\tilde{\\boldsymbol x},v)+\\boldsymbol\\alpha\\cdot(\\tilde{\\boldsymbol x}^{0}-\\tilde{\\boldsymbol x})\\right],\\qquad g=\\frac{a+Pv}{RT}."
  - eqid: "henry_constant_px"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Fugacity definition with the raw density-standard reference of `neutral_reaction_reference_transfer`; #566 design"
    status: "Exact derivation"
    description: "Fugacity-based Henry constant in Pa of a neutral solute i in one pure solvent of an all-neutral model: H = lim f_i/x_i, not the partial-pressure volatility p/x."
    change_note: "Admitted per neutral solute on one unit reaction row of `neutral_reaction_reference_transfer`, using the analytic solvent insertion of `infinite_dilution_reference`. Mixed solvents and charged models are refused (NonNeutralDeclaration). The molality form M_s H^px is not exposed."
    math: "H_i^{px}=\\lim_{x_i\\to0}\\frac{f_i}{x_i}=P\\phi_i^\\infty=RT\\rho_0\\exp L_i^\\infty,\\qquad L_i=\\ln\\frac{\\rho_m}{\\rho_0}+\\Phi_{n_i},\\qquad\\rho_0=1\\ \\mathrm{mol\\,m^{-3}}."
  - eqid: "ideal_enthalpy"
    section: "Reference thermochemistry"
    subsection: "Ideal calorics"
    source: "Ideal-gas mixture calorics on declared component pressure-standard records"
    status: "Exact derivation"
    description: "Molar ideal enthalpy is the linear mixture of component standard enthalpies."
    change_note: "Every component record must be available on its selected source interval."
    math: "h^{id}=\\sum_i x_i h_i^{\\circ}(T,P_0)."
  - eqid: "ideal_entropy"
    section: "Reference thermochemistry"
    subsection: "Ideal calorics"
    source: "Ideal-gas mixture entropy at the phase's actual molar density"
    status: "Exact derivation"
    description: "Molar ideal entropy from component pressure-standard entropies plus ideal mixing and density terms."
    change_note: "Use $x_i\\ln x_i\\to0$ at zero amount; no logarithmic insertion derivative is promised there."
    math: "s^{id}=\\sum_i x_i\\left[s_i^{\\circ}(T,P_0)-R\\ln\\frac{x_i\\rho RT}{P_0}\\right]."
  - eqid: "ideal_gas_density"
    section: "Density closure and mechanical domain"
    subsection: ""
    source: "Ideal-gas limiting relation"
    status: "Exact derivation"
    description: "Exact density closure for the declared neutral ideal-gas base; also the density scale for residual-model searches."
    change_note: "The ideal-gas base has one stable vapor root with pressure slope RT and no packing bound."
    math: "\\rho_{\\mathrm{ideal}}=\\frac{P^\\star}{RT}."
  - eqid: "ideal_gas_helmholtz"
    section: "Reference thermochemistry"
    subsection: "Ideal side"
    source: "Michelsen and Mollerup 2007, Thermodynamic Models: Fundamentals and Computational Aspects, ch. 2 (ideal-gas contribution); the translational and mixing term is registered under phase_helmholtz_amount_volume"
    status: "Exact derivation"
    description: "Molar reference offset added to the dimensionless ideal density/mixing term using fixed rho0. Per-species pressure-standard thermochemistry must be declared; absent reference data makes total calorics unavailable."
    change_note: "Includes pressure-to-density standard-state conversion; a_ref denotes a molar offset, not an independently complete ideal Helmholtz function."
    math: "\\frac{a^{\\circ}_{\\mathrm{ref}}}{RT}=\\sum_i x_i\\left[\\frac{h^{\\circ}_i(T)}{RT}-\\frac{s^{\\circ}_i(T,P_0)}{R}+\\ln\\frac{RT\\rho_0}{P_0}\\right],\\qquad h^{\\circ}_i(T)=\\Delta_f h^{\\circ}_i(T_{\\mathrm{ref}})+\\int_{T_{\\mathrm{ref}}}^{T}C^{\\circ}_{p,i}(\\tau)\\,d\\tau,\\qquad s^{\\circ}_i(T,P_0)=s^{\\circ}_i(T_{\\mathrm{ref}},P_0)+\\int_{T_{\\mathrm{ref}}}^{T}\\frac{C^{\\circ}_{p,i}(\\tau)}{\\tau}\\,d\\tau."
  - eqid: "ideal_heat_capacity_cp"
    section: "Reference thermochemistry"
    subsection: "Ideal calorics"
    source: "Ideal-gas mixture calorics"
    status: "Exact derivation"
    description: "Molar ideal isobaric heat capacity is the linear mixture of component source correlations."
    change_note: "Each source is evaluated only on its selected interval."
    math: "c_p^{id}=\\sum_i x_i c_{p,i}^{\\circ}(T)."
  - eqid: "ideal_heat_capacity_cv"
    section: "Reference thermochemistry"
    subsection: "Ideal calorics"
    source: "Ideal-gas identity $c_p-c_v=R$"
    status: "Exact derivation"
    description: "Molar ideal isochoric heat capacity on the same selected source intervals."
    change_note: "It inherits ideal-$c_p$ availability."
    math: "c_v^{id}=c_p^{id}-R."
  - eqid: "ideal_internal_energy"
    section: "Reference thermochemistry"
    subsection: "Ideal calorics"
    source: "Ideal-gas identity $h-u=RT$"
    status: "Exact derivation"
    description: "Molar ideal internal energy on the same declared thermochemical basis as ideal enthalpy."
    change_note: "No trial-pressure or density-standard offset is inserted into the physical value."
    math: "u^{id}=h^{id}-RT."
  - eqid: "ideal_molarity_reaction"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "IAPWS TGD9-18, Table 2, p.15, 25 °C concentration constants; reaction_activity_quotient and ideal_reaction_amount_coordinates"
    status: "Exact derivation"
    description: "Fixed declared solution volume V in m³ and absolute amounts in mol, with standard concentration c° = 1000 mol/m³. A declared neutral solvent has unit activity; no identifier selects this exception."
    change_note: "Products-positive stoichiometry. The formal proton convention H3O+ = H+ + H2O with unit water activity preserves the numerical source constants. This is ideal concentration chemistry, without EOS density closure or real-solution validation."
    math: "a_i^c=\\frac{n_i}{V c^\\circ},\\quad a_s^c=1\\text{ for a declared unit-activity solvent},\\qquad\nF_r=\\sum_i\\nu_{ir}\\ln a_i^c-\\ln K_r^c(T)=0,\\quad c^\\circ=1000\\ \\mathrm{mol\\,m^{-3}}.\n\\qquad m_s=0,\\quad m_i=1\\ (i\\ne s),\\qquad\n\\ln a_i^c=m_i[y_i+\\ln(N_{\\rm ref}/\\mathrm{mol})-\\ln(Vc^\\circ/\\mathrm{mol})],\\qquad\n\\partial_j F_r=\\nu_{jr}m_j,\\quad\\partial_{jk}F_r=0."
  - eqid: "ideal_mole_fraction_reaction"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Nasrifar and Tafazzol (2010), DOI 10.1021/ie901181n, Eq. (11), Table 1 and section 6, pp.7621,7627; ideal activity assumption"
    status: "Source equation"
    description: "Dimensionless mole-fraction activities with standard fraction one; positive products stoichiometry and caller-declared constants on the ideal-mole-fraction basis. Pressure does not enter these liquid chemistry rows."
    change_note: "Specializes reaction_activity_quotient. ReactionLogPolynomial owns the temperature law; its finite positive logarithm reference is independent of its evaluation interval. No EOS density or infinite-dilution correction applies."
    math: "a_i=x_i=\\frac{n_i}{N},\\quad N=\\sum_i n_i,\\qquad\nF_r=\\sum_i\\nu_{ir}\\ln x_i-\\ln K_r^x(T)=0."
  - eqid: "ideal_reaction_amount_coordinates"
    section: "Equilibrium"
    subsection: "Amount coordinates"
    source: "ideal_mole_fraction_reaction, ideal_molarity_reaction and material_balance; logarithm and exponential chain rules"
    status: "Exact derivation"
    description: "Log amounts on either ideal activity basis, scaled by positive feed mol, with independent conserved null-space rows. There are s coordinates and r+(s-r) equations; charge conservation follows from the neutral feed and charge-conserving reactions."
    change_note: "The feasibility objective is zero. No density, phase-amount, normalization or balance-dual coordinate is added. CppAD differentiates the same row expression for the existing Ipopt driver and exact-Jacobian polish."
    math: "y_i=\\ln(n_i/N_{\\rm ref}),\\quad N_{\\rm ref}=N_{\\rm feed},\\quad\n\\ln x_i=y_i-\\operatorname{logsumexp}_j y_j,\\qquad\nC_a=\\sum_i B_{ai}e^{y_i}-b_a/N_{\\rm ref},\\quad B\\nu=0,\\quad b=Bn^0,\n\\qquad\n\\partial_j F_r=\\nu_{jr}-\\Delta\\nu_r x_j,\\quad\n\\partial_{jk}F_r=-\\Delta\\nu_r(\\delta_{jk}x_j-x_jx_k),\\quad\n\\partial_j C_a=B_{aj}e^{y_j},\\quad\\partial_{jk}C_a=\\delta_{jk}B_{aj}e^{y_j}."
  - eqid: "implicit_second_action"
    section: "Equilibrium"
    subsection: ""
    source: "Twice differentiating F(y(theta),theta)=0 on a smooth fixed branch with nonsingular F_y"
    status: "Exact derivation"
    description: "a, b and c are independent parameter directions; subscripts on F are partial derivatives and y_a is a total directional action. The third relation uses the augmented variable z=(y,theta), tangents t_a=(y_a,a) and second variations u_ab=(y_ab,0). Along a diagonal path theta(t)=theta_0+t w the coefficients of y(t)=sum_k y_k t^k satisfy the same recurrence with the unknown coefficient set to zero; mixed actions follow by half-sign polarisation of the diagonal paths. Solve linear systems without explicitly inverting F_y."
    change_note: "Reconciled against transfer audit 2026-09-06; E5 (2026-09-16) adds the third-order relation and the coefficient recurrence that realises A1 to A3; required mathematics, not an availability claim."
    math: "F_y y_a=-F_a,\\qquad F_y y_{ab}=-\\left(F_{ab}+F_{ay}y_b+F_{yb}y_a+F_{yy}[y_a,y_b]\\right),\\qquad F_y y_{abc}=-\\left(D^3F[t_a,t_b,t_c]+D^2F[u_{ab},t_c]+D^2F[u_{ac},t_b]+D^2F[u_{bc},t_a]\\right),\\qquad F_y y_k=-[t^k]F\\bigl(y(t),\\theta(t)\\bigr)\\big|_{y_k=0}."
  - eqid: "implicit_sensitivity"
    section: "Equilibrium"
    subsection: ""
    source: "Implicit-function theorem on the KKT system"
    status: "Exact derivation"
    description: "First implicit sensitivity of F(y,theta)=0 on a smooth fixed branch with a square nonsingular row Jacobian; solve the linear system rather than forming its inverse."
    change_note: "Rows made of first energy derivatives generally need second energy derivatives here. Higher-order observables/rows require their own order; see ALG-ACTIONS."
    math: "\\frac{\\mathrm d\\boldsymbol y}{\\mathrm d\\boldsymbol\\theta}=-\\mathbf{F}_{\\boldsymbol y}^{-1}\\,\\mathbf{F}_{\\boldsymbol\\theta}."
  - eqid: "independent_feed_measurement_coordinates"
    section: "Parameter estimation"
    subsection: ""
    source: "Normalization and electroneutrality constraints in the equilibrium formulation; #510 independent species-fraction measurement chart."
    status: "Exact derivation"
    description: "Caller-named independent species fractions and dependent species preserve a fixed feed total N in mol, normalization and charge; B has identity rows for independent species."
    change_note: "Fractions are mol/mol; charges z are component charge numbers. One neutral dependent species or two dependent species with distinct charges solve the constraint block. The entire caller-declared box must map into [0,1], with fixed support; no trial normalization or input clipping is permitted."
    math: "\\mathbf x_k=\\mathbf b_k+B_k\\mathbf q_k,\\quad \\mathbf n_k=N_k\\mathbf x_k,\\quad\n\\mathbf1^TB_k=\\mathbf z^TB_k=0,\\quad \\mathbf1^T\\mathbf b_k=1,\\quad\\mathbf z^T\\mathbf b_k=0,\\qquad\n\\frac{\\partial\\mathbf n_k}{\\partial u_{kj}}=N_kB_{k,:,j}\\sigma_{q,kj}."
  - eqid: "infinite_dilution_reference"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Gross2001], A.32–A.33; [Chapman1990], Eqs. 21–24; `born_radial_charging_work`; #823 accepted design D1–D12"
    status: "Exact derivation"
    description: "Fixed-volume first insertion into the extensive residual potential at one ion-free solvent pressure root, for a pure solvent or declared neutral solvent mixture. The reference is dimensionless and uses one total log Z correction."
    change_note: "Hard chain, dispersion, association and admitted polar energy reuse their scalar owners. Association retains solvent-contact response even for a site-free ion. Born has a nonzero insertion; DH and cation pair/triple mixing have zero first insertions. Bulk permittivity and Born shell diameters must be positive, with a regular density root and association Jacobian. A net-neutral charged background is refused as IonicReferenceBackground. T/P and active-coordinate derivatives retain the implicit density/site chains. This defines no ionic-concentration Hessian. No factor of solvent molar mass enters b_i or ln(phi_i); the existing molality conversion remains separate. The retained NaCl comparisons have a case-specific 1e-9 log-fugacity criterion, not a universal error bound or physical validation."
    math: "b_i=\\left.\\partial_{n_i}\\left[\\frac{A^r}{RT}\\right]\\right|_{T,V,n_{j\\ne i},\\mathbf n=\\mathbf y_s},\\qquad\nb_i=a_s^r+\\rho_s a^r_{\\rho}+a^r_{x_i}-\\sum_s y_s a^r_{x_s},\\\\\nP(T,\\rho_s,\\mathbf y_s)=P_{src},\\qquad\n\\ell_i^\\infty=b_i-\\ln\\frac{P_{src}}{\\rho_s RT},\\qquad\nL_i^\\infty=b_i+\\ln\\frac{\\rho_s}{\\rho_0}."
  - eqid: "infinite_dilution_solvation_energy"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], infinite-dilution fugacity-to-solvation-energy relation"
    status: "Source equation"
    description: "Single-ion infinite-dilution solvation Gibbs energy on the EOS reference convention."
    change_note: "Uses the terminal reference-sequence log fugacity."
    math: "\\Delta G_{i,\\mathrm{solv}}^\\infty\n=RT\\ln\\phi_i^\\infty."
  - eqid: "interphase_potential_equality"
    section: "Equilibrium"
    subsection: ""
    source: "Consequence of chemical_potential_stationarity"
    status: "Exact derivation"
    description: "Equal chemical potential for neutral species and equal electrochemical potential for ions in two supports."
    change_note: "Not imposed a second time."
    math: "\\mu_{p,i}-\\mu_{q,i}=z_i\\,(\\varphi_p-\\varphi_q)."
  - eqid: "ion_suppressed_bulk_permittivity"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "Zuber et al. 2014 per-ion suppression coefficients (Zuber2014); [Figiel2025] is the special case with one coefficient for every ion"
    status: "Source equation"
    description: "Bulk relative permittivity of an electrolyte solution as the salt-free solvent-mixture permittivity suppressed by the ion mole fractions with per-ion coefficients."
    change_note: "One equation covers ion-specific suppression, ion-fraction suppression (all alpha equal) and solvent-only (alpha = 0); the model layer fills the coefficients."
    math: "\\varepsilon=\\frac{\\varepsilon_{\\mathrm{sf}}}{1+\\sum_i\\alpha_i x_i}."
  - eqid: "ionic_packing_diameter"
    section: "Parameter setup"
    subsection: ""
    source: "Declared ion-specific hard-chain diameter; source packets retain the originating convention"
    status: "Implementation convention"
    description: "Ionic hard-chain packing diameter, independent of Debye--Huckel and Born diameters."
    change_note: "Removes the Born-selector dependency and keeps packing, Debye--Huckel, and Born lengths independently declarable. A declared charged molecule (i in C) takes `neutral_segment_diameter` and declares no packing diameter (#641)."
    math: "d_i=d_i^{\\mathrm{pack}},\\qquad z_i\\ne0,\\ i\\notin C,\\qquad d_i^{\\mathrm{pack}}>0."
  - eqid: "ionic_strength_charge_sum"
    section: "Electrolyte dielectric and Debye--Huckel relations"
    subsection: ""
    source: "[Bulow2019], charge-weighted composition in the screening definition"
    status: "Source equation"
    description: "Mole-fraction charge-square sum entering Debye screening."
    change_note: "Only charged components contribute."
    math: "S_z=\\sum_{i\\in\\mathcal{I}}x_i z_i^2."
  - eqid: "isentropic_compressibility"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Isentropic compressibility at fixed composition."
    change_note: "Computed only on request; availability of `isothermal_compressibility` and `heat_capacity_ratio`."
    math: "\\kappa_S=-\\frac{1}{v}\\left(\\frac{\\partial v}{\\partial P}\\right)_{s,\\boldsymbol{x}}=\\kappa_T\\frac{c_v}{c_p}."
  - eqid: "isobaric_expansivity"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Isobaric expansivity at fixed composition."
    change_note: "Computed only on a derived_properties request; unavailable unless (dP/drho)_T,x is finite and positive. A positive slope does not certify phase stability."
    math: "\\alpha_P=\\frac{1}{v}\\left(\\frac{\\partial v}{\\partial T}\\right)_{P,\\boldsymbol{x}}=\\frac{P_T}{\\rho_m P_\\rho},\\qquad P_T=\\frac{P}{T}-RT\\Phi_{VT}."
  - eqid: "isothermal_compressibility"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Isothermal compressibility at fixed composition."
    change_note: "Computed only on a derived_properties request; unavailable unless (dP/drho)_T,x is finite and positive. A positive slope does not certify phase stability."
    math: "\\kappa_T=-\\frac{1}{v}\\left(\\frac{\\partial v}{\\partial P}\\right)_{T,\\boldsymbol{x}}=\\frac{1}{\\rho_m P_\\rho},\\qquad P_\\rho=\\left(\\frac{\\partial P}{\\partial\\rho_m}\\right)_{T,\\boldsymbol{x}}."
  - eqid: "joule_thomson_coefficient"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Joule-Thomson coefficient (dT/dP at constant molar enthalpy) in K/Pa; negative values are physical."
    change_note: "Computed only on request; unavailable unless total c_p is available and positive. Numerator and denominator are both molar."
    math: "\\mu_{JT}=\\left(\\frac{\\partial T}{\\partial P}\\right)_{h,\\boldsymbol{x}}=\\frac{Tv_T-v}{c_p},\\qquad v_T=\\left(\\frac{\\partial v}{\\partial T}\\right)_{P,\\boldsymbol{x}}=-\\frac{P_T}{P_v}."
  - eqid: "log_fugacity_coefficient"
    section: "Thermodynamic properties"
    subsection: ""
    source: "[Gross2001], Eq.~(A.32)"
    status: "Source equation"
    description: "Natural logarithm of the component fugacity coefficient."
    change_note: "Available only when the compressibility factor is positive."
    math: "\\ln\\phi_i=\\frac{\\mu_i^r}{RT}-\\ln Z."
  - eqid: "log_fugacity_coefficient_parameter_derivative"
    section: "Properties"
    subsection: "Pressure-closed parameter actions"
    source: "Implicit differentiation of `pressure`, `compressibility_factor` and `log_fugacity_coefficient`; extensive residual Helmholtz Hessian including implicit association."
    status: "Exact derivation"
    description: "First physical-parameter columns at fixed temperature, pressure and component amounts."
    change_note: "Requires positive finite pressure-density slope. Parameters use their native units; the volume is m³ for the declared amounts. Numerical qualification belongs to the electrolyte parameter-gradient analysis."
    math: "V_a=-\\frac{\\phi_{Va}}{n/V^2+\\phi_{VV}},\\qquad\n g_{i,a}=\\phi_{ia}+\\left(\\phi_{iV}-\\frac1V\\right)V_a,\n\\quad \\phi=A^r/(RT),\\quad g_i=\\ln\\varphi_i."
  - eqid: "log_fugacity_density_derivative"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivative of Eqs.~`residual_chemical_potential` and `log_fugacity_coefficient`"
    status: "Documentation-only"
    description: "Density derivative of log fugacity used by active fixed-pressure observations."
    change_note: "Independent density-coordinate identity for checking the generic extensive-coordinate Hessian."
    math: "\\begin{aligned}\n\\left(\\ln\\phi_i\\right)_\\rho\n&=\\left(\\frac{\\mu_i^r}{RT}\\right)_\\rho-\\frac{Z_\\rho}{Z},\\\\\n\\left(\\frac{\\mu_i^r}{RT}\\right)_\\rho\n&=2a_\\rho+\\rho_ma_{\\rho\\rho}\n+a_{x_i\\rho}-\\sum_jx_ja_{x_j\\rho}.\n\\end{aligned}"
  - eqid: "material_balance"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eq. 1 (without reactions) and Eq. 3"
    status: "Source equation"
    description: "Conserved-moiety balance over the phases, each weighted by its amount; B is the identity when no reaction is declared."
    change_note: "Rank of B is the number of balance rows."
    math: "\\sum_p N_p\\,\\mathbf{B}\\,\\mathbf{x}_p=\\mathbf{B}\\,\\mathbf{n}_{\\mathrm{feed}}."
  - eqid: "mdea_reaction_conserved_amounts"
    section: "Equilibrium"
    subsection: "Reaction inventories"
    source: "Null space of Nasrifar and Tafazzol (2010), Eqs. (1)-(6), p.7621; hydronium stoichiometry"
    status: "Exact derivation"
    description: "Physical inventory checks for the caller-declared aqueous MDEA/CO2/H2S example. The Engine computes a general null-space basis, independent of these example species names."
    change_note: "Water equivalent includes hydronium. The paper's printed Eq. (12) omits it and does not conserve R1; these conserved equations do not reproduce that printed balance."
    math: "W=n_w+n_{OH^-}+n_{H_3O^+}+n_{HCO_3^-}+n_{CO_3^{2-}},\\quad\nM=n_{MDEA}+n_{MDEAH^+},\\quad C=n_{CO_2}+n_{HCO_3^-}+n_{CO_3^{2-}},\\quad\nS=n_{H_2S}+n_{HS^-}+n_{S^{2-}},\\quad\nZ=n_{H_3O^+}+n_{MDEAH^+}-n_{OH^-}-n_{HCO_3^-}-2n_{CO_3^{2-}}-n_{HS^-}-2n_{S^{2-}}."
  - eqid: "mean_ionic_activity_coefficient"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], stoichiometric mean ionic activity definition"
    status: "Source equation"
    description: "Stoichiometric mean ionic activity coefficient on the mole-fraction basis."
    change_note: "Supports the one-formula-unit cation/anion topology."
    math: "\\ln\\gamma_\\pm^{(x)}\n=\\frac{\\nu_+\\ln\\gamma_+^{(x)}+\\nu_-\\ln\\gamma_-^{(x)}}\n{\\nu_++\\nu_-}."
  - eqid: "mean_segment_count"
    section: "Density and packing"
    subsection: ""
    source: "[Gross2001], Appendix A mixture definition"
    status: "Source equation"
    description: "Composition-averaged segment count."
    change_note: "Reconciled to the current residual Helmholtz owner."
    math: "\\overline{m}=\\sum_i x_i m_i."
  - eqid: "mechanical_stability"
    section: "Density closure and mechanical domain"
    subsection: ""
    source: "Standard isothermal mechanical-stability criterion"
    status: "Source equation"
    description: "Positive isothermal pressure slope required for a stable density root."
    change_note: "Finite positive slope defines local mechanical stability; numerical conditioning is recorded separately."
    math: "\\left(\\frac{\\partial P}{\\partial\\rho_m}\\right)_{T,\\boldsymbol{x}}\n=P_\\rho>0."
  - eqid: "michelsen_modified_tangent_plane"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "[Michelsen1982] Part I Eqs. 13–19 and 25–27; T,P Jacobian derived for #647 from the IsothermalPhaseHessian columns"
    status: "Source equation"
    description: "Michelsen's modified tangent-plane objective g* over positive trial mole numbers W on support S, at fixed T/P and the frozen shift s = standard − plane of `tangent_plane_distance`; w = W/ΣW and v is the trial label's density-owner molar volume (m³/mol). ψᵢ = Fᵢ − ln v = ln φᵢ + ln(P/RT), with F the residual reduced Helmholtz energy at unit amount (Fᵢ dimensionless, F_iV in m⁻³, F_VV in mol m⁻⁶, and Fᵢⱼ in mol⁻¹, using SI derivative columns). Jᵢⱼ = n ∂ln φᵢ/∂nⱼ at fixed T,P is dimensionless and symmetric with Σᵢ wᵢJᵢⱼ = 0."
    change_note: "All-neutral, non-reacting systems only (#647). A stationary point has tpd = k = −ln ΣW; the shared tail reevaluates tpd and keeps every acceptance check."
    math: "\\begin{aligned}\ng^*(\\mathbf W)&=1+\\sum_{i\\in S}W_i\\left(\\ln W_i+\\psi_i(\\mathbf w)+s_i-1\\right),\\qquad\n\\frac{\\partial g^*}{\\partial W_i}=g_i=\\ln W_i+\\psi_i+s_i,\\\\\n\\ln W_i^{(k+1)}&=-s_i-\\psi_i^{(k)}\\quad\\text{(Eq. 19)},\\qquad\n\\alpha_i=2\\sqrt{W_i},\\qquad\nH_{ij}=\\delta_{ij}+\\frac{\\sqrt{W_iW_j}}{\\sum_l W_l}J_{ij}+\\tfrac12\\delta_{ij}g_i\\quad\\text{(Eqs. 25–27)},\\\\\nJ_{ij}&=F_{ij}+1+\\frac{p_ip_j}{p_V},\\qquad p_i=\\frac1v-F_{iV},\\qquad p_V=-F_{VV}-\\frac1{v^2}.\n\\end{aligned}"
  - eqid: "modified_fraction_chart"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] composition chart extended to charged species per Perdomo et al. 2025 (Perdomo2025) Section 3"
    status: "Exact derivation"
    description: "Modified mole fractions of a charged phase after eliminating one ion by electroneutrality; the modified fractions sum to one and the eliminated ion is reconstructed from the retained ones."
    change_note: "Valid only where each retained factor is nonzero and the reconstructed composition is admissible. Other supports require another regular charge chart; no installed search is implied."
    math: "\\tilde{x}_i = f_i\\,x_i,\\qquad f_i = 1 - \\frac{q_i}{q_e}\\ (i \\neq e),\\qquad \\sum_{i \\neq e}\\tilde{x}_i = 1,\\qquad x_e = -\\frac{1}{q_e}\\sum_{i \\neq e} q_i x_i,\\qquad x_i = \\frac{\\tilde{x}_i}{f_i}."
  - eqid: "molality_activity_conversion"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[Figiel2025], mole-fraction to molality activity conversion"
    status: "Source equation"
    description: "Convert the mean ionic coefficient to formula-unit molality; define total solute-species molality for a single solvent."
    change_note: "Uses solvent molar mass in kilograms per mole. Each occupied non-solvent molecular or ionic species contributes once to q."
    math: "\\gamma_\\pm^{(m)}=\n\\frac{\\gamma_\\pm^{(x)}}\n{1+M_s q},\\qquad q=m(\\nu_++\\nu_-)\\ \\text{for one binary salt}.\n\\qquad m_i=\\frac{x_i}{x_s M_s},\\quad q=\\sum_{i\\ne s}m_i,\\quad D=M_s q."
  - eqid: "multiplier_potential_link"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eq. 7 in the modified chart of Perdomo et al. 2025 (Perdomo2025)"
    status: "Exact derivation"
    description: "Dimensional modified chemical potentials in J/mol are conjugate to modified fractions. Dimensionless dual multiplier alpha is their difference divided by RT; d is the dependent normalized coordinate."
    change_note: "The regular chart and admissible composition are required. Dual multipliers are distinct from dimensional balance/charge multipliers and numerical optimizer multipliers."
    math: "\\tilde\\mu_i=\\frac{\\mu_i-(z_i/z_e)\\mu_e}{f_i},\\qquad \\sum_{i\\ne e}\\tilde\\mu_i\\tilde x_i=\\sum_i\\mu_i x_i,\\qquad \\alpha_k=\\frac{\\tilde\\mu_k-\\tilde\\mu_d}{RT}."
  - eqid: "neutral_reaction_reference_pressure_jet"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Implicit differentiation of the pressure closure and the neutral reaction reference contraction at fixed temperature and composition"
    status: "Exact derivation"
    description: "First and second source-pressure derivatives of the analytic solvent-limit contraction. The extensive regular residual potential is psi=Ares/(RT), at N=1 mol and V=1/rho_s; its single ionic insertion includes Born and the zero Debye–Hückel limit. DeltaNu is the stoichiometric mole change."
    change_note: "Derivatives follow the same regular positive-slope density branch as the value. A reference at fixed source pressure has zero derivatives with respect to system pressure. E2 and E3 provide the displayed single-state partials; for mixed references, sum the masked dilution contribution and each selected pure-state contribution through `reference_single_insertion_taylor`. No runtime finite differences are used. Higher source-pressure derivatives are supplied by `reference_mixed_temperature_pressure_derivatives` in Properties; downstream use is separately qualified. The first temperature and parameter derivatives are `standard_state_transfer_temperature_derivative` and `standard_state_transfer_parameter_derivative`, and the mixed temperature-pressure derivative is `standard_state_transfer_temperature_pressure_derivative`."
    math: "C=-\\Delta\\nu\\ln(V\\rho_0)+\\sum_i\\nu_i\\psi_{n_i},\\qquad\np_V=RT(-V^{-2}-\\psi_{VV}),\\quad p_{VV}=RT(2V^{-3}-\\psi_{VVV}),\\\\\nC_V=-\\Delta\\nu/V+\\sum_i\\nu_i\\psi_{n_iV},\\qquad\nC_{VV}=\\Delta\\nu/V^2+\\sum_i\\nu_i\\psi_{n_iVV},\\\\\nC_P=\\frac{C_V}{p_V},\\qquad\nC_{PP}=\\frac{C_{VV}}{p_V^2}-\\frac{C_Vp_{VV}}{p_V^3},\\qquad\ng_P=-RT C_P,\\quad g_{PP}=-RT C_{PP}."
  - eqid: "neutral_reaction_reference_transfer"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Chemical-potential equality on the density standard and the dilute molality-to-mole-fraction identity"
    status: "Exact derivation"
    description: "Charge-neutral reaction contraction with a declared neutral solvent and optional per-species pure-liquid, pure-vapor or infinite-dilution references. Products have positive stoichiometry; solvent molar mass is in kg/mol and the molality standard in mol/kg. The source basis is explicit."
    change_note: "The solvent standard uses the exact ion-free liquid state. Pure overrides require neutral species and a positive-slope root on the declared side of the pure isotherm's mechanical loop; a single root with no sampled loop serves either branch. Infinite-dilution species use `infinite_dilution_reference` at the same source pressure. Every returned T/P/parameter column differentiates that reference, with independent numerical availability. Nondefault mixed common-molality declarations are refused. Uyan (2015), Eqs. 22–23, specify pure water and solute infinite dilution; the historical CO2 vapor selection at e12a5ff8 is not an unambiguous paper attribution (#274). Per-species activities use raw mole fractions; uniform common molality retains A_r. Declarations are fixed under system composition actions. Fixed-source system-pressure derivatives are exact zeros. Ionic references qualify charge-neutral contractions, without an absolute single-ion standard."
    math: "\\Lambda_i^\\rho=\\ln(\\rho/\\rho_0)+\\mu_i^{res}/(RT)\n=\\ln\\phi_i+\\ln(P/(RT\\rho_0)),\\quad\nL_i^{b_i}=\\begin{cases}\n\\Lambda_i^\\rho(T,P_{src},\\mathbf e_i;\\mathrm{liquid}),&b_i=\\mathrm{pure\\ liquid},\\\\\n\\Lambda_i^\\rho(T,P_{src},\\mathbf e_i;\\mathrm{vapor}),&b_i=\\mathrm{pure\\ gas},\\\\\n\\lim_{m\\to0}\\Lambda_i^\\rho(T,P_{src},\\mathbf x^s(m);\\mathrm{liquid}),&b_i=\\mathrm{infinite\\ dilution},\n\\end{cases}\\\\\n\\mu_i^{\\circ,b}=g_i^\\rho+RT L_i^{b_i},\\qquad\n\\ln a_i^b=\\ln x_i+\\Lambda_i^\\rho-L_i^{b_i},\\qquad\nC_r^b=\\sum_i\\nu_{ri}L_i^{b_i},\\quad \\sum_i\\nu_{ri}z_i=0,\\\\\n\\delta_i=L_i^{c_i}-L_i^{b_i},\\qquad\n\\ln K_{c,r}=\\ln K_{b,r}-\\sum_i\\nu_{ri}\\delta_i,\\qquad\n\\ln K_{c,r}+C_r^c=\\ln K_{b,r}+C_r^b,\\\\\nA_r=\\left(\\sum_{i\\ne s}\\nu_{ri}\\right)\\ln(M_s m^\\circ),\\qquad\n\\ln K_{\\rho,r}=\\begin{cases}\n\\ln K_{m,r}+A_r+C_r^b,&\\text{common molality source},\\\\\n\\ln K_{x,r}+C_r^b,&\\text{raw mole-fraction source},\n\\end{cases}\\\\\nn_s=1/M_s,\\quad n_i=m r_i\\ (i\\ne s),\\quad \\sum_i z_i r_i=0,\\quad\n\\mathbf x^s(0)=\\mathbf e_s,\\\\\n\\left.\\partial_T L_i\\right|_{P_{src}}=-\\frac{h_i^{res}+RT}{RT^2},\\qquad \\partial_{P_{src}}L_i=\\frac{v_i}{RT}\\quad\\text{(pure neutral species)},\\\\\nL_i-\\ln[P_{src}/(RT\\rho_0)]\\to0,\\quad T L_{i,T}+1\\to0,\\quad P_{src}L_{i,P}-1\\to0\\quad(P_{src}\\to0,\\mathrm{pure\\ gas}),\\\\\nC_r^{(k)}=C_r(m_k),\\quad m_k\\in\\{10^{-10},10^{-12},10^{-14}\\}\\ \\text{(rung calculations)},\\\\\n\\widehat C_r=\\frac{10\\,C_r(10^{-14})-C_r(10^{-12})}{9},\\qquad\n\\widehat C_r^{-}=\\frac{10\\,C_r(10^{-12})-C_r(10^{-10})}{9},\\qquad\n|\\widehat C_r-\\widehat C_r^{-}|\\le 5\\times10^{-5},\\\\\nD=\\partial_T^a\\partial_{P_{src}}^b\\partial_\\theta^p C_r(T,P_{src};\\mathbf x^s(0))."
  - eqid: "neutral_reference_stoichiometric_basis"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact charge-neutral basis from explicit stoichiometric declarations"
    status: "Exact derivation"
    description: "Native standard-reference rows and log-fugacity contractions."
    change_note: "Neutral-component unit rows and a spanning set of cation-anion formula rows are immutable for a resolved model."
    math: "\\boldsymbol{b}^{(s)}=\\boldsymbol{e}_s,\n\\qquad\n\\boldsymbol{b}^{(+-)}=\\nu_+\\boldsymbol{e}_+\n+\\nu_-\\boldsymbol{e}_-,\n\\qquad\nc_r=\\sum_i b_i^{(r)}\\ln\\phi_i^{\\mathrm{ref}},\n\\qquad\n\\ln\\phi_i^{\\mathrm{ref}}=\n\\begin{cases}\n\\ln\\phi_i(\\boldsymbol{x}_{\\mathrm{neutral}}), & z_i=0,\\\\\n\\ln\\phi_i^\\infty, & z_i\\ne 0.\n\\end{cases}"
  - eqid: "neutral_segment_diameter"
    section: "Parameter setup"
    subsection: ""
    source: "[Gross2001], Eq.~(A.9); for i in C, [Held2014] Eqs.~(21)--(22) and the text after them, [Uyan2015] Eqs.~(10)--(11)"
    status: "Source equation"
    description: "Temperature-dependent hard-chain diameter for neutral components and declared charged molecules."
    change_note: "Reconciled to the current neutral diameter branch. #641: C is the set of ions declaring `fixed.charged_molecule_ion`. Held2014 and Uyan2015 obtain the fixed ion diameter 0.88 sigma from this equation with the like-ion dispersion energy set to zero; an ion that keeps its own like-pair well depth takes this equation with its own u_i (an inference from that derivation; the sources state only the zero-dispersion direction). Its u_i derivative is `packing_coefficient_parameter_derivative`'s neutral rule."
    math: "d_i(T)=\\sigma_i(T)\\left[1-0.12\\exp\\left(-\\frac{3(\\epsilon_i/k_B)}{T}\\right)\\right],\n\\qquad z_i=0\\ \\text{or}\\ i\\in C."
  - eqid: "normalized_trial_reaction_affinity"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "tangent_plane_trial_balance contracted with charge-conserving Bν=0; #223 adopted derivation"
    status: "Exact derivation"
    description: "Normalized stationary trial affinity for a mole-changing reaction, products positive; μ_mech/RT+s is the total reduced chemical potential. The trial's normalized reaction direction differs from the amount-space reaction vector."
    change_note: "π annihilates ν in amount space, not generally its normalized direction. The added full declaration restores original zero-affinity rows; the search trial need not have zero affinity."
    math: "\\mathbf B\\boldsymbol\\nu=0,\\quad \\mathbf z^{\\mathsf T}\\boldsymbol\\nu=0\n\\ \\Longrightarrow\\\n\\boldsymbol\\nu^{\\mathsf T}\\left(\\frac{\\boldsymbol\\mu_{\\mathrm{mech}}}{RT}+\\mathbf s\\right)\n=k\\,\\mathbf e^{\\mathsf T}\\boldsymbol\\nu,\\qquad\n\\mathbf d_w=\\boldsymbol\\nu-\\mathbf w\\,\\mathbf e^{\\mathsf T}\\boldsymbol\\nu."
  - eqid: "one_component_two_density"
    section: "Equilibrium"
    subsection: ""
    source: "[Gross2001], Eqs. (A.23), (A.33); pressure, pressure_density_derivative, residual_chemical_potential and phase_helmholtz_amount_volume."
    status: "Exact derivation"
    description: "One neutral component at fixed T, with distinct positive densities rho_L > rho_V and positive mechanical slopes; the common standard term cancels and is restored in the full chemical multiplier."
    change_note: "#854 analytically eliminates normalized compositions, feed amount, pressure and the common multiplier; full defining rows remain for admission and actions. E is A^r/(RT); v is V/n; the series uses unit amount. ALG-EQUILIBRIUM owns iteration and conditioning."
    math: "u_p=\\ln(\\rho_p/\\rho_0),\\quad r=e^{u_V-u_L},\\quad\nM_p=u_p+a_p^r+Z_p-1,\\quad K_p=P_{\\rho,p}/(RT),\n\\qquad F_P=\\frac{P_L-P_V}{RT\\rho_L}=Z_L-rZ_V,\\quad F_\\mu=M_L-M_V,\n\\\\\nJ=\\begin{pmatrix}K_L-F_P&-rK_V\\\\K_L&-K_V\\end{pmatrix},\\qquad\n\\det J\\big|_{F=0}=-(1-r)K_LK_V,\n\\\\\nE(v+t)=c_0+c_1t+c_2t^2+\\cdots,\\quad\nP=RT(\\rho-c_1),\\quad M=u+c_0-vc_1,\\quad K=1+2c_2/\\rho^2,\n\\\\\nE_n=(E-VE_V)/n,\\quad E_{Vn}=-VE_{VV}/n,\\quad E_{nn}=V^2E_{VV}/n^2."
  - eqid: "outer_approximation_bound"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] problem OP; [Pereira2012] Section 2 after Mitsos and Barton 2007 (MitsosBarton2007)"
    status: "Source equation"
    description: "Finite outer approximation of the semi-infinite dual: maximize a scalar bounded by every retained cut and by the feed free energy; the optimum is an upper bound on the dual value and its multipliers drive the next inner problem."
    change_note: "Solved as a linear program over the retained set M; the feed cut has zero slope."
    math: "\\mathrm{UBD} = \\max_{v,\\boldsymbol\\alpha}\\ v\\quad \\text{s.t.}\\quad v \\le g(\\tilde{\\boldsymbol x}^{m}, v^{m}) + \\boldsymbol\\alpha\\cdot(\\tilde{\\boldsymbol x}^{0} - \\tilde{\\boldsymbol x}^{m})\\ \\ \\forall m \\in \\mathcal M,\\qquad v \\le g(\\tilde{\\boldsymbol x}^{0}, v^{0})."
  - eqid: "packing_coefficient_parameter_derivative"
    section: "Native phase coordinates"
    subsection: ""
    source: "Chain rule through the packing-fraction coordinate map; the packing fraction definition and the temperature-dependent segment diameter are registered under packing_fraction and the hard-sphere diameter entries"
    status: "Exact derivation"
    description: "At fixed T, packing fraction and composition, differentiate c=(pi/6) N sum_i x_i m_i d_i cubed, where N=N_p N_A 10^-30 for phase amount N_p in mol and diameters in angstrom; c has cubic-metre units. The displayed partials specialize the neutral Gross diameter rule."
    change_note: "For other diameter correlations or active coefficients differentiate their defining equation as well; these partials do not establish universal zero derivatives for additional families."
    math: "\\frac{\\partial c}{\\partial m_i}=\\frac{\\pi}{6}N x_i d_i^{3},\\qquad \\frac{\\partial c}{\\partial \\sigma_i}=\\frac{\\pi}{6}N x_i m_i\\,3d_i^{2}\\frac{d_i}{\\sigma_i},\\qquad \\frac{\\partial c}{\\partial(\\varepsilon_i/k)}=\\frac{\\pi}{6}N x_i m_i\\,3d_i^{2}\\,\\sigma_i\\frac{0.36}{T}e^{-3\\varepsilon_i/(kT)},\\qquad \\left.\\frac{\\partial v_p}{\\partial\\theta_k}\\right|_{T,\\eta_p,x_p}=\\frac{1}{\\eta_p}\\frac{\\partial c}{\\partial\\theta_k}"
  - eqid: "packing_fraction"
    section: "Density and packing"
    subsection: ""
    source: "[Gross2001], Eq.~(A.8) at n=3"
    status: "Source equation"
    description: "Packing fraction from molar density and segment geometry."
    change_note: "Shared by Helmholtz evaluation and EOS domain owners."
    math: "\\eta=\\zeta_3\n=\\frac{\\pi}{6}\\rho_mN_A10^{-30}\\sum_i x_i m_i d_i^3."
  - eqid: "packing_fraction_coefficient"
    section: "Density and packing"
    subsection: ""
    source: "Exact specialization of Eq.~`packing_fraction`"
    status: "Exact derivation"
    description: "Composition and temperature coefficient satisfying eta=rho_m c_eta."
    change_note: "Mirrors the value-only volume-domain helper."
    math: "c_\\eta(T,\\boldsymbol{x})=\n\\frac{\\pi}{6}N_A10^{-30}\\sum_i x_i m_i d_i(T)^3,\n\\qquad \\eta=\\rho_m c_\\eta."
  - eqid: "packing_moments"
    section: "Density and packing"
    subsection: ""
    source: "[Gross2001], Eq.~(A.8)"
    status: "Source equation"
    description: "Segment-density moments used by hard-chain and association terms."
    change_note: "Uses the current angstrom number-density basis."
    math: "\\zeta_n=\\frac{\\pi}{6}\\widehat{\\rho}\\sum_i x_i m_i d_i^n,\n\\qquad n=0,1,2,3."
  - eqid: "packing_volume_bounds"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact inversion of eta=c_eta/V_m"
    status: "Exact derivation"
    description: "Molar-volume interval corresponding to caller-owned packing-fraction limits."
    change_note: "The EOS owns c_eta while the caller owns eta_min and eta_max."
    math: "V_{m,\\min}=\\frac{c_\\eta(T,\\boldsymbol{x})}{\\eta_{\\max}},\n\\qquad\nV_{m,\\max}=\\frac{c_\\eta(T,\\boldsymbol{x})}{\\eta_{\\min}}."
  - eqid: "pair_parameter_temperature_law"
    section: "Parameter setup"
    subsection: ""
    source: "[Held2014], Tables 1--2; [Uyan2015], Eqs.~(26)--(27); [Bulow2021MDEA], Eq.~(26)"
    status: "Implementation convention"
    description: "One declared temperature law for k_ij, l_ij, explicit association energy over k_B or volume, or a combining-rule volume correction; the family covers the cited affine, quadratic and cubic laws and the existing reciprocal-temperature term."
    change_note: "Coefficients are active slots; T_r and the term powers are fixed declarations (#567). Undeclared k_ij keeps `cross_dispersion_energy`'s constant and reciprocal-slope arithmetic."
    math: "q(T)=\\sum_{p=0}^{3}a_p\\,(T-T_r)^p+s\\left(\\frac1T-\\frac1{T_r}\\right),\\qquad T,\\ T_r>0."
  - eqid: "partial_molar_enthalpy"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Partial molar enthalpy of component i at fixed T and P on the supplied ideal thermochemistry basis."
    change_note: "Computed only on request; availability of `partial_molar_volume` plus Available thermochemistry for the whole record. Component h_i^o comes from the existing interval selection and correlation owner at the record's standard pressure P^o. d_i is the fixed-P, fixed-x temperature derivative of ln phi_i. The x-weighted sum equals the total molar enthalpy."
    math: "\\bar h_i=h_i^\\circ-RT^2d_i,\\qquad d_i=\\Phi_{n_iT}+\\Phi_{n_iV}v_T+\\frac{1}{T}-\\frac{v_T}{v}."
  - eqid: "partial_molar_entropy"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Partial molar entropy of component i at fixed T and P on the supplied ideal thermochemistry basis."
    change_note: "Availability of `partial_molar_enthalpy`, and unavailable at x_i = 0, where ln x_i diverges. It keeps the same-density residual entropy of State; the x-weighted sum equals the total molar entropy."
    math: "\\bar s_i=s_i^\\circ-RL_i-RTd_i,\\qquad L_i=\\ln\\frac{x_i\\rho_mRT}{P^\\circ}+\\Phi_{n_i}."
  - eqid: "partial_molar_volume"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivation from `pressure`, `residual_chemical_potential` and the T/V Hessian columns of State; #566 design"
    status: "Exact derivation"
    description: "Partial molar volume of component i at fixed T and P, the amount derivative of extensive volume, evaluated at N = 1 mol."
    change_note: "Computed only on request, in component order; unavailable for an IonicInsertion component or a nonpositive slope. A zero-fraction neutral species gives its finite insertion limit. For present ions only electroneutral combinations carry a physical claim."
    math: "\\bar v_i=-\\frac{P_{n_i}}{P_V},\\qquad P_{n_i}=RT\\left(\\frac{1}{V}-\\Phi_{Vn_i}\\right),\\qquad P_V=-RT\\left(\\frac{1}{V^2}+\\Phi_{VV}\\right)."
  - eqid: "phase_dimensionless_helmholtz"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact ideal-mixing plus residual Helmholtz construction"
    status: "Exact derivation"
    description: "Dimensionless mechanical phase energy. Reference offsets are omitted only for mechanical/nonreactive differences where they cancel; reactive and total caloric calculations require the declared total phase energy."
    change_note: "n_ref=1 mol and rho_ref=rho0=1 mol per cubic metre. Phi in mechanical derivative entries denotes this mechanical function."
    math: "\\Phi_{\\mathrm{mech}}\\equiv\\frac{A_{\\mathrm{mech}}}{RTn_{\\mathrm{ref}}}=\\sum_i\\frac{n_i}{n_{\\mathrm{ref}}}\\left[\\ln\\frac{n_i/V}{\\rho_0}-1\\right]+\\frac{n}{n_{\\mathrm{ref}}}a^r(T,\\rho_m,\\boldsymbol x)."
  - eqid: "phase_electroneutrality"
    section: "Equilibrium"
    subsection: ""
    source: "[Ascani2022] Eq. 5; Tsanas et al. 2019 Section 2.2.1 and 2022 Section 2.4 (Tsanas2019, Tsanas2022)"
    status: "Source equation"
    description: "Per-phase electroneutrality for every ion-containing phase except one phase of nonzero amount; the omitted phase's neutrality follows from the balance rows and a neutral feed."
    change_note: "One row fewer than the ion-containing phases; if every ion-containing phase is pinned at zero amount, all carry the row."
    math: "\\mathbf{z}\\cdot\\mathbf{x}_p=0\\quad\\text{for all ion-containing }p\\text{ except one of nonzero amount}."
  - eqid: "phase_helmholtz_amount_volume"
    section: "Equilibrium"
    subsection: ""
    source: "[Gross2001] Appendix A with the ideal-gas mixing term"
    status: "Exact derivation"
    description: "Mechanical phase energy contains ideal density/mixing and residual terms; total phase energy additionally contains the molar reference offset defined by ideal_gas_helmholtz."
    change_note: "N_p is mol, V_p is cubic metres, rho0 is the fixed reference molar density. Missing reference thermochemistry does not define total calorics."
    math: "\\frac{A_{p,\\mathrm{mech}}}{RT}=\\sum_i n_{p,i}\\left[\\ln\\frac{n_{p,i}}{V_p\\rho_0}-1\\right]+N_p a^r\\left(T,\\frac{N_p}{V_p},\\frac{\\boldsymbol n_p}{N_p}\\right),\\qquad A_{p,\\mathrm{total}}=A_{p,\\mathrm{mech}}+N_p a^{\\circ}_{\\mathrm{ref}}."
  - eqid: "phase_molar_density"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact extensive-to-intensive coordinate transformation"
    status: "Exact derivation"
    description: "Phase molar density from total amount and extensive volume."
    change_note: "Uses SI mole and cubic-metre coordinates."
    math: "\\rho_m=\\frac{n}{V}."
  - eqid: "phase_mole_fraction"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact extensive-to-intensive coordinate transformation"
    status: "Exact derivation"
    description: "Phase mole fractions from explicit component amounts."
    change_note: "Requires positive total amount n and nonnegative component amounts. Positive individual amounts are required only for their logarithmic interior coordinates; insertion derivatives have separate domains."
    math: "x_i=\\frac{n_i}{n}."
  - eqid: "phase_normalization"
    section: "Equilibrium"
    subsection: ""
    source: "Composition closure of every declared phase"
    status: "Implementation convention"
    description: "Composition normalisation of every phase, free or pinned, so that the coordinates (N_p, x_p, V_p) are uniform and a pin removes exactly one variable."
    change_note: "Replaces incipient_normalization, which named a row that is now universal."
    math: "\\sum_{i\\in S_p}x_{p,i}=1\\quad\\text{for every phase }p."
  - eqid: "phase_packing_fraction"
    section: "Density and packing"
    subsection: ""
    source: "Exact extensive-coordinate form of Eq.~`packing_fraction`"
    status: "Exact derivation"
    description: "Packing fraction in explicit component amounts and extensive volume."
    change_note: "Mirrors the native phase-domain derivative owner."
    math: "\\eta(T,\\boldsymbol{n},V)=\n\\frac{\\pi}{6}\\frac{N_A10^{-30}}{V}\\sum_i n_i m_i d_i(T)^3."
  - eqid: "phase_packing_volume"
    section: "Equilibrium"
    subsection: ""
    source: "Packing-fraction definition, [Gross2001] Eq. (A.8)"
    status: "Exact derivation"
    description: "Phase volume in cubic metres from amounts in mol, diameters in angstrom and dimensionless packing fraction."
    change_note: "Includes molecule-per-mol and cubic-angstrom-to-cubic-metre conversion; matches phase_packing_fraction."
    math: "V_p=\\frac{\\pi N_A10^{-30}}{6\\eta_p}\\sum_i n_{p,i}m_i d_i^3."
  - eqid: "phase_pressure"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact extensive Helmholtz derivative"
    status: "Exact derivation"
    description: "Phase pressure from the volume gradient of the dimensionless phase Helmholtz function."
    change_note: "Returned on the original pascal scale."
    math: "P=-RTn_{\\mathrm{ref}}\n\\left(\\frac{\\partial\\Phi}{\\partial V}\\right)_{T,\\boldsymbol{n}}."
  - eqid: "phase_support"
    section: "Equilibrium"
    subsection: ""
    source: "Declared phase support; structural, no source equation"
    status: "Implementation convention"
    description: "A species outside a phase's declared support has zero amount in that phase; the coordinate is removed, not bounded."
    change_note: "Structural row: it removes a variable rather than adding an equation, so it carries no multiplier and does not enter the count rule."
    math: "n_{p,i}=0\\quad\\text{for }i\\notin S_p\\ \\text{(the variable is absent)}."
  - eqid: "phase_total_amount"
    section: "Native phase coordinates"
    subsection: ""
    source: "Exact extensive-coordinate definition"
    status: "Exact derivation"
    description: "Total phase amount from explicit component amounts."
    change_note: "Shared by neutral and electrolyte phase blocks."
    math: "n=\\sum_i n_i."
  - eqid: "practical_osmotic_coefficient"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "[HamerWu1972], practical molal osmotic-coefficient definition; common-pressure identity from Eqs.~`log_fugacity_coefficient` and `pressure`"
    status: "Source equation"
    description: "Dimensionless practical molal osmotic coefficient from pure-solvent-referenced solvent activity."
    change_note: "One neutral solvent, evaluated at common prescribed T/P with the same parameters and permittivity model. The scalar residual chemical-potential difference uses the extensive Helmholtz Euler identity in extended precision, with Z=P/(RT rho). Subscripts f and p denote the finite solution and pure solvent, a^r is per mole, and the sum traverses occupied non-solvent species. For one salt, q=(nu_++nu_-)m. At q=0 activity is exactly one and Phi is undefined; below the total-species molality floor Phi is unavailable. The one-salt helper also retains its formula-molality floor. Liquid-side regularity is required; this does not establish global phase stability."
    math: "\\Phi=\n-\\frac{\\ln a_s}\n{M_s q},\n\\qquad\n\\ln a_s=\\ln x_s+\\ln\\phi_s-\\ln\\phi_s^{\\mathrm{pure}}\n=\\ln x_s+\\frac{\\mu_s^r-\\mu_s^{r,\\mathrm{pure}}}{RT}\n+\\ln\\frac{\\rho_m}{\\rho_m^{\\mathrm{pure}}}.\n\\qquad\n\\Delta\\mu_s^r/(RT)=\n\\frac{a_f^r-a_p^r+\\frac{P}{RT}(\\rho_f^{-1}-\\rho_p^{-1})\n-\\sum_{i\\ne s}x_i[\\mu_i^{r,f}/(RT)-\\mu_s^{r,p}/(RT)]}{x_s}."
  - eqid: "present_phase_tangent_plane_identity"
    section: "Equilibrium"
    subsection: "Tangent-plane testing"
    source: "Euler homogeneity of phase_helmholtz_amount_volume with chemical and pressure rows; #223 adopted derivation"
    status: "Exact derivation"
    description: "Full present-phase identity on normalized compositions. a_V,p is the SI molar-volume column of residual reduced Helmholtz energy at unit amount; pressure-row error cannot be omitted. μ_mech contains ideal-density and residual chemical potentials without s."
    change_note: "The charge term is retained until charge-neutral admission; approximate chemical equality alone does not force zero TPD."
    math: "\\begin{aligned}\nr_{p,i}&=\\frac{\\mu_{\\mathrm{mech},p,i}}{RT}+s_i-\\pi_i-z_i\\varphi_p,\\qquad\nr_{Pp}=v_p\\left(\\frac{1}{v_p}-a_{V,p}-\\frac{P}{RT}\\right),\\\\\nt(\\mathbf x_p,v_p)&=\\mathbf x_p^{\\mathsf T}\\mathbf r_p\n+\\varphi_p\\mathbf z^{\\mathsf T}\\mathbf x_p-r_{Pp}.\n\\end{aligned}"
  - eqid: "pressure"
    section: "Thermodynamic properties"
    subsection: ""
    source: "[Gross2001], Eq.~(A.23)"
    status: "Source equation"
    description: "EOS pressure from compressibility factor."
    change_note: "Returns pressure in pascals on the SI molar-density basis."
    math: "P=\\rho_mRTZ."
  - eqid: "pressure_density_derivative"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Exact derivative of Eq.~`pressure`"
    status: "Exact derivation"
    description: "Isothermal pressure derivative used by density closure and stability checks."
    change_note: "Transforms CppAD density partials without expanding the EOS derivative."
    math: "\\left(\\frac{\\partial P}{\\partial\\rho_m}\\right)_{T,\\boldsymbol{x}}\n=RT\\left(Z+\\rho_mZ_\\rho\\right),\n\\qquad\nZ_\\rho=a_\\rho+\\rho_ma_{\\rho\\rho}."
  - eqid: "pressure_equality"
    section: "Equilibrium"
    subsection: ""
    source: "[Pereira2012] Eq. 8; [Gross2001] Eq. (A.23)"
    status: "Source equation"
    description: "Stationarity in phase volume: every EOS phase is at the system pressure."
    change_note: "A stationarity row of the same minimization."
    math: "-\\frac{\\partial A_p}{\\partial V_p}=P."
  - eqid: "pressure_state_hessian"
    section: "Thermodynamic properties"
    subsection: ""
    source: "Differentiate Eq.~`pressure` with Eq.~`compressibility_factor`, at fixed composition and physical parameters"
    status: "Exact derivation"
    description: "Pressure gradient and Hessian on the independent SI temperature/molar-density chart. Here a denotes dimensionless molar residual Helmholtz energy, r denotes molar density, and subscripts denote partial derivatives."
    change_note: "Implemented for the bounded single-component neutral slice by `HelmholtzModel::neutral_property` using the existing Helmholtz tape and falsified by `native.properties.issue10` plus the adapter campaign. Association, electrolyte and active-parameter cases remain unavailable; broader use requires a smooth branch and complete implicit chains."
    math: "\\begin{aligned}\nP_T &= R(r+r^2a_r)+RT r^2a_{Tr},\\\\\nP_r &= RT(1+2ra_r+r^2a_{rr}),\\\\\nP_{TT} &= 2Rr^2a_{Tr}+RT r^2a_{TTr},\\\\\nP_{Tr} &= R(1+2ra_r+r^2a_{rr})+RT(2ra_{Tr}+r^2a_{Trr}),\\\\\nP_{rr} &= RT(2a_r+4ra_{rr}+r^2a_{rrr}).\n\\end{aligned}"
  - eqid: "pure_active_parameter_mapping"
    section: "Native phase coordinates"
    subsection: ""
    source: "EOS parameterized pure-phase coordinate convention"
    status: "Implementation convention"
    description: "Construct the pure nonassociating model from active m, sigma, and epsilon-over-k coordinates."
    change_note: "No generic mutable parameter overlay is introduced."
    math: "\\boldsymbol{\\theta}_{\\mathrm{pure}}\n=\\left(m,\\sigma,\\epsilon/k_B\\right),\n\\qquad\n\\boldsymbol{k}=\\boldsymbol{l}=(0)."
  - eqid: "quadrupolar_helmholtz"
    section: "Contribution intermediates"
    subsection: "Quadrupole-quadrupole"
    source: "[Gross2005], Eq.~(8)"
    status: "Source equation"
    description: "Optional third-order Padé quadrupole-quadrupole Helmholtz contribution; zero when every quadrupolar species is absent."
    change_note: "Admitted as an opt-in family by ADR 0014; it shares the dipole's Padé form and J integrals."
    math: "a^{qq}=\\frac{A_2}{1-A_3/A_2},\\qquad a^{qq}=0\\ \\text{if}\\ A_2=0."
  - eqid: "quadrupolar_second_order"
    section: "Contribution intermediates"
    subsection: "Quadrupole-quadrupole"
    source: "[Gross2005], Eq.~(9) with $q_i=(\\epsilon_i/kT)n_{Q,i}Q_i^{*2}$"
    status: "Exact derivation"
    description: "Second-order quadrupole-quadrupole perturbation term."
    change_note: "The reduced moment $q_i=n_{Q,i}Q_i^2/(4\\pi\\varepsilon_0kTm_i\\sigma_i^5)$ absorbs $\\epsilon_i$."
    math: "A_2=-\\frac{9\\pi}{16}\\widehat{\\rho}\\sum_i\\sum_j x_ix_j\\frac{\\sigma_i^5\\sigma_j^5}{\\sigma_{ij}^7}q_iq_jJ_{2,ij}."
  - eqid: "quadrupolar_third_order"
    section: "Contribution intermediates"
    subsection: "Quadrupole-quadrupole"
    source: "[Gross2005], Eq.~(10) with the same $q_i$ and $J_{3,ij}=0$ (Eq.~(14))"
    status: "Exact derivation"
    description: "Third-order quadrupole-quadrupole perturbation term."
    change_note: "$(4\\pi^2/3)(3/4)^3=9\\pi^2/16$; the sign is positive, as in Eq.~(A11)."
    math: "A_3=\\frac{9\\pi^2}{16}\\widehat{\\rho}^{\\,2}\\sum_i\\sum_j\\sum_k x_ix_jx_k\n\\frac{\\sigma_i^5\\sigma_j^5\\sigma_k^5}{\\sigma_{ij}^3\\sigma_{ik}^3\\sigma_{jk}^3}q_iq_jq_kJ_{3,ijk}."
  - eqid: "reaction_activity_quotient"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Chemical-potential definition on one declared standard-state basis"
    status: "Exact derivation"
    description: "Products-positive reaction quotient from dimensionless activities on one identified basis. Activities and the equilibrium constant must use the same basis."
    change_note: "Zero activities may have limiting values, but logarithmic insertion derivatives are not implied."
    math: "\\mu_i=\\mu_i^{\\circ,b}+RT\\ln a_i^{b},\\qquad\n\\ln Q_b=\\sum_i\\nu_i\\ln a_i^{b},\\qquad\n\\ln K_b=-\\frac{\\sum_i\\nu_i\\mu_i^{\\circ,b}}{RT}."
  - eqid: "reaction_affinity"
    section: "Equilibrium"
    subsection: ""
    source: "Consequence of chemical_potential_stationarity with $\\mathbf{B}\\boldsymbol\\nu=0$"
    status: "Exact derivation"
    description: "Vanishing affinity for every reaction in the nullspace of the balance matrix."
    change_note: "A problem with B = I has no affinity row."
    math: "\\sum_i\\nu_i\\,\\mu_{p,i}=\\boldsymbol\\lambda\\cdot(\\mathbf{B}\\boldsymbol\\nu)+\\varphi_p\\,(\\boldsymbol z\\cdot\\boldsymbol\\nu)=0."
  - eqid: "reaction_constant_coordinate_derivative"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Chain rule for `reaction_constant_ln_polynomial`, the minimum-norm standard state in `chemical_potential_stationarity`, and `implicit_sensitivity`; issue #187 accepted design"
    status: "Exact derivation"
    description: "A fitted source-basis coefficient changes its density-basis reaction target by the same basis function. The source molality scale and reference contraction have no reaction-coefficient dependence. The minimum-norm image supplies chemical-row derivatives, and the existing defining Jacobian supplies the solved-state derivative."
    change_note: "Coefficients a, b, c, d have units 1, K, 1, K⁻¹, with explicit positive Tref. Scalar ln K admits only a with basis 1. Evaluate the coefficient law at the path temperature T(t) for state actions, including its free-temperature chain. For referenced enthalpy actions at fixed temperature, coefficient directions also change the source temperature slope by $\\phi_k'(T)$ and the reaction enthalpy by $RT^2\\phi_k'(T)$. The bounded caloric actions consume the same analytic thermal coefficient terms; outer coefficient Hessians remain outside this consumer set. Source/reference declarations and non-fitted coefficients remain fixed. The stoichiometric matrix N has reactions as rows and species as columns. The constant source reaction-enthalpy shift $h$ (J/mol) at a fixed declared pivot $T_p$ is one derived coefficient direction (#484), preserving the supplied correlation. The existing coefficient chain consumes the combined direction $\\mathbf w$. For the `reaction_constant_log10_reciprocal` view, a native law with $c=e=f=0$ replays as $(A,B,C)=-(b,a,d)/\\ln 10$; source metadata remains caller-owned."
    math: "\\phi_k(T)=\\left(1,\\frac1T,\\ln\\frac{T}{T_{ref}},T\\right)_k,\n\\qquad\n\\frac{\\partial\\ln K_{\\rho,r}}{\\partial\\theta_{r,k}}=\\phi_k(T),\n\\qquad\n\\frac{d}{dT}\\frac{\\partial\\ln K_{src,r}}{\\partial\\theta_{r,k}}=\\phi'_k(T)=\\left(0,-\\frac1{T^2},\\frac1T,1\\right)_k,\n\\qquad\n\\frac{\\partial\\Delta_r h_\\rho}{\\partial\\theta_{r,k}}=RT^2\\phi'_k(T)=(0,-R,RT,RT^2)_k,\n\\qquad\n\\frac{\\partial s_i}{\\partial\\theta_{r,k}}=-\\big(N^+\\big)_{ir}\\phi_k(T),\n\\qquad\n\\frac{d\\mathbf y}{d\\theta_{r,k}}=-\\mathbf F_{\\mathbf y}^{-1}\\mathbf F_{\\theta_{r,k}},\n\\quad \\mathbf F_{\\theta_{r,k}}=\\text{chemical rows only},\n\\qquad\n\\frac{\\partial(a,b,c,d)}{\\partial h}=\\mathbf w=\n\\left(\\frac{1}{RT_p},-\\frac1R,0,0\\right),\\qquad\n\\delta\\ln K=\\frac hR\\left(\\frac1{T_p}-\\frac1T\\right),\\qquad\n\\frac{\\partial\\Delta_r h^\\circ}{\\partial h}=1,\\qquad\n\\delta\\frac{d\\ln K}{d(1/T)}=-\\frac hR."
  - eqid: "reaction_constant_ln_polynomial"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Austgen, Rochelle, Peng and Chen 1989, Ind. Eng. Chem. Res. 28, 1060, ln K(T); Parkhurst and Appelo (2013), USGS Techniques and Methods 6-A43, SOLUTION_SPECIES, printed p.200, analytical expression (https://doi.org/10.3133/tm6A43)."
    status: "Bounded empirical relation"
    description: "Temperature correlation of a reaction equilibrium constant on its declared standard state, with its analytic temperature derivative, which is the van 't Hoff reaction enthalpy on that standard state divided by RT²; valid on the declared temperature domain only."
    change_note: "$T_{ref}>0$ is explicit. A legacy $c\\ln(T/(1\\,\\mathrm K))$ coefficient is normalized without changing values by replacing $a_{old}$ with $a=a_{old}+c\\ln(T_{ref}/(1\\,\\mathrm K))$. Standard-state quantities are held fixed in the displayed derivative; temperature-dependent reference conversions contribute separately. Engine fitting admits stored natural-log coefficients through `reaction_constant_coordinate_derivative`, at first order for state actions and for referenced finite-addition enthalpy actions at fixed temperature. Heat-capacity coefficient actions, coefficient Hessians and referenced free-temperature fitting are not implied; parameter adoption remains application-owned. Coefficients $(a,b,c,d,e,f)$ have units $(1,\\mathrm K,1,\\mathrm K^{-1},\\mathrm K^2,\\mathrm K^{-2})$; temperatures are in kelvin and $K$ is dimensionless on its declared source activity standard. All coefficients are finite and $0<T_{min}\\le T\\le T_{max}$; the interval is inclusive. The two added coefficients default to zero and remain fixed during fitting. PHREEQC's $\\log_{10}K=A_1+A_2T+A_3/T+A_4\\log_{10}[T/(1\\,\\mathrm K)]+A_5/T^2+A_6T^2$ maps, for the same reaction direction and source standard, by the displayed coefficient conversion."
    math: "\\begin{gathered}\nL(T)\\equiv\\ln K=a+\\frac bT+c\\ln\\frac{T}{T_{ref}}+dT+\\frac e{T^2}+fT^2,\\qquad \\Delta_r h^{\\circ}=RT^2 L'(T),\\\\\nL'=-\\frac b{T^2}+\\frac cT+d-\\frac{2e}{T^3}+2fT,\\qquad L''=\\frac{2b}{T^3}-\\frac c{T^2}+\\frac{6e}{T^4}+2f,\\qquad L'''=-\\frac{6b}{T^4}+\\frac{2c}{T^3}-\\frac{24e}{T^5},\\\\\na=\\ln(10)A_1+A_4\\ln[T_{ref}/(1\\,\\mathrm K)],\\quad b=\\ln(10)A_3,\\quad c=A_4,\\quad d=\\ln(10)A_2,\\quad e=\\ln(10)A_5,\\quad f=\\ln(10)A_6.\n\\end{gathered}"
  - eqid: "reaction_constant_log10_reciprocal"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "The −log10 K = a/T + b + cT form as recorded for MEA reaction R5 in the MEA-Thermodynamics source specification (Aroua 1999, Tong 2012)"
    status: "Bounded empirical relation"
    description: "Temperature correlation of a reaction equilibrium constant in decadic-logarithm form, converted to the natural logarithm, with its analytic temperature derivative; fitting uses the explicitly converted native coefficients; valid on the declared temperature domain only."
    change_note: "The three-coefficient view requires native $c=e=f=0$; otherwise it is refused. Source notation ln(T) means ln(T/(1 K)); coefficients use the numerical Kelvin convention. Standard-state quantities are held fixed in the displayed derivative; temperature-dependent reference conversions contribute separately. Engine fitting admits stored natural-log coefficients through `reaction_constant_coordinate_derivative`, at first order only; parameter adoption remains application-owned."
    math: "-\\log_{10}K=\\frac{a}{T}+b+cT,\\qquad \\ln K=-\\ln 10\\left(\\frac{a}{T}+b+cT\\right),\\qquad \\frac{d\\ln K}{dT}=\\ln 10\\left(\\frac{a}{T^2}-c\\right)"
  - eqid: "reaction_standard_state_conversion"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Invariance of chemical potential under a declared standard-state change"
    status: "Exact derivation"
    description: "Convert a reaction constant only from explicit per-species standard chemical-potential offsets. Units alone do not define a conversion."
    change_note: "Mole-fraction uses explicit dimensionless standard fraction one; molarity and molality require explicit positive standard concentration or molality and the matching coefficient/reference path."
    math: "\\ln K_c=\\ln K_b+\\frac{1}{RT}\\sum_i\\nu_i\\left(\\mu_i^{\\circ,b}-\\mu_i^{\\circ,c}\\right)."
  - eqid: "reaction_standard_state_polynomial_image"
    section: "Equilibrium"
    subsection: "Reaction standard states"
    source: "Integration of $\\Delta c_p(T)=\\Delta c_{p,0}+\\Delta c_p'(T-T_0)$ into Eq.~`reaction_standard_state_conversion`; owner decision 2026-09-21 (#84)"
    status: "Exact derivation"
    description: "A standard-state change whose old-minus-new reaction enthalpy, entropy, heat capacity and heat-capacity slope are known at $T_0$ shifts $\\ln K$ by a member of the `reaction_constant_ln_polynomial` family, so one correlation form carries the change exactly through every temperature derivative. Zero heat-capacity terms give the constant-enthalpy shift."
    change_note: "Its implementation replaces the former constant-enthalpy point-conversion routine; the general identity in `reaction_standard_state_conversion` remains its source. The reference-state pressure path is not part of this identity; a fixed-pressure or system-pressure reference chain contributes separately."
    math: "\\frac{\\Delta g(T)}{RT}=\\frac{C_0}{T}+C_1+C_2\\ln\\frac{T}{T_0}+C_3T,\\qquad\nC_0=\\frac{\\Delta h_0-\\Delta c_{p,0}T_0+\\tfrac12\\Delta c_p'T_0^2}{R},\\quad\nC_1=\\frac{\\Delta c_{p,0}-\\Delta s_0}{R},\\quad\nC_2=\\frac{\\Delta c_p'T_0-\\Delta c_{p,0}}{R},\\quad\nC_3=-\\frac{\\Delta c_p'}{2R},\\\\\n\\delta L'=-\\frac{\\Delta h(T)}{RT^2},\\qquad\n\\delta L''=\\frac{2\\Delta h(T)}{RT^3}-\\frac{\\Delta c_p(T)}{RT^2},\\qquad\n\\delta L'''=-\\frac{6\\Delta h(T)}{RT^4}+\\frac{4\\Delta c_p(T)}{RT^3}-\\frac{\\Delta c_p'}{RT^2}."
  - eqid: "reduced_hessian_stability"
    section: "Equilibrium"
    subsection: ""
    source: "Second-order sufficient condition for a constrained local minimum"
    status: "Exact derivation"
    description: "Reduced Lagrangian Hessian over the constraint nullspace is positive definite."
    change_note: "Sufficient strict local minimum condition at a regular stationary point; neither necessary in degenerate cases nor a global certificate."
    math: "\\mathbf{Z}^{\\mathsf T}\\,\\nabla^{2}\\mathcal{L}\\,\\mathbf{Z}\\succ 0."
  - eqid: "reference_limit_terminal_pair"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "Finite terminal-change diagnostic for the declared reference molality sequence."
    status: "Implementation convention"
    description: "Pinned qualification comparison for the former finite-molality reference. It extrapolates the 1e-12 and 1e-14 mol/kg points and reports its change from the 1e-10/1e-12 pair. It is not the runtime reference after #823."
    change_note: "Convergence diagnostic; neither an error bound nor an estimate of actual bias without additional convergence assumptions. The neutral limit removes the Debye-Hueckel c sqrt(m) tail exactly; an O(m) remainder d m leaves -d 1e-13. For Held 2014 NaCl in water at 298.15 K, e_f is 1.3e-11 against raw rung changes of 1.06e-5."
    math: "\\Delta_k=f(m_k)-f(m_{k-1}),\\qquad\n\\hat f_k=\\frac{10f(m_k)-f(m_{k-1})}{9},\\quad m_k=m_{k-1}/100,\\quad e_f=s\\,|\\hat f_{10^{-14}}-\\hat f_{10^{-12}}|."
  - eqid: "reference_mixed_temperature_pressure_derivatives"
    section: "Properties"
    subsection: "Reaction references"
    source: "Differentiation of `neutral_reaction_reference_transfer` with the single-insertion construction; issue #225, sections 2–3 and F8/F9"
    status: "Exact derivation"
    description: "Raw SI derivatives through fourth temperature/pressure order, and through third temperature/pressure order with one active EOS-coordinate partial. No repeated parameter derivatives or dilution-composition derivatives are consumed."
    change_note: "Each column differentiates the returned analytic reference at the ion-free solvent state using `reference_single_insertion_taylor`. Columns retain independent action diagnostics and causes. The existing scaled comparison with `reference_limit_terminal_pair` is qualification evidence only; no terminal sequence is evaluated in runtime."
    math: "C_{ab}=\\partial_T^a\\partial_{P_{src}}^b C,\\quad a+b\\le4,\\qquad\nC_{ab,\\theta}=\\partial_T^a\\partial_{P_{src}}^b\\partial_\\theta C,\\quad a+b\\le3,\\\\\nC_T=\\frac{h^{res}+RT}{RT^2},\\qquad C_P=-\\frac{v}{RT}\\quad\\text{(identical neutral species, }C=-\\Lambda\\text{)}."
  - eqid: "reference_molality_sequence"
    section: "Electrolyte reference states and reported activities"
    subsection: ""
    source: "EOS convergence sequence for the [Figiel2025] infinite-dilution reference"
    status: "Implementation convention"
    description: "Historical finite-molality inputs retained only for qualification of `infinite_dilution_reference`. No runtime ladder remains."
    change_note: "The paired baseline declaration and numerical record of #823 identify the old inputs and extrapolation. Terminal changes are convergence diagnostics, not certified error bounds. The runtime molality is now exactly zero and terminal-change fields are unavailable; solvent-root and association diagnostics remain defined."
    math: "\\mathcal M_{\\mathrm{ref}}=\\{10^{-6},10^{-8},10^{-10},10^{-12},10^{-14}\\}\\,\\mathrm{mol\\,kg^{-1}},\\qquad \\widehat{\\ln\\phi_i^\\infty}=\\frac{10\\ln\\phi_i(10^{-14}\\,\\mathrm{mol\\,kg^{-1}})-\\ln\\phi_i(10^{-12}\\,\\mathrm{mol\\,kg^{-1}})}{9}."
  - eqid: "reference_single_insertion_taylor"
    section: "Helmholtz derivatives"
    subsection: "Reference derivatives"
    source: "Taylor expansion of the neutral reaction contraction and implicit pressure closure; issue #225, section 3"
    status: "Exact derivation"
    description: "One fixed-volume amount insertion in the extensive reduced residual Helmholtz energy supplies gradient coefficients along a pressure-closed, fixed-composition base path. Temperature and EOS coordinates can move. Orders one and two also supply the lower reference slopes. The degree-seven/nine evaluations are bounded reference calculations, not unrestricted energy derivative surfaces."
    change_note: "The same central unweighted site Jacobian eliminates association through degree nine. At an ion-free reference, a separate tape reuses the regular scalar contributions and Born radial work while excluding the analytically zero DH insertion; ordinary state admission is unchanged. Two amount insertions start above the extracted degree. No zero-concentration ionic Hessian is evaluated. Coefficients retain factorials until mixed extraction, and physical normalization is restored once. Mask pure-selected species from the solvent insertion and add their pure-state insertions. Fixed-source system-pressure derivatives are zero."
    math: "z(t)=z_0+\\sum_{j=1}^{r}z_jt^j,\\quad r\\in\\{0,1,2,3,4\\},\\qquad\n[t^k]D\\psi(z(t))[u]=\\frac12[t^{r+1+k}]\n\\{\\psi(z(t)+ut^{r+1})-\\psi(z(t)-ut^{r+1})\\},\\quad 0\\le k\\le r,\\\\\nD^4\\psi[u,v,v,v]=\\frac{3!}{2}[t^7]\\{\\psi(z_0+vt+ut^4)-\\psi(z_0+vt-ut^4)\\},\\\\\nD^5\\psi[u,v,v,v,v]=\\frac{4!}{2}[t^9]\\{\\psi(z_0+vt+ut^5)-\\psi(z_0+vt-ut^5)\\},\\\\\np(t)=RT(t)\\{V(t)^{-1}-D\\psi(z(t))[e_V]\\},\\qquad\nV_k=\\frac{[t^k]P_{src}(t)-[t^k]p(z(t))|_{V_k=0}}{p_V(z_0)},\\\\\nC(t)=-\\Delta\\nu\\ln(V(t)\\rho_0)+D\\psi(z(t))[\\nu],\\qquad\nz_{j,n}=0\\quad(j>0)."
  - eqid: "reference_species_calorics"
    section: "Reference thermochemistry"
    subsection: "Declared derivations"
    source: "Gibbs-Helmholtz and Gibbs derivatives, using standard_pressure_density_conversion and the owner-selected anchored Gibbs construction in [issue #225](https://github.com/tannerpolley/ePC-SAFT/issues/225), sections 1–3, D1(a)/D2/broadened D5"
    status: "Exact derivation"
    description: "Supplied species records anchor density-standard Gibbs energy, enthalpy and entropy. Record-less species and every consumed derivative are completed through the same stoichiometric system. Its remaining null space must be the charge gauge, which cancels in electroneutral phases and neutral directions. The chemical rows' minimum-norm representative preserves affinities but cannot replace these caloric anchors."
    change_note: "The completion checks consistency with supplied records on the selected smooth interval. Each raw derivative retains its own admission status. The bounded reference inventory is T/P order at most four and T/P order at most three with one EOS-coordinate derivative. Source coefficients are evaluated at the path temperature. Missing anchors, an undetermined neutral combination, or a singular chart cannot be supplied by a gauge. Numerical availability is qualified by the retained notebook, not by this equation definition."
    math: "g_{\\rho,i}^{\\circ}=h_{P,i}^{\\circ}-T s_{P,i}^{\\circ}\n +RT\\ln\\frac{RT\\rho_0}{P_0}\\quad(i\\in S),\\qquad \\rho_0=1\\ \\mathrm{mol/m^3},\\\\\n\\boldsymbol\\nu_D\\mathbf f_D^{\\circ}=\\Delta_r\\mathbf f_\\rho-\\boldsymbol\\nu_S\\mathbf f_S^{\\circ},\n\\qquad\\mathcal N(\\boldsymbol\\nu_D)\\subseteq\\operatorname{span}(\\mathbf z_D),\\\\\nL=\\ln K_\\rho=\\ln K_{src}+A+C,\\qquad\n\\Delta_r g_\\rho=-RTL,\\quad\\Delta_r h_\\rho=RT^2L_T,\\quad\n\\Delta_r s_\\rho=R(L+TL_T),\\quad\\Delta_r c_{p,\\rho}=R(2TL_T+T^2L_{TT}),\\\\\nh=\\sum_i x_i(g_{\\rho,i}^{\\circ}-Tg_{\\rho,i,T}^{\\circ}+RT)+h^{res},\\\\\ns=\\sum_i x_i\\left[-g_{\\rho,i,T}^{\\circ}+R-R\\ln\\frac{x_i\\rho}{\\rho_0}\\right]+s_{TV}^{res},\n\\qquad c_p=\\sum_i x_i(-Tg_{\\rho,i,TT}^{\\circ}+R)+c_p^{res}.\n$$\n\nFor a raw T/P derivative of a reaction reference, all lower product terms remain:\n\n$$\n\\partial_T^a\\partial_P^b(-RT C)\n=-R\\left(TC_{ab}+aC_{a-1,b}\\right)."
  - eqid: "repeated_direction_energy_third"
    section: "Helmholtz derivatives"
    subsection: "Directional actions"
    source: "Multivariate Taylor expansion with one direction inserted at order three and the repeated direction at order one"
    status: "Exact derivation"
    description: "Cancellation-resistant third directional energy action with two equal directions. Brackets extract a Taylor coefficient, not a finite step evaluation; all derivatives include the same implicit association solution."
    change_note: "Pure fifth-order terms cancel and terms with two copies of u start at order six. This evaluates a third derivative, not a public fifth-derivative capability. Normalize directions before coefficient evaluation and restore their three norms afterwards. No association equation or physical parameter changes."
    math: "[t^5]F(p+vt\\pm ut^3)=\\frac{D^5F[v,v,v,v,v]}{120}\n\\pm\\frac{D^3F[u,v,v]}{2},\\\\\nD^3F[u,v,v]=[t^5]\\{F(p+vt+ut^3)-F(p+vt-ut^3)\\}."
  - eqid: "residual_chemical_potential"
    section: "Thermodynamic properties"
