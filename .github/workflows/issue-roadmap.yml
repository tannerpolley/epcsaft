name: Reconcile issue roadmap

# Hourly plus manual only: agents apply the reconciler locally after each change, and
# per-event triggers queued bursts that cancelled pending runs and reported spurious failures.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-roadmap
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile derived issue status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 tools/reconcile-issue-roadmap.py
          --repo "$GITHUB_REPOSITORY"
          --apply
