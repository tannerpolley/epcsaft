name: Documentation

on:
  push:
    branches: [main]
    paths: &docs-paths
      - 'docs/**'
      - 'engine/**'
      - 'data/packets/**'
      - 'data/packet-locks.json'
      - 'analyses/**/inputs/**'
      - 'tools/**'
      - '.codex/environments/**'
      - '.github/workflows/docs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'README.md'
  pull_request:
    branches: [main]
    paths: *docs-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EPCSAFT_IPOPT_LINEAR_SOLVER: mumps
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native prerequisites
        run: |
          nice -n 10 sudo apt-get update -qq
          nice -n 10 sudo apt-get install -y --no-install-recommends build-essential ca-certificates \
            clang-format-18 cmake coinor-libipopt-dev file git libceres-dev libeigen3-dev \
            ninja-build pkg-config time
          test "$(pkg-config --modversion ipopt)" = 3.11.9
          dpkg-query -W -f='${Version}\n' libceres-dev | grep -E '^2\.2\.'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.28'
          python-version: '3.13'
          enable-cache: false
      - name: Provision external IDAES build tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export IDAES_DATA="$RUNNER_TEMP/epcsaft-docs-idaes"
          printf 'IDAES_DATA=%s\nPYOMO_CONFIG_DIR=%s\n' "$IDAES_DATA" "$IDAES_DATA" >> "$GITHUB_ENV"
          # These upstream executables contain HSL. Keep all bytes and notices outside
          # the checkout, Engine builds, documentation payloads and shared caches.
          mkdir -p "$IDAES_DATA/bin" "$IDAES_DATA/downloads"
          nice -n 10 gh release download 3.4.2 --repo IDAES/idaes-ext \
            --pattern idaes-solvers-ubuntu2204-x86_64.tar.gz \
            --pattern idaes-lib-ubuntu2204-x86_64.tar.gz --dir "$IDAES_DATA/downloads"
          cd "$IDAES_DATA/downloads"
          sha256sum --check <<'SHA256'
          f370fa258cc457cd84fd9fe4298bde55dfc03374b607e68aa4d38f24ad9730e5  idaes-solvers-ubuntu2204-x86_64.tar.gz
          341470b4b0b9d67758cfde6f3246ed3a3d08000e2306908186435262d5751184  idaes-lib-ubuntu2204-x86_64.tar.gz
          SHA256
          nice -n 10 tar -xzf idaes-solvers-ubuntu2204-x86_64.tar.gz -C "$IDAES_DATA/bin"
          nice -n 10 tar -xzf idaes-lib-ubuntu2204-x86_64.tar.gz -C "$IDAES_DATA/bin"
      - name: Build site and execute notebooks
        run: nice -n 10 bash tools/build-docs.sh
      # Keep the site only when the deploy job will publish it; keep records only after a failure.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.event.repository.private == false &&
          vars.DOCS_PAGES_ENABLED == 'true'
        with:
          name: docs-site
          path: build/docs/html/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: docs-records
          retention-days: 3
          path: |
            build/docs/*-build.log
            build/docs/*-warnings.log
            build/docs/outer-mumps.log
            build/docs/timing.json
            build/docs/doctest/output.txt
            build/docs/jupyter_execute/**/*.ipynb
            build/docs/jupyter_execute/**/*.json
            build/docs/jupyter_execute/**/*.png

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.event.repository.private == false &&
      vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docs-site
          path: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
