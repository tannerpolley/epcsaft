[project]
name = "epcsaft-workspace"
version = "1.1.0"
description = "Private development workspace for the unified ePC-SAFT project"
license = { file = "LICENSE" } # GPLv3 with the Ipopt section 7 permission
requires-python = ">=3.13"
dependencies = [
  "idaes-pse==2.12.0",
  "matplotlib>=3.10",
  "meson>=1.8",
  "meson-python>=0.18",
  "mypy>=1.17",
  "numpy>=2.1,<3",
  "pandas>=2.3",
  "patchelf>=0.11",
  "pyomo==6.10.1",
  "nanobind==2.12.0",
  "pytest>=8,<10",
  "ruff>=0.12",
  "scipy>=1.15,<2",
]

[tool.pyright]
# Pyright ignores .gitignore: scope it to the package, tests, tools and docs so build/ and analyses/ stay unscanned.
include = ["engine/src", "engine/tests", "engine/tools", "engine/scripts", "tools", "docs"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
docs = [
    "sphinx==9.1.1",
    "sphinx-autoapi==3.8.1",
    "pydata-sphinx-theme==0.23.0",
    "myst-nb==1.4.0",
    "myst-parser==5.1.0",
    "sphinx-design==0.7.0",
    "sphinx-copybutton==0.5.2",
    "ipykernel==7.4.0",
]
dev = [
    "auditwheel==6.8.2",
    "chemicals==1.5.2",
]
