[project]
name = "epcsaft-workspace"
version = "0.0.0"
description = "Private development workspace for the unified ePC-SAFT project"
requires-python = ">=3.13"
dependencies = [
  "idaes-pse==2.12.0",
  "matplotlib>=3.10",
  "meson>=1.8",
  "meson-python>=0.18",
  "mypy>=1.17",
  "numpy>=2.1,<3",
  "pandas>=2.3",
  "patchelf>=0.11",
  "pyomo==6.10.1",
  "nanobind==2.12.0",
  "pytest>=8,<10",
  "ruff>=0.12",
  "scipy>=1.15,<2",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["engine"]

[dependency-groups]
dev = [
    "chemicals==1.5.2",
]
