native:
  root: engine/native
  shared_library: epcsaft_native
  private_archive_consumer: epcsaft_asl
  extension: epcsaft._core
  checker: tools/check-engine-architecture.py
  # Downward only. bindings may include anything; nothing includes bindings.
  layers: [core, contributions, properties, equilibrium, regression, surface, bindings]
  layer_content:
    core: policy, the declared-choice and convergence contracts, the trace
    contributions: ideal-gas and individual residual Helmholtz formulations; no CppAD-specific types or equilibrium solver
    properties: Ideal, Residual and Total outputs derived from Contributions, reusable state evaluation and exact derivatives; no phase-equilibrium solver
    equilibrium: one equilibrium driver, shared rows and branch continuation; explicit native tangent-plane testing and phase discovery
    regression: parameter fitting against declared problems
    surface: the parameter builder, which model is asked for
    bindings: the only nanobind includes
  # regression/ may call solve_equilibrium and solve_phase_boundary on a problem
  # with declared phases; it may not reach phase stability, because a fit needs
  # differentiable residuals and a discovered phase count is not one.
  regression_boundary:
    permitted: [equilibrium/problem.hpp, solve_equilibrium, solve_phase_boundary, properties/helmholtz_model.hpp]  # documentation only; no checker reads this list
    forbidden: [phase_stability.hpp, find_phases, problems with omitted topology]
  invariants:
    native_pic_object_sets: 1
    private_static_archives: 1
    native_extensions: 1
    python_inside_native_library: forbidden
    installed_headers: forbidden
    public_cpp_abi: forbidden
    iterative_python_callbacks: forbidden
    constant_defined_twice: forbidden
    category_one_constants_home: core/physical_constants.hpp

python:
  root: engine/src/epcsaft
  # Python maps inputs to _core and _core results to types. It performs no
  # arithmetic: a frontend call is agnostic to what it is solving.
  numerics: forbidden
  capabilities: [eos, equilibrium, regression]

formulation:
  document: engine/docs/equilibrium/formulation.md
  algorithms: engine/docs/science/algorithms.md
  # All admitted specifications use one driver and shared energy/row owners.
  # Its numerical method and curvature must be qualified for each admitted domain.
  equilibrium_drivers: 1
  not_expressible: [solids, augmented critical-point equations, kinetics]

naming:
  # No proper nouns in identifiers. Source names are citations, not symbols.
  # HELD in particular read as the wrong author here: Christoph Held is a
  # parameter source in this repository's bibliography, and the algorithm is not
  # his.
  proper_nouns_in_identifiers: forbidden
  retired: [HELD, Held2, GREPE, Provider, step numbering]

evidence:
  # Tests follow the Python side, because a test is written against a
  # user-facing claim, not a compilation unit. No numerical/behavior split.
  organisation: by_capability
  basis: independent analytic identities, measurements, evaluated references, and source-model comparisons
  route_specific_gates: forbidden
  downstream_specific_flags: forbidden

scientific_boundaries:
  reusable_packets: data
  installed_artifact_evidence: analyses
  packet_access: explicit_materialization_only
  sibling_discovery: forbidden

build_invariants:
  distributions: 1
  versions: 1
  wheels: 1
  meson_roots: 1
  editable_downstream_dependencies: forbidden
  compatibility_aliases: forbidden
  mutable_wheel_inputs: forbidden
  third_party_cmake_use: ceres_package_lookup_only
  inferred_parameter_defaults: forbidden
